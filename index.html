<style>
/* ============================================================
   re:act note — design system
   「休日の午後、静かなカフェで自分のことを少し考える時間。」
   くすんだ自然色 / 大きめの余白 / 柔らかい角丸 / 控えめな動き
   ============================================================ */
:root{
  /* base ── 朝の光が入る、明るい文具店 */
  --bg:#FCFAF6;
  --surface:#FFFFFF;
  --surface-2:#F7F2EA;
  --surface-3:#F1EAE0;
  --text:#48423C;
  --text-sub:#6E655D;
  --text-faint:#948A80;
  --line:#EFE8DE;
  --line-strong:#E3DACD;
  /* hue ── 少し明るく、透明感を出す */
  --rose:#D3A7A2;
  --rose-soft:#FAEFEC;
  --sage:#9BB08E;
  --sage-soft:#ECF1E7;
  --sage-deep:#5C6F54;
  --lavender:#B9AFD0;
  --lavender-soft:#F2EEF9;
  --sand:#DDCBB2;
  --sand-soft:#F9F2E7;
  --terracotta:#A96A4C;
  /* roles */
  --accent:#A8BF9C;          /* ボタン：明るいセージ */
  --accent-soft:var(--sage-soft);
  --on-accent:#31402A;       /* その上の文字：深いセージ */
  --risk:#A96A4C;            /* 守りに入る反応：テラコッタ */
  --risk-soft:#FBEDE4;
  --focus:#5C6F54;
  /* shape */
  --r-lg:26px; --r-md:20px; --r-sm:14px; --r-pill:999px;
  --shadow:0 1px 2px rgba(72,66,60,.025), 0 14px 32px -20px rgba(72,66,60,.12);
  --shadow-sm:0 1px 2px rgba(72,66,60,.03);
  --maxw:640px;
  /* character ── 背景になじみつつ、沈まない明るさ */
  --ch-bg:#F0E8DC; --ch-body:#C6B7A0; --ch-body2:#DED2BE;
  --ch-ink:#4E453D; --ch-accent:#CE9E99;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#221F1C;
    --surface:#2A2724;
    --surface-2:#33302C;
    --surface-3:#3B3733;
    --text:#EFE9E1;
    --text-sub:#C2B9AE;
    --text-faint:#978D83;
    --line:#3A3531;
    --line-strong:#4C4640;
    --rose:#C79A96;
    --rose-soft:#3A302E;
    --sage:#9BAF92;
    --sage-soft:#2E342B;
    --lavender:#B7ADCA;
    --lavender-soft:#332F3A;
    --sand:#CBB89E;
    --sand-soft:#38322A;
    --terracotta:#C68A72;
    --sage-deep:#9BAF92;
    --accent:#9BAF92;
    --accent-soft:#2E342B;
    --on-accent:#23261F;
    --risk:#C68A72;
    --risk-soft:#3A2E28;
    --focus:#9BAF92;
    --shadow:0 1px 2px rgba(0,0,0,.18), 0 10px 28px -16px rgba(0,0,0,.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,.2);
    --ch-bg:#332F2A; --ch-body:#ABA294; --ch-body2:#8A8173;
    --ch-ink:#241F1B; --ch-accent:#C79A96;
  }
}
:root[data-theme="dark"]{
  --bg:#221F1C; --surface:#2A2724; --surface-2:#33302C; --surface-3:#3B3733;
  --text:#EFE9E1; --text-sub:#C2B9AE; --text-faint:#978D83;
  --line:#3A3531; --line-strong:#4C4640;
  --rose:#C79A96; --rose-soft:#3A302E; --sage:#9BAF92; --sage-soft:#2E342B;
  --lavender:#B7ADCA; --lavender-soft:#332F3A; --sand:#CBB89E; --sand-soft:#38322A;
  --terracotta:#C68A72; --sage-deep:#9BAF92; --accent:#9BAF92; --accent-soft:#2E342B; --on-accent:#23261F;
  --risk:#C68A72; --risk-soft:#3A2E28; --focus:#9BAF92;
  --shadow:0 1px 2px rgba(0,0,0,.18), 0 10px 28px -16px rgba(0,0,0,.5);
  --shadow-sm:0 1px 2px rgba(0,0,0,.2);
  --ch-bg:#332F2A; --ch-body:#ABA294; --ch-body2:#8A8173; --ch-ink:#241F1B; --ch-accent:#C79A96;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  font-size:16.5px;
  line-height:1.95;
  letter-spacing:.02em;
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
.round{font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Hiragino Sans","Noto Sans JP",sans-serif;}
.wrap{
  max-width:var(--maxw);margin:0 auto;
  padding:0 20px calc(72px + env(safe-area-inset-bottom));
}
h1{font-size:1.34rem;line-height:1.7;margin:0 0 14px;font-weight:700;letter-spacing:.01em;}
h2{font-size:1.08rem;line-height:1.7;margin:0 0 12px;font-weight:700;letter-spacing:.01em;}
h3{font-size:.98rem;margin:0 0 10px;color:var(--text-sub);font-weight:700;}
p{margin:0 0 16px;}
strong{font-weight:700;}
.muted{color:var(--text-sub);}
.faint{color:var(--text-faint);}
.center{text-align:center;}

/* ---------- cards ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:26px 22px;
  margin:0 0 18px;
  box-shadow:var(--shadow-sm);
}
.card.inner{background:var(--surface-2);box-shadow:none;border-radius:var(--r-md);padding:20px 18px;margin-top:16px;}
.note{
  background:var(--sand-soft);
  border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:16px 18px;
  font-size:.85rem;line-height:1.9;
  color:var(--text-sub);
  margin:0 0 18px;
}
.flag{
  border:1px solid var(--line);border-radius:var(--r-md);
  padding:15px 17px;font-size:.86rem;line-height:1.9;color:var(--text-sub);
  margin:0 0 12px;background:var(--surface-2);
}
.disclaimer{font-size:.8rem;line-height:1.9;color:var(--text-sub);}
hr.sep{border:none;border-top:1px solid var(--line);margin:26px 0;}
.hidden{display:none !important;}
.prose{font-size:.97rem;line-height:2.05;}
.prose p{margin:0 0 16px;}
.prose.long{margin-top:20px;padding-top:20px;border-top:1px solid var(--line);}
.sec-k{
  font-size:.74rem;letter-spacing:.16em;color:var(--text-faint);
  margin-bottom:12px;
}
.group-title{
  font-size:.74rem;letter-spacing:.14em;color:var(--text-faint);
  margin:0 0 16px;padding-bottom:8px;border-bottom:1px solid var(--line);
}

/* ---------- buttons ---------- */
button{font-family:inherit;font-size:1rem;color:inherit;letter-spacing:.02em;}
.btn{
  display:block;width:100%;
  min-height:56px;padding:16px 20px;
  background:var(--accent);color:var(--on-accent);
  border:none;border-radius:var(--r-pill);
  font-size:1rem;font-weight:700;cursor:pointer;
  box-shadow:var(--shadow);
  transition:transform .2s ease-out, opacity .2s ease-out;
}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.4;cursor:default;}
.btn-alt{background:var(--risk-soft);color:var(--risk);box-shadow:var(--shadow-sm);}
.btn-sub{
  display:block;width:100%;
  min-height:52px;padding:14px 20px;
  background:transparent;color:var(--text-sub);
  border:1px solid var(--line-strong);border-radius:var(--r-pill);
  font-size:.92rem;cursor:pointer;margin-top:12px;
  transition:background .2s ease-out;
}
.btn-sub:active{background:var(--surface-2);}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:6px;}

/* ---------- brand ---------- */
.logo{
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Hiragino Sans",sans-serif;
  font-size:2.1rem;font-weight:700;letter-spacing:.01em;line-height:1;
  color:var(--text);
}
.logo .c{color:var(--rose);padding:0 .02em;}
.logo-sm{font-size:1.05rem;font-weight:700;letter-spacing:.02em;}
.logo-sm .c{color:var(--rose);}
.brand-lead{
  font-size:1.22rem;line-height:1.85;font-weight:700;margin:22px 0 16px;
  letter-spacing:.01em;
}
.brand-body{font-size:.95rem;line-height:2.1;color:var(--text-sub);margin:0 0 18px;}
.hero-art{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin:6px 0 2px;}
.hero-art .fig{width:86px;opacity:.95;}
.hero-art .fig:nth-child(2){width:104px;margin-bottom:-6px;}
.hero-art .fig:nth-child(1),.hero-art .fig:nth-child(3){opacity:.7;}
.meta-row{
  display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;
  font-size:.76rem;color:var(--text-faint);margin-top:16px;
}
.meta-row span{display:inline-flex;align-items:center;gap:6px;}
.dot{width:4px;height:4px;border-radius:50%;background:var(--line-strong);display:inline-block;}
.lead-list{display:flex;flex-direction:column;gap:12px;margin:20px 0;}
.lead-i{display:flex;gap:12px;align-items:flex-start;font-size:.92rem;line-height:1.85;color:var(--text-sub);}
.lead-i span{
  flex:0 0 auto;width:22px;height:22px;border-radius:50%;
  background:var(--lavender-soft);color:var(--lavender);
  font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:6px;
}

/* ---------- progress ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--bg);
  padding:calc(12px + env(safe-area-inset-top)) 0 10px;
}
.topbar-inner{max-width:var(--maxw);margin:0 auto;padding:0 20px;}
.progress-meta{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:.74rem;color:var(--text-faint);margin-bottom:8px;letter-spacing:.06em;
}
.progress-track{height:2px;background:var(--line);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);width:0;transition:width .34s ease-out;}

/* ---------- question ---------- */
.section-tag{
  display:inline-block;font-size:.72rem;letter-spacing:.12em;
  color:var(--sage-deep);background:var(--sage-soft);
  border-radius:var(--r-pill);padding:5px 14px;margin-bottom:20px;
}
.scenario{
  background:var(--surface-2);
  border-radius:var(--r-md);
  padding:18px 18px;
  margin:0 0 22px;
  font-size:.97rem;line-height:2;color:var(--text);
}
.qtext{font-size:1.06rem;line-height:1.85;margin:0 0 8px;font-weight:700;}
.qhint{font-size:.85rem;line-height:1.85;color:var(--text-sub);margin:0 0 20px;}
.opts{display:flex;flex-direction:column;gap:12px;}
.opt{
  display:block;width:100%;text-align:left;
  background:var(--surface);
  border:1px solid var(--line-strong);
  border-radius:var(--r-md);
  padding:17px 18px;
  font-size:.97rem;line-height:1.85;
  cursor:pointer;
  transition:border-color .18s ease-out, background .18s ease-out, transform .18s ease-out;
}
.opt:active{transform:translateY(2px);background:var(--surface-2);}
.opt.sel{border-color:var(--sage);background:var(--sage-soft);}
.opt.sel-2{border-color:var(--rose);background:var(--rose-soft);}
.scale{display:flex;flex-direction:column;gap:9px;}
.scale .opt{padding:14px 18px;display:flex;align-items:center;gap:14px;}
.scale-num{
  flex:0 0 auto;width:26px;height:26px;border-radius:50%;
  border:1px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;
  font-size:.76rem;color:var(--text-faint);
}
.opt.sel .scale-num{border-color:var(--sage);color:var(--sage);}
.subq{font-size:.94rem;font-weight:700;margin:22px 0 12px;}
.subq.second{margin-top:30px;padding-top:24px;border-top:1px solid var(--line);}
.nav{display:flex;gap:12px;margin-top:26px;}
.nav button{
  flex:1;min-height:50px;padding:13px;border-radius:var(--r-pill);
  border:1px solid var(--line-strong);background:transparent;color:var(--text-sub);
  font-size:.92rem;cursor:pointer;
}
.nav button:disabled{opacity:.3;cursor:default;}
.nav .next{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700;}

/* ---------- chapter ---------- */
.checkpoint{text-align:center;padding:44px 22px;background:var(--surface);}
.cp-n{font-size:.72rem;letter-spacing:.2em;color:var(--text-faint);}
.cp-t{font-size:1.6rem;font-weight:700;margin:10px 0 16px;line-height:1.6;}
.cp-c{font-size:.95rem;line-height:2;color:var(--text-sub);}
.cp-next{font-size:.95rem;font-weight:700;margin-bottom:8px;}
.cp-fig{width:88px;margin:0 auto 18px;}

/* ---------- analyzing ---------- */
.analyzing{
  min-height:70vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;gap:18px;
}
.an-line{font-size:1.05rem;line-height:1.9;color:var(--text-sub);min-height:2em;}
.an-dots{display:flex;gap:7px;}
.an-dots i{
  width:6px;height:6px;border-radius:50%;background:var(--line-strong);
  animation:pulse 1.4s ease-in-out infinite;
}
.an-dots i:nth-child(2){animation-delay:.18s;}
.an-dots i:nth-child(3){animation-delay:.36s;}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1;background:var(--sage)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fade{animation:fadeUp .34s ease-out both;}

/* ---------- characters ---------- */
svg{max-width:100%;height:auto;display:block;}
.ch-bg{fill:var(--ch-bg);}
.ch-body{fill:var(--ch-body);}
.ch-body2{fill:var(--ch-body2);}
.ch-ink{fill:var(--ch-ink);}
.ch-accent{fill:var(--ch-accent);}
.ch-line{fill:none;stroke:var(--ch-ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.ch-s2{fill:none;stroke:var(--ch-body2);stroke-linecap:round;stroke-linejoin:round;}
.ch-s3{fill:none;stroke:var(--ch-body);stroke-linecap:round;stroke-linejoin:round;}

/* ---------- result hero ---------- */
.hero{padding:32px 22px 28px;text-align:center;background:linear-gradient(176deg,#FFFFFF 0%,#FDFBF7 46%,var(--sage-soft) 100%);}
.hero-t{font-size:.74rem;letter-spacing:.16em;color:var(--text-faint);margin-bottom:6px;}
.hero-art-lg{width:148px;margin:14px auto 10px;}
.ch-name{
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Hiragino Sans",sans-serif;
  font-size:1.7rem;font-weight:700;line-height:1.4;margin:2px 0 10px;
}
.ch-tag{
  display:inline-block;font-size:.7rem;font-weight:500;letter-spacing:.06em;
  color:var(--text-sub);background:var(--surface-2);
  border-radius:var(--r-pill);padding:4px 12px;margin-left:0;vertical-align:middle;
}
.hero-copy{
  font-size:1.05rem;line-height:1.95;font-weight:700;
  margin:14px auto 12px;max-width:22em;
}
.hero-line{font-size:.93rem;line-height:2;color:var(--text-sub);max-width:24em;margin:0 auto;}
.hero-div{
  display:flex;align-items:center;gap:14px;
  margin:28px 0 24px;color:var(--text-faint);font-size:.76rem;letter-spacing:.1em;
}
.hero-div::before,.hero-div::after{content:"";flex:1;height:1px;background:var(--line);}
.hero-sub{
  display:flex;gap:14px;align-items:center;text-align:left;
  margin-top:24px;padding-top:20px;border-top:1px solid var(--line);
  font-size:.86rem;line-height:1.85;color:var(--text-sub);
}
.hero-sub svg{width:56px;flex:0 0 auto;margin-top:2px;}
.hero-gap{
  display:inline-flex;flex-direction:column;align-items:center;gap:2px;
  margin-top:24px;padding:14px 26px;border-radius:var(--r-md);
  background:var(--surface-2);font-size:.78rem;color:var(--text-sub);line-height:1.6;
}
.hero-gap strong{font-size:1.6rem;color:var(--text);font-weight:700;line-height:1.2;}
.ch-block{display:flex;gap:16px;align-items:flex-start;text-align:left;}
.ch-art{flex:0 0 auto;width:92px;}
.ch-meta{flex:1 1 auto;min-width:0;}
.ch-role{font-size:.72rem;letter-spacing:.1em;color:var(--text-faint);}
.ch-line{font-size:.88rem;line-height:1.85;color:var(--text-sub);}

/* ---------- contradiction ---------- */
.contra{background:linear-gradient(170deg,var(--lavender-soft) 0%,#FAF8FD 100%);border-color:transparent;}
.contra-t{
  font-size:1.34rem;font-weight:700;line-height:1.75;margin:6px 0 16px;
  letter-spacing:.01em;
}
.contra-t.small{font-size:1.06rem;}
.contra-sub{padding-top:18px;margin-top:18px;border-top:1px solid var(--line);}
.contra-sub:first-of-type{border-top:none;margin-top:0;padding-top:0;}
.basis{font-size:.75rem;color:var(--text-faint);margin-top:8px;}
.need{
  margin:16px 0 0;padding:14px 16px;border-radius:var(--r-md);
  background:var(--surface);font-size:.94rem;font-weight:700;line-height:1.9;
}

/* ---------- triggers ---------- */
.trg{padding:16px 0;border-top:1px solid var(--line);}
.trg:first-of-type{border-top:none;padding-top:4px;}
.trg-h{display:flex;align-items:baseline;gap:9px;}
.trg-n{font-size:.7rem;color:var(--text-faint);flex:0 0 auto;letter-spacing:.06em;}
.trg-t{font-weight:700;font-size:1rem;flex:1 1 auto;line-height:1.6;}
.trg-v{font-weight:700;color:var(--risk);font-variant-numeric:tabular-nums;}
.trg-d{font-size:.72rem;color:var(--text-faint);margin-left:2px;}
.trg-b{font-size:.88rem;line-height:1.9;color:var(--text-sub);margin-top:6px;}
.trg-m{font-size:.73rem;color:var(--text-faint);margin-top:6px;}

/* ---------- tools grid ---------- */
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tool-b{
  min-height:64px;padding:16px 12px;
  border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--surface-2);font-size:.88rem;line-height:1.6;
  cursor:pointer;text-align:center;transition:transform .18s ease-out;
}
.tool-b:active{transform:translateY(2px);}
.tool-b.alt{grid-column:1 / -1;background:var(--risk-soft);border-color:transparent;color:var(--risk);font-weight:700;}
.lv-btn{margin-bottom:18px;}
.emergency-card{background:linear-gradient(170deg,var(--sand-soft) 0%,#FFFCF7 100%);border-color:transparent;}

/* ---------- bars ---------- */
.bar-item{margin:0 0 18px;}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;font-size:.94rem;margin-bottom:7px;}
.bar-val{font-variant-numeric:tabular-nums;color:var(--text-sub);font-size:.84rem;}
.bar-track{height:10px;background:var(--surface-2);border-radius:var(--r-pill);overflow:hidden;}
.bar-fill{height:100%;border-radius:var(--r-pill);background:var(--sage);transition:width .6s ease-out;}
.bar-fill.risk{background:var(--rose);}
.bar-desc{font-size:.79rem;color:var(--text-sub);margin-top:6px;line-height:1.75;}
.hotcold{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
.hc-col{border:1px solid var(--line);border-radius:var(--r-md);padding:16px 12px;}
.hc-col.hot{background:var(--rose-soft);border-color:transparent;}
.hc-col.cold{background:var(--sage-soft);border-color:transparent;}
.hc-k{font-size:.7rem;letter-spacing:.08em;color:var(--text-sub);margin-bottom:12px;text-align:center;line-height:1.6;}
.mini{display:flex;align-items:center;gap:7px;margin-bottom:8px;font-size:.71rem;}
.mini-l{flex:0 0 auto;width:52px;color:var(--text-sub);line-height:1.4;}
.mini-t{flex:1 1 auto;height:6px;background:rgba(61,57,54,.09);border-radius:var(--r-pill);overflow:hidden;}
.mini-f{display:block;height:100%;background:var(--sage);border-radius:var(--r-pill);}
.mini-f.risk{background:var(--risk);}
.mini-v{flex:0 0 auto;width:20px;text-align:right;font-variant-numeric:tabular-nums;color:var(--text-faint);}
.plv{border-top:1px solid var(--line);padding:18px 0;}
.plv-h{font-size:.88rem;font-weight:700;margin-bottom:12px;}
.gap-num{font-size:2.8rem;font-weight:700;line-height:1.1;letter-spacing:-.02em;}
.gap-scale{display:flex;justify-content:space-between;font-size:.73rem;color:var(--text-faint);margin-top:8px;}

/* ---------- detail blocks ---------- */
.det{font-size:.93rem;line-height:2;margin-bottom:16px;}
.det-l{display:block;font-size:.74rem;letter-spacing:.1em;color:var(--text-sub);margin-bottom:3px;opacity:.85;}
.motto{
  margin-top:16px;padding:14px 16px;border-radius:var(--r-md);
  background:var(--sage-soft);color:var(--text);
  font-weight:700;font-size:.98rem;text-align:center;line-height:1.8;
}
.motto.small{font-size:.86rem;padding:10px 12px;margin-top:12px;}
.type-inline{font-size:1.18rem;font-weight:700;margin:0 0 10px;}
.narr-b{padding:18px 0;border-top:1px solid var(--line);font-size:.97rem;line-height:2.05;}
.narr-b:first-child{border-top:none;padding-top:0;}
.narr-k{display:block;font-size:.68rem;letter-spacing:.16em;color:var(--text-faint);margin-bottom:6px;}
.narr-b.rule{font-weight:700;}
.why{border:1px solid var(--line);border-radius:var(--r-md);padding:16px 17px;margin-bottom:12px;background:var(--surface-2);}
.why-t{font-size:.76rem;color:var(--text-faint);margin-bottom:10px;line-height:1.7;}
.why-r{display:flex;justify-content:space-between;gap:12px;font-size:.9rem;padding:4px 0;line-height:1.7;}
.why-v{font-variant-numeric:tabular-nums;font-weight:700;}
.tl{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line);font-size:.94rem;line-height:1.95;}
.tl:first-of-type{border-top:none;padding-top:0;}
.tl-k{flex:0 0 auto;width:38px;font-size:.76rem;color:var(--text-faint);padding-top:6px;}
.hist{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:.91rem;}
.hist-v{font-variant-numeric:tabular-nums;color:var(--text-sub);}

/* ---------- rules (memo風) ---------- */
.rule{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line);font-size:.96rem;line-height:1.95;}
.rule:first-of-type{border-top:none;padding-top:4px;}
.rule-n{
  flex:0 0 auto;width:24px;height:24px;border-radius:50%;
  background:var(--surface-2);color:var(--text-sub);
  display:flex;align-items:center;justify-content:center;font-size:.74rem;font-weight:700;margin-top:5px;
}
.ifthen{
  background:var(--sand-soft);border-radius:var(--r-md);
  padding:18px 18px;margin-bottom:12px;position:relative;
}
.if-n{
  position:absolute;top:14px;right:16px;
  font-size:.7rem;color:var(--text-faint);letter-spacing:.1em;
}
.if-l{font-size:.95rem;line-height:1.9;}
.if-l .k{
  display:block;font-size:.66rem;letter-spacing:.18em;color:var(--text-faint);margin-bottom:2px;
}
.if-l.then{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-strong);font-weight:700;}

/* ---------- compass ---------- */
.compass{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
.cmp{border:1px solid var(--line);border-radius:var(--r-md);padding:16px 17px;background:var(--surface-2);}
.cmp-k{font-size:.66rem;letter-spacing:.18em;color:var(--sage-deep);}
.cmp-j{font-weight:700;font-size:.97rem;margin:3px 0 5px;}
.cmp-q{font-size:.88rem;line-height:1.9;color:var(--text-sub);}
.cmp-h{font-size:.77rem;color:var(--text-faint);margin-top:5px;}

/* ---------- gallery ---------- */
.gal{display:flex;flex-direction:column;gap:14px;margin-top:16px;}
.gal-item{
  display:flex;flex-direction:column;gap:12px;
  background:var(--surface-2);border-radius:var(--r-md);padding:18px 16px;
}
.gal-head{display:flex;gap:14px;align-items:center;}
.gal-art{flex:0 0 auto;width:66px;}
.gal-body{min-width:0;}
.gal-head .ch-name{font-size:1.14rem;margin:0 0 4px;}
.gal-copy{font-size:.88rem;color:var(--text);font-weight:700;line-height:1.8;}
.gal-txt{font-size:.85rem;line-height:1.9;color:var(--text-sub);margin-top:8px;}

/* ---------- tools ---------- */
.tool-h{font-size:1.24rem;line-height:1.7;}
.memo-paper{
  background:var(--sand-soft);
  border-radius:var(--r-lg);
  padding:24px 20px;
  border:1px solid var(--line);
}
.memo-k{font-size:.72rem;letter-spacing:.22em;color:var(--text-faint);margin-bottom:6px;}
.memo{
  width:100%;border:none;border-radius:var(--r-sm);
  padding:16px;font-family:inherit;font-size:.95rem;line-height:2.1;
  background:rgba(255,253,250,.7);color:var(--text);resize:vertical;margin-bottom:14px;
}
:root[data-theme="dark"] .memo{background:rgba(0,0,0,.14);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .memo{background:rgba(0,0,0,.14);}}
.memo-body{font-size:.93rem;line-height:2.1;white-space:pre-wrap;word-break:break-word;}
.memo-view{
  border-radius:var(--r-md);padding:18px;background:var(--sand-soft);
  font-size:.93rem;line-height:2.1;margin-bottom:18px;
}
/* 緊急モードは装飾を最小限に */
.panic-q{font-size:1.16rem;font-weight:700;margin-bottom:20px;line-height:1.8;}
.panic-row{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;}
.panic-b{
  min-height:50px;border:1px solid var(--line-strong);border-radius:var(--r-sm);
  background:var(--surface);font-size:1rem;cursor:pointer;
}
.panic-b:active{background:var(--surface-2);}
.panic-scale{display:flex;justify-content:space-between;font-size:.74rem;color:var(--text-faint);margin-top:10px;}
.panic-msg{font-size:1rem;line-height:2.05;margin-bottom:20px;padding:18px;border-radius:var(--r-md);background:var(--surface-2);}
.em-step{padding:8px 0 28px;}
.em-n{font-size:.72rem;letter-spacing:.18em;color:var(--text-faint);}
.em-t{font-size:1.42rem;font-weight:700;line-height:1.75;margin:12px 0 18px;}
.em-b{font-size:1rem;line-height:2.1;color:var(--text-sub);}
.sim-menu{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;}
.sim-card{
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  min-height:64px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--surface-2);cursor:pointer;text-align:left;transition:transform .18s ease-out;
}
.sim-card:active{transform:translateY(2px);}
.sim-cat{font-size:.72rem;color:var(--text-faint);letter-spacing:.08em;}
.sim-t{font-size:1.02rem;font-weight:700;}
.sim-step{font-size:.72rem;letter-spacing:.16em;color:var(--text-faint);margin-bottom:10px;}
.sim-end{font-size:1.02rem;line-height:2;font-weight:700;padding:18px;border-radius:var(--r-md);background:var(--surface-2);margin-bottom:20px;}
.ex-list{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px;}
.ex-b{
  min-height:44px;padding:11px 16px;border:1px solid var(--line-strong);
  border-radius:var(--r-pill);background:var(--surface);font-size:.87rem;cursor:pointer;
}
.ex-b.on{border-color:var(--rose);background:var(--rose-soft);}
.ex-out{border-radius:var(--r-md);padding:20px 18px;background:var(--rose-soft);}
.ex-q{font-size:1.14rem;font-weight:700;margin-bottom:14px;line-height:1.8;}
.ex-fig{width:64px;margin:0 auto 10px;}
.p-chip{
  display:inline-block;padding:6px 13px;border-radius:var(--r-pill);
  background:var(--surface);font-size:.82rem;margin:5px 7px 0 0;
}
.vals{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px;}
.val-chip{
  display:inline-block;padding:10px 16px;border-radius:var(--r-pill);
  background:var(--lavender-soft);color:var(--text);font-size:.9rem;font-weight:700;
}
.val-chip.pick{background:var(--surface);border:1px solid var(--line-strong);cursor:pointer;font-weight:400;min-height:44px;}
.val-chip.pick.on{background:var(--lavender-soft);border-color:var(--lavender);font-weight:700;}
.vgap{padding:16px 0;border-top:1px solid var(--line);}
.vgap-h{font-weight:700;font-size:.97rem;margin-bottom:6px;}
.vgap-b{font-size:.9rem;line-height:1.95;color:var(--text-sub);}

/* ---------- share card ---------- */
.share-card{
  border-radius:var(--r-lg);padding:30px 22px 22px;
  background:linear-gradient(170deg, var(--sand-soft) 0%, var(--surface) 55%, var(--rose-soft) 100%);
  text-align:center;box-shadow:var(--shadow);
}
.sh-brand{font-size:1.24rem;font-weight:700;letter-spacing:.02em;
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Hiragino Sans",sans-serif;}
.sh-brand .c{color:var(--rose);}
.sh-k{font-size:.74rem;letter-spacing:.1em;color:var(--text-faint);margin-top:8px;}
.sh-pair{display:flex;align-items:flex-start;justify-content:center;gap:8px;margin:18px 0 4px;}
.sh-one{flex:1 1 0;min-width:0;}
.sh-art{width:92px;margin:0 auto;}
.sh-role{font-size:.68rem;letter-spacing:.1em;color:var(--text-faint);margin-top:8px;}
.sh-nm{font-size:1.14rem;font-weight:700;line-height:1.5;
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Hiragino Sans",sans-serif;}
.sh-pair.single .sh-one{flex:0 0 auto;}
.sh-pair.single .sh-art{width:118px;}
.sh-arrow{flex:0 0 auto;color:var(--text-faint);font-size:.9rem;padding-top:42px;}
.sh-copy{margin-top:16px;font-size:.94rem;line-height:2;font-weight:700;}
.sh-gap{margin-top:14px;font-size:.8rem;color:var(--text-sub);}
.sh-gap strong{font-size:1.06rem;color:var(--text);}
.sh-detail{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:.74rem;color:var(--text-sub);display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;}
.sh-note{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:.68rem;line-height:1.8;color:var(--text-faint);}
.sh-toggle{display:flex;align-items:center;gap:10px;font-size:.86rem;color:var(--text-sub);margin:18px 0;min-height:44px;}

/* ---------- responsive / motion ---------- */
@media (min-width:680px){
  body{font-size:17px;}
  .wrap{padding:0 24px 88px;}
  .card{padding:32px 30px;}
  .hero{padding:44px 30px 34px;}
  .gal{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .gal-art{width:76px;}
}
@media (max-width:359px){
  .ch-art{width:76px;}
  .tool-grid{grid-template-columns:1fr;}
  .hotcold{grid-template-columns:1fr;}
  .hero-art .fig{width:70px;}
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .hero,
  :root:not([data-theme="light"]) .today,
  :root:not([data-theme="light"]) .contra,
  :root:not([data-theme="light"]) .emergency-card{background-image:none;}
}
:root[data-theme="dark"] .hero,:root[data-theme="dark"] .today,
:root[data-theme="dark"] .contra,:root[data-theme="dark"] .emergency-card{background-image:none;}
:root[data-theme="dark"] .hero{background-color:var(--surface);}
:root[data-theme="dark"] .today{background-color:var(--sage-soft);}
:root[data-theme="dark"] .contra{background-color:var(--lavender-soft);}
:root[data-theme="dark"] .emergency-card{background-color:var(--sand-soft);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .hero{background-color:var(--surface);}
  :root:not([data-theme="light"]) .today{background-color:var(--sage-soft);}
  :root:not([data-theme="light"]) .contra{background-color:var(--lavender-soft);}
  :root:not([data-theme="light"]) .emergency-card{background-color:var(--sand-soft);}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}


/* ---------- v4: ホーム / 入口 ---------- */
.tagline{font-size:.92rem;letter-spacing:.06em;color:var(--text-sub);margin-top:8px;}
.today{background:linear-gradient(170deg,var(--sage-soft) 0%,#F6F9F3 100%);border-color:transparent;}
.today-rule{font-size:1.22rem;font-weight:700;line-height:1.8;margin:4px 0 10px;}
.link-btn{background:none;border:none;padding:6px 0;color:var(--text-sub);font-size:.84rem;text-decoration:underline;cursor:pointer;min-height:36px;}
.entry-list{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;}
.entry{
  width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-md);
  padding:18px 20px;cursor:pointer;box-shadow:var(--shadow-sm);
  transition:transform .18s ease-out;min-height:72px;
}
.entry:active{transform:translateY(2px);}
.entry-t{font-size:1.06rem;font-weight:700;line-height:1.5;}
.entry-s{font-size:.85rem;color:var(--text-sub);margin-top:3px;line-height:1.7;}
.row-btn{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;min-height:56px;padding:16px 4px;background:none;border:none;
  border-bottom:1px solid var(--line);font-size:.97rem;text-align:left;cursor:pointer;color:var(--text);
}
.row-btn:last-child{border-bottom:none;}
.row-btn span{font-size:.8rem;color:var(--text-faint);}
.pre-list{display:flex;flex-direction:column;gap:10px;margin-top:20px;}

/* ---------- v4: 次に意識するひとつ ---------- */
.pick-one{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
.pick-b{
  width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:var(--r-md);
  padding:17px 18px;font-size:.97rem;line-height:1.85;cursor:pointer;min-height:60px;
}
.pick-b.on{border-color:var(--sage);background:var(--sage-soft);}
.rec-input{width:100%;min-height:52px;padding:14px 16px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);color:var(--text);font-family:inherit;font-size:.94rem;margin:14px 0;}
.tool-b b{display:block;font-size:.86rem;letter-spacing:.02em;margin-bottom:2px;}
.tool-b{font-size:.8rem;color:var(--text-sub);}
.tool-b b{color:var(--text);}
.picked-note{margin-top:14px;font-size:.88rem;color:var(--text-sub);line-height:1.9;}

/* ---------- v4: 両面表示 ---------- */
.two-side{border-radius:var(--r-md);background:var(--surface-2);padding:16px 18px;margin-top:12px;}
.two-side .s-l{font-size:.72rem;letter-spacing:.1em;color:var(--text-sub);opacity:.85;}
.two-side .s-b{font-size:.9rem;line-height:1.9;margin:2px 0 12px;}
.two-side .s-b:last-child{margin-bottom:0;}

/* ---------- v4: re:cord ---------- */
.rec-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:18px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm);
}
.rec-date{font-size:.8rem;color:var(--text-sub);}
.rec-ch{font-size:1.1rem;font-weight:700;margin:6px 0 8px;line-height:1.6;}
.rec-q{font-size:.93rem;line-height:1.9;color:var(--text);}
.rec-note{font-size:.84rem;color:var(--text-sub);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-strong);line-height:1.8;}
.rec-actions{display:flex;gap:10px;margin-top:14px;}
.rec-actions button{flex:1;min-height:44px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:transparent;font-size:.86rem;cursor:pointer;color:var(--text-sub);}
.rec-mini{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
.rec-mini svg{width:44px;}

/* ---------- v4: re:share ---------- */
.share-opts{display:flex;flex-direction:column;gap:10px;margin:16px 0 20px;}
.share-opt{
  display:flex;align-items:center;gap:12px;min-height:52px;padding:12px 16px;
  border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);
  font-size:.92rem;cursor:pointer;text-align:left;color:var(--text);
}
.share-opt.on{border-color:var(--sage);background:var(--sage-soft);}
.share-opt .box{
  flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--on-accent);
}
.share-opt.on .box{background:var(--accent);border-color:var(--accent);}
.share-preview{margin-top:8px;}
.share-preview img{width:100%;border-radius:var(--r-md);box-shadow:var(--shadow);}

/* ---------- v4: 今日の1問 ---------- */
.daily-q{font-size:1.14rem;font-weight:700;line-height:1.9;margin:14px 0 20px;}
.daily-r{
  background:var(--sage-soft);border-radius:var(--r-md);padding:18px;
  font-size:.95rem;line-height:2;margin-top:18px;
}

/* ---------- v4: re:mind ---------- */
.feel-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
.feel-b{
  min-height:56px;border:1px solid var(--line-strong);border-radius:var(--r-md);
  background:var(--surface);font-size:.95rem;cursor:pointer;
}
.feel-b.on{border-color:var(--rose);background:var(--rose-soft);}

/* ---------- 印刷（PDF保存用） ---------- */
@media print{
  .topbar,.nav,.btn,.btn-sub,.tool-grid,.lv-btn,.entry-list,.row-btn,
  .rec-actions,.share-opts,.link-btn,.pick-b,#btnMore{display:none !important;}
  body{background:#fff;color:#222;font-size:11pt;}
  .wrap{max-width:none;padding:0;}
  .card{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid;margin-bottom:10pt;padding:14pt;}
  #lv2,#lv3{display:block !important;}
  .hidden{display:none !important;}
  a[href]:after{content:"";}
}


/* ---------- v5: 法務・情報ページ ---------- */
.home-btn{
  display:inline-flex;align-items:center;gap:6px;
  min-height:40px;padding:8px 14px 8px 10px;margin-bottom:10px;
  background:transparent;border:1px solid var(--line);border-radius:var(--r-pill);
  color:var(--text-sub);font-size:.84rem;cursor:pointer;
}
.home-btn:active{background:var(--surface-2);}
.privacy-note{
  margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
  font-size:.8rem;line-height:1.9;color:var(--text-sub);text-align:left;
}
.inline-link{
  background:none;border:none;padding:0 2px;margin:0;
  color:var(--sage-deep);font-size:inherit;font-family:inherit;
  text-decoration:underline;cursor:pointer;line-height:inherit;
}
.foot{padding:26px 4px 8px;text-align:center;}
.foot-l{
  background:none;border:none;padding:10px 12px;margin:0 2px;
  color:var(--text-sub);font-size:.8rem;text-decoration:underline;cursor:pointer;
  min-height:40px;
}
.foot-n{font-size:.74rem;line-height:1.9;color:var(--text-faint);margin-top:12px;padding:0 8px;}
.doc{font-size:.92rem;line-height:2;}
.doc-lead{font-size:.92rem;line-height:2;color:var(--text-sub);margin:0 0 22px;padding-bottom:18px;border-bottom:1px solid var(--line);}
.doc-sec{margin-bottom:26px;}
.doc-h{font-size:1rem;font-weight:700;margin-bottom:10px;line-height:1.7;}
.doc-h.sub{font-size:.94rem;color:var(--text-sub);margin-top:18px;}
.doc-p{font-size:.9rem;line-height:2;margin:0 0 12px;color:var(--text-sub);}
.doc-l{margin:0 0 12px;padding-left:1.2em;}

.save-list{display:flex;flex-direction:column;}
.save-row{
  display:flex;align-items:center;gap:12px;

.save-row:last-child{border-bottom:none;}
.save-k{flex:1 1 auto;font-size:.92rem;line-height:1.6;}
.save-v{flex:0 0 auto;font-size:.84rem;color:var(--text-sub);font-variant-numeric:tabular-nums;}
.save-del{

  border:1px solid var(--line-strong);border-radius:var(--r-pill);
  background:transparent;color:var(--risk);font-size:.82rem;cursor:pointer;

.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));

  transition:opacity .24s ease-out, transform .24s ease-out;z-index:60;

<script>
"use strict";
/* ================================================================
   失敗時の心理・行動反応 自己理解チェック
   - すべてブラウザ内で完結。外部送信なし。
   - 構成: DATA（設問データ） / SCORING（スコアロジック） / UI（画面）
   ================================================================ */

/* ----------------------------------------------------------------
   軸の定義
   Strength 側（A-E）: 高いほどその反応が出やすい（望ましさの意味を含む）
   Risk 側（F-H）: 良し悪しではなく「出やすさ」として扱う
   S: 内部指標（自己否定の出やすさ）。8軸には含めず、タイプ判定と文章生成に使う
   ---------------------------------------------------------------- */
const AXES = {
  A:{key:"A",name:"真実開示",group:"strength",desc:"自分に不利でも、事実を隠さず小出しにせず伝えられるか"},
  B:{key:"B",name:"責任受容",group:"strength",desc:"状況や他人の要因と切り分けて、自分が選んだ部分を認められるか"},
  C:{key:"C",name:"相手への影響理解",group:"strength",desc:"自分の意図ではなく、相手に実際に起きた損害や感情を見られるか"},
  D:{key:"D",name:"修復行動",group:"strength",desc:"謝罪で終わらず、戻す・直す・説明する行動まで進めるか"},
  E:{key:"E",name:"再発防止",group:"strength",desc:"感情的な反省で終えず、やり方や仕組みを実際に変えるか"},
  F:{key:"F",name:"自己正当化",group:"risk",desc:"理由づけや比較で、心理的な負担を軽くしようとする反応の出やすさ"},
  G:{key:"G",name:"防衛的反発",group:"risk",desc:"責任を問われた瞬間に、反論・指摘・怒りが出やすいか"},
  H:{key:"H",name:"回避・隠蔽",group:"risk",desc:"黙る・遅らせる・距離を取るという形で先送りしやすいか"}
};
const AXIS_ORDER = ["A","B","C","D","E","F","G","H"];

/* 診断ロジックのバージョン。設問・配点・スコアリング・キャラクター判定・分析を
   変更したときは必ず上げること。記録にも保存し、異なる版どうしは同条件で比較しない */
const DIAGNOSTIC_VERSION = "1.0";

/* 表側は自然な言葉、詳細側は正式名称。専門用語を大きく出さないための対応表 */
const SOFT = {
  A:"事実を出せる力", B:"自分の分を認める力", C:"相手の側を見る力",
  D:"直しにいく力",   E:"次を変える力",
  F:"理由を探したくなる反応", G:"自分を守る言葉が先に出る反応", H:"少し距離を置きたくなる反応"
};

/* ================================================================
   SECTION 1 : もし実際に起きたら（36問・4択・SJT）
   各選択肢に内部得点。回答者には表示しない。
   4択すべてに現実的な心理的合理性を持たせている。
   ================================================================ */
const S1 = [
{id:"q01", sc:"取引先へ送った請求書の金額を、あなたが入力ミスしていた。相手はまだ気づいていない様子だ。", a:[
 {t:"金額の確定より先に、まず相手と社内の両方に一報を入れる", s:{A:3,B:2,D:2,E:1}},
 {t:"影響範囲と原因を確認し、説明できる形にしてから連絡する", s:{A:2,B:1,C:1,D:2,E:2}},
 {t:"訂正版を送り直し、経緯は聞かれたときに説明する", s:{A:-2,D:1,F:1,H:2}},
 {t:"先方の検収で気づく可能性が高いので、指摘を待って対応する", s:{A:-2,B:-1,D:-1,F:2,H:3}}
]},
{id:"q02", sc:"引き受けた仕事が締切に間に合わない見込みになった。まだ誰にも伝えていない。", a:[
 {t:"確定していない段階でも、間に合わない可能性を今日のうちに伝える", s:{A:3,B:2,C:1,E:1}},
 {t:"どこまで出せるかの代替案を作ってから、まとめて相談する", s:{A:2,B:1,D:2,E:2}},
 {t:"残り時間で巻き返せる可能性があるので、確定するまで動かない", s:{A:-1,B:1,D:1,H:2}},
 {t:"先方の返答待ちもあったので、そこも含めて状況が固まってから調整する", s:{A:-2,F:2,H:3,G:1}}
]},
{id:"q03", sc:"友人に借りた1万円を返し忘れたまま数か月が過ぎた。相手は何も言ってこない。", a:[
 {t:"気まずくても自分から切り出して、遅れたことを謝って返す", s:{A:2,B:2,C:1,D:3}},
 {t:"次に会うときに、まとめて返す", s:{A:0,D:1,H:1}},
 {t:"相手が気にしていない様子なので、向こうから言われたときに返す", s:{A:-2,C:-1,F:2,H:3}},
 {t:"食事をおごるなど、金額に見合う形で埋め合わせる", s:{A:-1,C:-1,D:1,F:2,H:1}}
]},
{id:"q04", sc:"元恋人と二人で食事をした。やましいことはなかったが、パートナーには伝えていない。", a:[
 {t:"相手を不安にさせるとしても、聞かれる前に自分から話す", s:{A:3,C:2,B:1}},
 {t:"隠すつもりはないので、聞かれたら正直に答える", s:{A:0,C:1,H:1}},
 {t:"やましいことがない以上、わざわざ不安にさせる必要はないと考える", s:{A:-2,C:-2,F:3}},
 {t:"その話題になりそうな場面を、自然に避ける", s:{A:-2,C:-1,F:1,H:3}}
]},
{id:"q05", sc:"実家で、親が大事にしていた物を落として壊してしまった。今のところ誰も気づいていない。", a:[
 {t:"気づかれる前に自分から言い、弁償や修理を相談する", s:{A:3,B:2,D:2}},
 {t:"直せるかどうか調べて、見通しと一緒に伝える", s:{A:1,B:1,D:2,E:1,H:1}},
 {t:"同じものを手に入れて、元の場所に戻しておく", s:{A:-2,D:1,F:1,H:2}},
 {t:"普段あまり使わない物なので、気づかれたときに話す", s:{A:-2,B:-1,F:1,H:3}}
]},
{id:"q06", sc:"出張の経費精算で、私的な支出を少額まぎれ込ませてしまった。金額は数千円で、確認されることはまずない。", a:[
 {t:"申請前に気づいたので取り下げ、正しい金額で出し直す", s:{A:3,B:2,E:2}},
 {t:"次回の申請を少なく出して、自分の中で帳尻を合わせる", s:{A:-1,B:1,D:1,F:2}},
 {t:"持ち出しの多い月もあるので、全体で見れば妥当な範囲だと判断する", s:{A:-2,B:-2,F:3,C:-1}},
 {t:"今回は通してしまうが、次からは混ぜないようにする", s:{A:-1,B:0,E:1,F:2,H:1}}
]},
{id:"q07", sc:"会議中に上司から「この資料の数字、間違っているよね」と全員の前で指摘された。確かにあなたのミスだ。", a:[
 {t:"その場で自分のミスだと認め、影響と修正の見込みまで話す", s:{A:3,B:3,D:2}},
 {t:"事実を確認したいと伝えたうえで、認められる部分はその場で認める", s:{A:2,B:2,C:1}},
 {t:"元データの提供が遅れた経緯も、誤解が残らないよう説明しておく", s:{B:-1,F:2,G:2}},
 {t:"その場は短く謝って収め、詳細は後で個別に話す", s:{A:0,B:1,C:-1,H:2}}
]},
{id:"q08", sc:"同僚との連携ミスでトラブルが起きた。相手の連絡不足もあるが、あなたの確認漏れも原因のひとつだ。", a:[
 {t:"自分の確認漏れを先に出し、そのうえで連携の改善を提案する", s:{A:2,B:3,D:1,E:2}},
 {t:"どちらに何の落ち度があったかを、事実ベースで整理して共有する", s:{A:2,B:1,C:1,E:2}},
 {t:"発端が相手の連絡不足だったことは、周囲にも正確に伝わるようにする", s:{B:-2,F:3,G:3}},
 {t:"相手が何か言うまでは、こちらからは持ち出さない", s:{A:-1,B:-1,F:1,H:3}}
]},
{id:"q09", sc:"時間を勘違いして、友人を1時間待たせてしまった。完全にあなたの間違いだ。", a:[
 {t:"謝ったうえで、同じ間違いが起きないよう予定の共有方法を変える", s:{B:2,C:2,D:2,E:3}},
 {t:"しっかり謝って、その日の支払いを持つ", s:{B:2,C:2,D:2}},
 {t:"謝るが、待ち合わせの伝え方も分かりにくかったとは思っている", s:{B:-2,C:-1,F:3,G:2}},
 {t:"謝ったあとは空気を重くしないよう、普段どおりに振る舞う", s:{B:1,C:0,D:0,F:1,H:1}}
]},
{id:"q10", sc:"会計で、店員がお釣りを2千円多く渡した。店を出てから気づいた。", a:[
 {t:"手間だが、店に戻って返す", s:{A:3,B:2,C:1}},
 {t:"次に行ったときに伝えて返す", s:{A:1,C:1,D:1,H:1}},
 {t:"レジの管理は店の側の責任なので、こちらから動く話ではないと考える", s:{G:1,A:-2,B:-2,C:-2,F:3}},
 {t:"気にはなるが、戻る時間もないのでそのままにする", s:{A:-1,C:-1,F:2,H:2}}
]},
{id:"q11", sc:"あなたの判断ミスで、会社に数十万円規模の損失が出た。すでに上層部にも報告されている。", a:[
 {t:"判断の経緯と自分の責任範囲を整理し、回復案とあわせて説明する", s:{A:3,B:3,C:1,D:3,E:2}},
 {t:"まず全面的に謝罪し、処分や指示を待つ", s:{A:1,B:2,C:1,D:0,S:2}},
 {t:"自分ひとりの判断ではなかった経緯も、正確に共有しておく", s:{B:-2,F:3,G:2}},

]},
{id:"q12", sc:"友人から借りた本に飲み物をこぼし、数ページにシミができた。", a:[
 {t:"返すときに正直に伝え、同じ本を買って渡す", s:{A:3,B:2,C:1,D:3}},
 {t:"正直に伝えて謝り、弁償が必要かどうかは相手に聞く", s:{A:3,B:2,C:2,D:2}},
 {t:"読むのに支障はない程度なので、そのまま返す", s:{A:-2,C:-2,F:2,H:3}},
 {t:"伝えるが、「元からあったかもしれない」と付け加えてしまう", s:{A:-2,B:-2,F:3,G:1}}
]},
{id:"q13", sc:"友人から「誰にも言わないで」と言われた話を、別の友人につい話してしまった。その話が広がり始めている。", a:[
 {t:"広がりきる前に本人に伝え、自分が話したことを認めて相談する", s:{A:3,B:3,C:2,D:2}},
 {t:"広げた相手に止めるよう頼み、本人にも自分から話す", s:{A:2,B:2,C:2,D:3,E:1}},
 {t:"経路が特定できない状態で名乗り出ても混乱するので、動かない", s:{A:-2,B:-2,C:-1,F:2,H:3}},
 {t:"本人から聞かれたら認めるが、こちらからは言わない", s:{A:-2,B:0,C:-1,F:1,H:3}}
]},
{id:"q14", sc:"隠していたことがパートナーに発覚し、目の前で泣かれている。", a:[
 {t:"自分の言い分は置いて、相手が何に傷ついたのかを最後まで聞く", s:{B:2,C:3,D:1,G:-1}},
 {t:"隠していた理由と経緯を、時系列で正確に説明する", s:{A:2,B:1,C:0,E:1}},

 {t:"原因はまだ特定できていないという形で、状況だけ先に報告する", s:{A:-2,B:-1,F:2,H:2}},
 {t:"自分で収束させられそうなら、上げずに処理する", s:{A:-2,B:0,D:2,F:1,H:3}}
]},
{id:"q16", sc:"複数人の食事会で均等割りになったが、実際にはあなたがかなり多く注文していた。", a:[
 {t:"場の流れを変えてでも、自分から多めに出すと申し出る", s:{A:2,B:2,C:2,D:2}},
 {t:"次は自分が多めに払うと伝えておく", s:{A:1,C:1,D:1}},
 {t:"均等割りはその場の合意なので、特に何もしない", s:{G:1,A:-1,C:-2,F:3}},
 {t:"言い出すと場が気まずくなるので黙っている", s:{A:-2,C:-1,F:1,H:3}}

/* ----------------------------------------------------------------
   一貫性チェック用のペア（意味の近い項目を、場面と表現を変えて配置）
   ---------------------------------------------------------------- */
const PAIRS = [
 {k:"H", a:"q02", b:"p14"},
 {k:"F", a:"q08", b:"p10"},
 {k:"G", a:"q07", b:"p12"},
 {k:"A", a:"q30", b:"p01"},
 {k:"D", a:"q12", b:"p07"},
 {k:"C", a:"q22", b:"p05"}
];

/* ================================================================
   SCORING : スコアロジック（UIから独立）
   ================================================================ */
const SCORING = (function(){

  const S2_WEIGHT = 2.6; // 6段階1項目あたりの最大寄与
  const BY_ID = {};
  S1.forEach(function(it){ BY_ID[it.id] = {type:"s1", item:it}; });
  S2.forEach(function(it){ BY_ID[it.id] = {type:"s2", item:it}; });
  S3.forEach(function(it){ BY_ID[it.id] = {type:"s3", item:it}; });

  const ALL_KEYS = AXIS_ORDER.concat(["S"]);

  /* 各軸の理論上の最小・最大を、設問データから自動計算する。
     （設問を足し引きしても正規化が壊れないようにするため） */
  function ranges(){
    const r = {};
    ALL_KEYS.forEach(function(k){ r[k] = {min:0, max:0}; });

    function accOptions(list, getScores){
      const vals = {};
      ALL_KEYS.forEach(function(k){ vals[k] = []; });
      list.forEach(function(o){
        const s = getScores(o) || {};
        ALL_KEYS.forEach(function(k){ vals[k].push(s[k] || 0); });
      });
      ALL_KEYS.forEach(function(k){
        r[k].min += Math.min.apply(null, vals[k]);
        r[k].max += Math.max.apply(null, vals[k]);
      });
    }

    S1.forEach(function(it){ accOptions(it.a, function(o){ return o.s; }); });
    S3.forEach(function(it){ accOptions(it.o, function(o){ return o.s; }); });
    S2.forEach(function(it){ r[it.k].max += S2_WEIGHT; });
    return r;
  }
  const RANGE = ranges();

  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  /* 生スコアの集計 */
  function raw(answers){
    const acc = {};
    ALL_KEYS.forEach(function(k){ acc[k] = 0; });

    S1.forEach(function(it){
      const v = answers[it.id];
      if(typeof v !== "number") return;
      const s = it.a[v].s || {};
      for(const k in s){ acc[k] += s[k]; }
    });
    S2.forEach(function(it){
      const v = answers[it.id];
      if(typeof v !== "number") return;
      const eff = it.rev ? (7 - v) : v;      // 逆転項目の処理
      acc[it.k] += ((eff - 1) / 5) * S2_WEIGHT;
    });
    S3.forEach(function(it){
      const v = answers[it.id];
      if(!v || typeof v.actual !== "number") return;
      const s = it.o[v.actual].s || {};
      for(const k in s){ acc[k] += s[k]; }
    });
    return acc;
  }

  /* 「どの選択肢も同じ確率で選んだ場合」の位置。ここを50に合わせて読みやすくする */
  function neutralRaw(){
    const acc = {};
    ALL_KEYS.forEach(function(k){ acc[k] = 0; });
    function addMean(list, get){
      ALL_KEYS.forEach(function(k){
        let sum = 0;
        list.forEach(function(o){ sum += ((get(o) || {})[k]) || 0; });
        acc[k] += sum / list.length;
      });
    }
    S1.forEach(function(it){ addMean(it.a, function(o){ return o.s; }); });
    S3.forEach(function(it){ addMean(it.o, function(o){ return o.s; }); });
    S2.forEach(function(it){ acc[it.k] += S2_WEIGHT * 0.5; });
    return acc;
  }
  const NEUTRAL = (function(){
    const nr = neutralRaw(), out = {};
    ALL_KEYS.forEach(function(k){
      const span = RANGE[k].max - RANGE[k].min;
      out[k] = span > 0 ? clamp((nr[k] - RANGE[k].min) / span * 100, 1, 99) : 50;
    });
    return out;
  })();

  /* 中央（平均的な回答）が50に来るように区分線形で伸縮する */
  function recenter(v, nt){
    if(!(nt > 0 && nt < 100)) return v;
    return v <= nt ? (50 * v / nt) : (50 + 50 * (v - nt) / (100 - nt));
  }

  /* 0〜100への正規化 */
  function normalize(acc){
    const out = {};
    ALL_KEYS.forEach(function(k){
      const rg = RANGE[k];
      const span = rg.max - rg.min;
      const base = span > 0 ? clamp((acc[k] - rg.min) / span * 100, 0, 100) : 50;
      out[k] = Math.round(clamp(recenter(base, NEUTRAL[k]), 0, 100));
    });
    return out;
  }

  /* 理解―実行ギャップ
     「適切だと思う案」と「実際に取りそうな案」の差を2つの見方で測る。
       ① 適切さランクの差（どれだけ悪化させやすい側に降りたか）
       ② 8軸上の距離（同じランク差でも、心理的な向きがどれだけ違うか）
     この2つを半々で合成して0〜100にする */
  function optDistance(o1, o2){
    const a = o1.s || {}, b = o2.s || {};
    let d = 0;
    AXIS_ORDER.forEach(function(k){ d += Math.abs((a[k]||0) - (b[k]||0)); });
    return d;
  }
  function gapScore(answers){
    let rankSum = 0, rankMax = 0, distSum = 0, distN = 0, answered = 0, understand = 0, sameCount = 0;
    S3.forEach(function(it){
      rankMax += 3;
      const v = answers[it.id];
      if(!v || typeof v.ideal !== "number" || typeof v.actual !== "number") return;
      answered++;
      understand += it.o[v.ideal].q;
      if(v.ideal === v.actual) sameCount++;
      const d = it.o[v.ideal].q - it.o[v.actual].q;
      if(d > 0) rankSum += d;
      let mx = 0;
      for(let i=0;i<it.o.length;i++){
        for(let j=i+1;j<it.o.length;j++){
          const dd = optDistance(it.o[i], it.o[j]);
          if(dd > mx) mx = dd;
        }
      }
      if(mx > 0){ distSum += optDistance(it.o[v.ideal], it.o[v.actual]) / mx; distN++; }
    });
    const rankPart = rankMax > 0 ? rankSum / rankMax : 0;
    const distPart = distN > 0 ? distSum / distN : 0;
    return {
      value: Math.round(Math.max(0, Math.min(100, (rankPart * 0.5 + distPart * 0.5) * 100))),
      rankPart: Math.round(rankPart * 100),
      distPart: Math.round(distPart * 100),
      matched: sameCount,
      answered: answered,
      understanding: answered > 0 ? Math.round(understand / (answered * 3) * 100) : 0
    };
  }

  /* その形式（SECTION1のみ / SECTION2のみ）だけで軸を出す。形式間のズレを見るために使う */
  function s1AxisOnly(answers, axis){
    let raw = 0, mn = 0, mx = 0, mean = 0, n = 0;
    S1.forEach(function(it){
      const idx = answers[it.id];
      if(typeof idx !== "number") return;
      const vals = it.a.map(function(o){ return (o.s && o.s[axis]) || 0; });
      raw += vals[idx];
      mn += Math.min.apply(null, vals);
      mx += Math.max.apply(null, vals);
      mean += vals.reduce(function(a,b){ return a+b; },0) / vals.length;
      n++;
    });
    if(!n || mx === mn) return null;
    const v  = clamp((raw-mn)/(mx-mn)*100, 0, 100);
    const nt = clamp((mean-mn)/(mx-mn)*100, 1, 99);
    return Math.round(recenter(v, nt));
  }
  function s2AxisOnly(answers, axis){
    let sum = 0, n = 0;
    S2.forEach(function(it){
      if(it.k !== axis) return;
      const v = answers[it.id];
      if(typeof v !== "number") return;
      const eff = it.rev ? (7 - v) : v;
      sum += (eff - 1) / 5; n++;
    });
    return n ? Math.round(sum / n * 100) : null;
  }

  /* 回答の一貫性
     嘘の判定ではない。似た意味の設問同士のズレに加えて、
     「普段の自分（自己評価）」と「場面での選択」の食い違いも見る */
  function consistency(answers){
    let checked = 0, diverged = 0;
    PAIRS.forEach(function(p){
      const va = itemNorm(p.a, p.k, answers);
      const vb = itemNorm(p.b, p.k, answers);
      if(va === null || vb === null) return;
      checked++;
      if(Math.abs(va - vb) > 0.55) diverged++;
    });
    const cross = [];
    ["A","B","C","D","F","G","H"].forEach(function(k){
      const a = s1AxisOnly(answers, k), b = s2AxisOnly(answers, k);
      if(a === null || b === null) return;
      cross.push({axis:k, s1:a, s2:b, diff:a-b});
      checked++;
      if(Math.abs(a-b) > 28) diverged++;
    });
    const ratio = checked ? diverged / checked : 0;
    const level = checked < 6 ? "標準" : (ratio >= 0.45 ? "やや揺れあり" : (ratio <= 0.15 ? "高い" : "標準"));
    return {checked:checked, diverged:diverged, cross:cross, level:level, low: level === "やや揺れあり"};
  }

  /* 1項目内での、その軸に対する相対位置（0〜1） */
  function itemNorm(id, axis, answers){
    const ref = BY_ID[id];
    if(!ref) return null;
    const v = answers[id];
    if(ref.type === "s2"){
      if(typeof v !== "number") return null;
      const eff = ref.item.rev ? (7 - v) : v;
      return (eff - 1) / 5;
    }
    const opts = ref.type === "s1" ? ref.item.a : ref.item.o;
    const idx = ref.type === "s1" ? v : (v && v.actual);
    if(typeof idx !== "number") return null;
    const vals = opts.map(function(o){ return (o.s && o.s[axis]) || 0; });
    const mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    if(mx === mn) return null;
    return (vals[idx] - mn) / (mx - mn);
  }

  /* 理想的な回答への寄りやすさ（社会的望ましさバイアスの目安） */
  function idealization(answers){
    let n1 = 0, c1 = 0, n2 = 0, c2 = 0, n3 = 0, c3 = 0;
    function composite(s){
      s = s || {};
      return (s.A||0)+(s.B||0)+(s.C||0)+(s.D||0)+(s.E||0) - ((s.F||0)+(s.G||0)+(s.H||0));
    }
    S1.forEach(function(it){
      const v = answers[it.id];
      if(typeof v !== "number") return;
      n1++;
      const comps = it.a.map(function(o){ return composite(o.s); });
      if(comps[v] === Math.max.apply(null, comps)) c1++;
    });
    S2.forEach(function(it){
      const v = answers[it.id];
      if(typeof v !== "number") return;
      n2++;
      const strength = ["A","B","C","D","E"].indexOf(it.k) >= 0;
      const desirableHigh = it.rev ? !strength : strength;
      if((desirableHigh && v === 6) || (!desirableHigh && v === 1)) c2++;
    });
    S3.forEach(function(it){
      const v = answers[it.id];
      if(!v || typeof v.actual !== "number") return;
      n3++;
      if(it.o[v.actual].q === 3) c3++;
    });
    const r1 = n1 ? c1/n1 : 0, r2 = n2 ? c2/n2 : 0, r3 = n3 ? c3/n3 : 0;
    const index = 0.5*r1 + 0.2*r2 + 0.3*r3;
    return {index: index, high: index >= 0.70};
  }

  /* ① 初動反応タイプ */
  function initialType(n){
    const spread = Math.max.apply(null, AXIS_ORDER.map(function(k){ return Math.abs(n[k]-50); }));
    if(spread < 10) return {key:"MIX", label:"状況依存型", flat:true};
    const face = (n.A + n.B + n.C) / 3;
    const risks = [
      {k:"F", v:n.F, name:"合理化型"},
      {k:"G", v:n.G, name:"防衛反応型"},
      {k:"H", v:n.H, name:"回避型"}
    ].sort(function(a,b){ return b.v - a.v; });

    if(face >= risks[0].v + 10) return {key:"FACE", label:"直面型"};
    if(risks[0].v - risks[1].v <= 6) return {key:"MIX", label:"混合反応型", sub:[risks[0].k, risks[1].k]};
    return {key:risks[0].k, label:risks[0].name};
  }

  /* ② 立て直し方 */
  function recoveryType(n){
    if(n.S >= 58 && n.D < 58) return {key:"BLAME", label:"自己否定先行型"};
    if(n.H >= 60 && n.D < 58) return {key:"DISTANCE", label:"距離を置く型"};
    if(n.E >= n.D + 8 && n.E >= 52) return {key:"ANALYZE", label:"原因分析先行型"};
    if(n.D >= 58 && n.D >= n.E) return {key:"REPAIR", label:"修復行動型"};
    if(n.C >= 55 && n.D < 55) return {key:"APOLOGY", label:"謝罪先行型"};
    return {key:"PARTIAL", label:"部分対応型"};
  }

  function compute(answers){
    const acc = raw(answers);
    const n = normalize(acc);
    return {
      raw: acc,
      norm: n,
      gap: gapScore(answers),
      consistency: consistency(answers),
      idealization: idealization(answers),
      initial: initialType(n),
      recovery: recoveryType(n)
    };
  }

  return {compute:compute, RANGE:RANGE, NEUTRAL:NEUTRAL, recenter:recenter};
})();

      p1 += "つまり、最初の反応と、その後の立て直しの質が一致していないタイプです。時間さえ確保できれば適切に動ける可能性が高いので、最初の数十分をどう乗り切るかが分かれ目になります。";
    }
    p.push(p1);

    // 段落2：強めに出ている面（上位2つ）
    const st = ["A","B","C","D","E"].map(function(k){ return {k:k, v:n[k]}; })
      .sort(function(a,b){ return b.v - a.v; });
    let p2 = "比較的はっきり出ているのは、" + AXES[st[0].k].name + "と" + AXES[st[1].k].name + "です。"
      + STRENGTH_TXT[st[0].k][band(n[st[0].k])] + STRENGTH_TXT[st[1].k][band(n[st[1].k])];
    const weak = st[st.length-1];
    if(weak.v <= 45){
      p2 += "一方で" + AXES[weak.k].name + "は控えめで、" + STRENGTH_TXT[weak.k][band(weak.v)];
    }
    p.push(p2);

    // 段落3：注意が必要な反応
    const rk = ["F","G","H"].map(function(k){ return {k:k, v:n[k]}; })
      .sort(function(a,b){ return b.v - a.v; });
    let p3 = "反応として出やすいのは" + AXES[rk[0].k].name + "で、" + RISK_TXT[rk[0].k][band(rk[0].v)]
      + "次いで" + AXES[rk[1].k].name + "について、" + RISK_TXT[rk[1].k][band(rk[1].v)];
    if(n.S >= 60){
      p3 += "また、失敗したときに行動そのものではなく自分自身を否定する反応も出やすいようです。自分を責める強さは、必ずしも修復の早さにはつながりません。";
    }
    p.push(p3);

    // 段落4：ギャップとまとめ
    let p4 = "理解と実行のギャップは" + r.gap.value + "でした。" + gapText(r.gap.value);
    p4 += "この結果は、あなたが良い人か悪い人かを示すものではありません。追い詰められたときにどこで自分を守ろうとしやすいのか、そしてどこなら踏みとどまれるのかの見取り図として使ってください。";
    p.push(p4);

    return p;
  }

  /* ⑪ その人専用の5つのルール */
  function personalRules(r){
    const n = r.norm;
    const pool = [
      {sev:n.F - 48, t:"「でも」「だって」が浮かんだら、いったん飲み込む。まず、自分がした行動と相手に起きた結果だけを、言い訳を挟まずに言葉にする。"},
      {sev:n.G - 48, t:"責められた直後の10分は、反論しないと決めておく。相手が何に困り、何に傷ついたのかを、最後まで遮らずに聞く。"},
      {sev:n.H - 48, t:"逃げたくなっても、問題に気づいてから24時間以内に一次連絡を入れる。完璧な説明が用意できるまで待たない。"},
      {sev:50 - n.A, t:"事実を小出しにしない。「分かっていること」「まだ分からないこと」「これから確認すること」を分けて、一度に説明する。"},
      {sev:50 - n.D, t:"謝罪には必ず「これから自分が何をするか」を1つ以上つける。言葉だけで終わらせない。"},
      {sev:50 - n.E, t:"収束した後24時間以内に、同じことが起きないための変更を1つだけ決めて、実際に手順や環境を変える。"},
      {sev:50 - n.B, t:"「自分が選べた場面はどこだったか」を1つだけ書き出す。すべてを背負う必要はないが、その1つは相手に言葉で伝える。"},
      {sev:50 - n.C, t:"意図の説明より先に、相手に起きた実害と手間を口に出して確認する。「悪気はなかった」を最初の一言にしない。"},
      {sev:n.S - 52, t:"落ち込みは相手の損害を戻さない。自分を責める時間を10分で区切り、次の10分は相手のための具体的な行動に使う。"},
      {sev:r.gap.value - 28, t:"とっさの判断に任せない。伝える順番（事実 → 相手への影響 → 自分の責任範囲 → これからすること）を、事前に一文で書いて持っておく。"},
      {sev:(n.A >= 62 && n.C < 55) ? 14 : -99, t:"開示は早いほうなので、勢いで全部話す前に一度だけ整理する。相手が今いちばん知りたいことから先に伝える。"},
      {sev:(n.E >= 62 && n.C < 52) ? 12 : -99, t:"再発防止の話に入る前に、相手の感情の話を先に終わらせる。仕組みの改善を、謝罪の代わりに使わない。"},
      {sev:6, t:"一人で判断しない。利害関係のない相手に、事実だけを話して見立てをもらってから動く。"},
      {sev:4, t:"連絡を先延ばししたくなったら、内容ではなく「いつ連絡するか」だけを先に決める。"},
      {sev:2, t:"その日のうちにできる最小の一歩を1つ決めて、それだけは終わらせてから寝る。"}
    ];
    return pool.sort(function(a,b){ return b.sev - a.sev; })
               .slice(0,5)
               .map(function(x){ return x.t; });
  }

  const COMMON_RULES = [
    "事実を増やさない。取り繕うための新しい嘘をつかない。",
    "自分の意図より先に、相手に実際に起きた影響を確認する。",

    "許されることを急がない。再発防止を、言葉ではなく行動で示す。"
  ];

  return {
    band:band, profileText:profileText, personalRules:personalRules,
    COMMON_RULES:COMMON_RULES, gapText:gapText,
    INITIAL_DESC:INITIAL_DESC, RECOVERY_DESC:RECOVERY_DESC
  };
})();

const CHAR_ORDER = ["wolf","elephant","dolphin","beaver","owl","fox","hedgehog","mole","deer","otter","cat"];

/* キャラクター判定：スコア（0〜100）から適合度を計算して選ぶ */
const CHAR_PICK = (function(){

  /* 同じスコアでも、初動と立て直しでは効くべき軸が違う。
     初動＝その瞬間に出る反応（F/G/H/S）を重く、立て直し＝時間が経ってからの行動（D/E/B/C）を重く見る */
  const PHASE_W = {
    initial: {A:0.90, B:0.90, C:0.90, D:0.70, E:0.70, F:1.35, G:1.35, H:1.35, S:1.35},
    recovery:{A:1.00, B:1.10, C:1.10, D:1.30, E:1.25, F:0.90, G:0.85, H:0.95, S:1.10}
  };
  function fitValue(map, n, phase){
    if(!map) return -999;
    const w = PHASE_W[phase] || PHASE_W.initial;
    let v = 0;
    for(const k in map){ v += map[k] * (w[k] || 1) * ((n[k] || 50) - 50); }
    return v;
  }
  /* 中庸なプロフィールほど「ネコ（間合い型）」が選ばれるようにする */
  function neutralFit(n){
    let dev = 0;
    ["A","B","C","D","E","F","G","H","S"].forEach(function(k){
      dev = Math.max(dev, Math.abs((n[k] || 50) - 50));
    });
    return 9 - dev * 0.55;
  }

  function rank(n, phase){
    const key = phase === "initial" ? "initialFit" : "recoveryFit";
    return CHAR_ORDER.map(function(id){
      const c = CHARS[id];
      return {id:id, fit: c.neutral ? neutralFit(n) : fitValue(c[key], n, phase)};
    }).sort(function(a,b){ return b.fit - a.fit; });
  }

  /* 「なぜこのキャラクターになったか」を人間が読める形で返す */
  function reasons(id, n, phase){
    const c = CHARS[id];
    if(c.neutral){
      return [{name:"全体の偏り", note:"どの軸も極端に振れていないため"}];
    }
    const map = c[phase === "initial" ? "initialFit" : "recoveryFit"] || {};
    const list = [];
    for(const k in map){
      if(k === "S") continue;                    // S は内部指標のため表に出さない
      if(!AXES[k]) continue;
      list.push({k:k, w:map[k], v:n[k]});
    }
    list.sort(function(a,b){ return Math.abs(b.w * (b.v-50)) - Math.abs(a.w * (a.v-50)); });
    return list.slice(0,3).map(function(x){
      return {name:AXES[x.k].name, value:n[x.k],
              note:(x.w > 0 ? "高めであること" : "低めであること") + "が働いています"};
    });
  }

  function pick(n){
    const ri = rank(n, "initial");
    const rr = rank(n, "recovery");
    const initial = ri[0].id;
    const recovery = rr[0].id;

    // サブキャラクター：メイン2体以外で最も適合度が高いもの（差が小さいときのみ表示）
    const best = {};
    ri.concat(rr).forEach(function(x){
      if(best[x.id] === undefined || x.fit > best[x.id]) best[x.id] = x.fit;
    });
    const topFit = Math.max(best[initial], best[recovery]);
    let sub = null;
    Object.keys(best).sort(function(a,b){ return best[b] - best[a]; }).some(function(id){
      if(id === initial || id === recovery) return false;
      if(best[id] > 4 && best[id] >= topFit * 0.55){ sub = id; }
      return true;
    });

    return {
      initial: initial, recovery: recovery, sub: sub,
      same: initial === recovery,
      initialReasons: reasons(initial, n, "initial"),
      recoveryReasons: reasons(recovery, n, "recovery")
    };
  }

  return {pick:pick, rank:rank};
})();

}

/* ================================================================
   v2 追加レイヤー ②：ANALYSIS2
   既存スコアを壊さず、そこから「状況別の読み」を導く
   ================================================================ */
const ANALYSIS2 = (function(){

  /* 1項目の中で、その選択肢がどれだけ「問題を悪化させやすい側」にあるか（0〜1） */
  function worsenLean(opts, idx){
    const comp = opts.map(function(o){
      const s = o.s || {};
      return ((s.F||0)+(s.G||0)+(s.H||0)) - ((s.A||0)+(s.B||0)+(s.C||0)+(s.D||0)+(s.E||0));
    });
    const mn = Math.min.apply(null, comp), mx = Math.max.apply(null, comp);
    if(mx === mn) return null;
    return (comp[idx] - mn) / (mx - mn);
  }

  /* 部分集合だけで8軸プロフィールを出す（設問数が少ないので目安として扱う） */
  function profileOf(entries){
    const keys = AXIS_ORDER.concat(["S"]);
    const raw = {}, mn = {}, mx = {}, mean = {};
    keys.forEach(function(k){ raw[k]=0; mn[k]=0; mx[k]=0; mean[k]=0; });
    let count = 0;
    entries.forEach(function(e){
      if(typeof e.idx !== "number") return;
      count++;
      keys.forEach(function(k){
        const vals = e.opts.map(function(o){ return (o.s && o.s[k]) || 0; });
        raw[k] += vals[e.idx];
        mn[k]  += Math.min.apply(null, vals);
        mx[k]  += Math.max.apply(null, vals);
        mean[k]+= vals.reduce(function(a,b){ return a+b; }, 0) / vals.length;
      });
    });
    const out = {};
    keys.forEach(function(k){
      const span = mx[k] - mn[k];
      if(span <= 0){ out[k] = 50; return; }
      const v  = Math.max(0, Math.min(100, (raw[k]-mn[k])/span*100));
      const nt = Math.max(1, Math.min(99, (mean[k]-mn[k])/span*100));
      out[k] = Math.round(Math.max(0, Math.min(100, SCORING.recenter(v, nt))));
    });
    out.__count = count;
    return out;
  }

  function s1Entries(answers, filter){
    return S1.filter(filter).map(function(it){
      return {opts: it.a, idx: answers[it.id]};
    }).filter(function(e){ return typeof e.idx === "number"; });
  }
  function s3Entries(answers, which){
    return S3.map(function(it){
      const v = answers[it.id] || {};
      return {opts: it.o, idx: v[which]};
    }).filter(function(e){ return typeof e.idx === "number"; });
  }

  /* 低プレッシャー場面と高プレッシャー場面の比較。
     同じ心理テーマのペア設問だけを使うので、「テーマの違い」ではなく
     「失うものの大きさの違い」による差として読める。ただし推定であって測定ではない */
  function hotCold(answers){
    const lowIds = PRESSURE_PAIRS.map(function(p){ return p.low; });
    const highIds = PRESSURE_PAIRS.map(function(p){ return p.high; });
    const byId = {};
    S1.forEach(function(it){ byId[it.id] = it; });
    function ent(ids){
      return ids.map(function(id){ return {opts: byId[id].a, idx: answers[id]}; })
                .filter(function(e){ return typeof e.idx === "number"; });
    }
    const cold = profileOf(ent(lowIds));
    const hot  = profileOf(ent(highIds));
    const delta = {};
    AXIS_ORDER.forEach(function(k){ delta[k] = hot[k] - cold[k]; });

    /* テーマごとの変化（どのテーマで一番ぶれたか） */
    const themes = PRESSURE_PAIRS.map(function(p){
      const lo = worsenLean(byId[p.low].a, answers[p.low]);
      const hi = worsenLean(byId[p.high].a, answers[p.high]);
      if(lo === null || hi === null) return null;
      return {theme:p.theme, low:Math.round(lo*100), high:Math.round(hi*100), diff:Math.round((hi-lo)*100)};
    }).filter(Boolean).sort(function(a,b){ return b.diff - a.diff; });

    return {cold:cold, hot:hot, delta:delta, pairs:PRESSURE_PAIRS.length,
            answeredPairs: themes.length, themes:themes};
  }

  /* プレッシャー3段階での推定傾向 */
  function pressureLevels(answers){
    return [1,2,3].map(function(p){
      const prof = profileOf(s1Entries(answers, function(it){ return it.p === p; }));
      return {level:p, prof:prof};
    });
  }

  /* 危険トリガー
     絶対値だけで順位を付けると、全体的に低リスクな人にも「1位」が出てしまう。
     そこで「その人の普段の悪化傾向（ベースライン）」との差も見て、
     両方の条件を満たしたものだけをトリガーとして扱う */
  const TRG_MIN_SCORE = 35;   // その場面での悪化傾向の下限
  const TRG_MIN_DELTA = 10;   // ベースラインからの上昇幅の下限
  function triggerRanking(answers){
    const acc = {};
    Object.keys(TRIGGERS).forEach(function(k){ acc[k] = {sum:0, n:0}; });
    let baseSum = 0, baseN = 0;
    S1.forEach(function(it){
      const idx = answers[it.id];
      if(typeof idx !== "number") return;
      const lean = worsenLean(it.a, idx);
      if(lean === null) return;
      baseSum += lean; baseN++;
      (it.tg || []).forEach(function(tag){
        if(!acc[tag]) return;
        acc[tag].sum += lean; acc[tag].n++;
      });
    });
    const baseline = baseN ? Math.round(baseSum / baseN * 100) : 0;
    const all = Object.keys(acc).map(function(k){
      const a = acc[k];
      const score = a.n ? Math.round(a.sum / a.n * 100) : 0;
      return {k:k, name:TRIGGERS[k].name, line:TRIGGERS[k].line, score:score,
              delta: score - baseline, n:a.n,
              conf: a.n >= 8 ? "高" : (a.n >= 5 ? "中" : "低")};
    }).filter(function(x){ return x.n >= 3; })
      .sort(function(a,b){ return b.delta - a.delta; });

    const strong = all.filter(function(x){ return x.score >= TRG_MIN_SCORE && x.delta >= TRG_MIN_DELTA; });
    return {baseline:baseline, list:strong.slice(0,3), all:all, found:strong.length > 0};
  }

  /* 責任受容と自己否定の分離 */
  function responsibilityStyle(n){
    if(n.S >= 58 && n.B >= 48){
      return {key:"SELF_PUNISH", label:"自己処罰に寄りやすい型",
        body:"「自分がした行動」の話が、「自分という人間そのもの」の話に移りやすい状態です。反省の深さは誠実さの証明ではありますが、落ち込みの強さは相手の損害を戻しません。自分を責める時間が長いほど、修復の開始が遅れるという副作用が起きます。責任を取ることと、自分を罰することは別の作業として扱ってみてください。"};
    }
    if(n.F >= 58 || (n.B <= 42 && (n.H >= 55 || n.F >= 50))){
      return {key:"AVOID", label:"責任を小さく見積もりやすい型",
        body:"心理的な苦痛を減らすために、責任の大きさそのものを控えめに見積もる動きが出やすい状態です。これは弱さというより、負荷が高すぎる状況で人が普通にとる反応です。ただし見積もりが小さいぶん、相手が求める対応との差が生まれやすくなります。「自分が選んだ部分」だけを、ひとつ具体的に言語化するところから始めると、負荷を上げずに精度を上げられます。"};
    }
    if(n.B >= 62 && n.S >= 52){
      return {key:"OVER", label:"引き受けすぎやすい型",
        body:"自分の責任範囲を認められる一方で、他人や状況の要因まで引き取ってしまいやすい状態です。全部を背負うと、動けなくなるか、相手にとって必要な部分の対応が薄くなります。責任は「全部かゼロか」ではありません。自分が選んだ行動の部分だけを切り出して伝えるほうが、結果的に相手に届きます。"};
    }
    if(n.B >= 52 && n.D >= 50){
      return {key:"HEALTHY", label:"行動として責任を扱いやすい型",

    const hc = hotCold(answers);

      pressure: pressureLevels(answers),
      triggers: tr.list,

/* ================================================================

    const whyTxt = rkLow ? "強いて言えばこの反応が相対的に前に出ますが、値そのものは高くありません。追い詰められた時に決まった逃げ道を持たないぶん、その場の状況に判断が左右されやすいとも言えます。" : {

      H:"そこで止まるのは、無責任というより「まだ整理できていないものを出したくない」という気持ちに近いようです。時間を置くこと自体は、感情のままに動かないための機能でもあります。"
    }[rk];

    const riskTxt = rkLow ? "行き過ぎのリスクは今のところ小さめです。むしろ注意したいのは、決まった守り方がないぶん、想定外の場面で自分でも読めない反応が出ることのほうかもしれません。" : {
      F:"ただし、理由づけが十分にできてしまうぶん、責任の話が理由の話にすり替わりやすくなります。説明が通るほど修復が遅れる、という形が起こり得ます。",
      G:"ただし、その瞬間に反論を重ねると、本来持っている責任感のほうが相手に伝わらなくなります。あとから認めても、最初の言葉が残ります。",
      H:"ただし、沈黙は相手の側では別の意味に翻訳されます。時間が経つほど説明は難しくなり、様子見が結果として隠蔽に近づいていきます。"
    }[rk];

    const ruleTxt = {
      F:"「理由と責任は、別で話す。」",
      G:"「反論はあと。まず事実。」",
      H:"「完璧な説明より、先に一報。」"
    }[rk];

    const hotColdNote = (!rkLow) && Math.abs(hc.delta[rk]) >= 8
      ? "実際、失うものが小さい場面での" + AXES[rk].name + "は" + hc.cold[rk] + "、影響が大きい場面では" + hc.hot[rk] + "でした。"
      : "";

    return {
      pattern: patternTxt,
      but: butTxt + hotColdNote,
      why: whyTxt,
      risk: riskTxt,
      rule: "あなたの場合は、" + ruleTxt + "をルールにするほうが機能しやすそうです。",
      evidence: [
        "最も高い向き合う力：" + AXES[st].name + " " + n[st],
        "最も出やすい反応：" + AXES[rk].name + " " + n[rk],
        trig ? ("最も反応が出やすい条件：" + trig.name + " " + trig.score + "（該当設問 " + trig.n + "問）") : "トリガー：判定に十分な回答数なし",
        "理解―実行ギャップ：" + r.gap.value,
        "低圧時と高圧時の差（" + AXES[rk].name + "）：" + hc.cold[rk] + " → " + hc.hot[rk]
      ]
    };
  }

  /* IF → THEN 形式の自分専用ルール（5つ） */
  function ifThen(r, a2){
    const n = r.norm;
    const trig = a2.triggers.length ? a2.triggers[0] : null;
    const pool = [
      {sev:n.G-48, i:"強く責められて「でも」と言いたくなったら", t:"言い返す前に、事実・自分の責任・相手への影響の3つだけを話す。"},
      {sev:n.H-48, i:"怖くて連絡を後回しにしたくなったら", t:"完璧な説明を作る前に、最低限の一次連絡だけ先に入れる。"},
      {sev:n.F-48, i:"「相手にも悪いところがある」と考え始めたら", t:"相手側の問題と、自分が選んだ行動を、紙の上で別々に書き分ける。"},
      {sev:50-n.A, i:"どこまで話すか迷ったら", t:"分かっていること・分からないこと・これから確認することを、一度に全部出す。"},
      {sev:50-n.D, i:"「ごめん」と言い終わったら", t:"そのまま続けて、自分が今日やる修復をひとつ口に出す。"},
      {sev:50-n.E, i:"その場が収まってほっとしたら", t:"24時間以内に、同じことが起きない変更をひとつだけ実際に入れる。"},
      {sev:50-n.B, i:"「自分だけのせいじゃない」と思ったら", t:"その中で、自分が選べた場面をひとつだけ特定して、それを相手に言う。"},
      {sev:50-n.C, i:"「そんなつもりじゃなかった」と言いたくなったら", t:"意図の説明を後ろに回して、相手に起きた実害と手間を先に確認する。"},
      {sev:n.S-52, i:"「自分はだめだ」と考え始めたら", t:"落ち込む時間を10分で区切り、次の10分は相手のための作業に使う。"},
      {sev:r.gap.value-28, i:"何を言うか、その場で考え始めたら", t:"事前に決めた順番（事実 → 影響 → 責任 → これからすること）に切り替える。"},
      {sev:trig ? trig.score-45 : -99, i:trig ? (trig.name.replace(/時$/,"") + "と気づいたら") : "", t:"そこが自分の危ない場面だと認識して、返事をする前にいったん10分置く。"},
      {sev:6, i:"一人で判断したくなったら", t:"利害関係のない人に、事実だけを話して見立てをもらう。"},
      {sev:4, i:"何から手を付けるか分からなくなったら", t:"内容ではなく「いつ連絡するか」だけを先に決める。"},
      {sev:2, i:"今日はもう無理だと思ったら", t:"今日できる最小の一歩をひとつだけ決めて、それだけ終わらせる。"}
    ];
    return pool.filter(function(x){ return x.i; })
               .sort(function(a,b){ return b.sev-a.sev; }).slice(0,5);
  }

  /* 未来の自分への緊急メモ（初期文案） */
  function futureMemo(r, a2, ch, contra){
    const n = r.norm;
    const rk = ["F","G","H"].slice().sort(function(a,b){ return n[b]-n[a]; })[0];
    const first = {
      F:"今のお前は、たぶん理由を探してる。筋の通った説明を思いついても、それは責任の話とは別だ。",
      G:"今のお前は、たぶん言い返す言葉を考えてる。その一言は、問題より長く残る。先に飲み込め。",
      H:"今のお前は、たぶん連絡を後回しにしてる。時間が経つほど説明は難しくなる。今日中に一報だけ入れろ。"
    }[rk];
    const trig = a2.triggers.length ? a2.triggers[0].name : null;
    return "未来の自分へ。\n\n"
      + "今のお前はたぶん、かなり焦ってる。\n"
      + first + "\n\n"
      + (contra ? ("診断で出たお前の一番の癖はこれだった。\n「" + contra + "」\n今、まさにそれが起きてないか一度だけ確認しろ。\n\n") : "")
      + (trig ? ("これを書いた時の診断だと、お前が一番危ないのは「" + trig + "」だった。今がそれなら、なおさら急ぐな。\n\n") : "")
      + "今日やることは3つだけでいい。\n"
      + "1. 新しい嘘を足さない。\n"
      + "2. 分かっていることだけ、一度に伝える。\n"
      + "3. 今日できる修復をひとつ決めて、それだけやる。\n\n"
      + "全部を今日中に解決しなくていい。許してもらうことを急ぐな。\n"
      + "落ち込むのは後でいい。それは相手の損害を戻さない。";
  }

  /* 価値観 → 行動のギャップ */
  const VALUES = [
    {v:"正直さ", k:"A"}, {v:"責任", k:"B"}, {v:"思いやり", k:"C"}, {v:"公平さ", k:"B"},
    {v:"忠誠", k:"D"}, {v:"勇気", k:"A"}, {v:"自由", k:"B"}, {v:"信頼", k:"A"},
    {v:"約束", k:"E"}, {v:"成長", k:"E"}, {v:"冷静さ", k:"G", inv:true},
    {v:"家族", k:"C"}, {v:"愛情", k:"C"}
  ];
  function valueGap(values, n){
    return values.map(function(v){
      const def = VALUES.filter(function(x){ return x.v === v; })[0];
      if(!def) return null;
      const raw = n[def.k];
      const score = def.inv ? (100 - raw) : raw;
      let line;
      if(score >= 62){
        line = v + "を大切にしたい気持ちと、実際の反応の向きは近い位置にあります（" + AXES[def.k].name + " " + raw + "）。ここは、追い詰められた時にも比較的持ちこたえやすい部分かもしれません。";
      }else if(score >= 45){
        line = v + "を大切にしたいという気持ちに対して、実際の行動は場面によって揺れやすいようです（" + AXES[def.k].name + " " + raw + "）。失うものが大きい場面ほど、差が出やすいところです。";
      }else{
        line = v + "はあなたが大切にしたいものですが、実際の反応との間には距離がありそうです（" + AXES[def.k].name + " " + raw + "）。これは偽善という話ではありません。大事にしたいものほど、守れなかった時に苦しくなるというだけです。ルールを1つ決めておく価値がある領域です。";
      }
      return {v:v, axis:AXES[def.k].name, value:raw, line:line};
    }).filter(Boolean);
  }

  /* 修復コンパス */
  const COMPASS = [
    {k:"FACT", ja:"何が起きたか", q:"起きたことを、評価や理由を混ぜずに1〜2文で書く。", hint:"「〜してしまった」まで。「〜だったので」は入れない。"},

    {k:"REPAIR", ja:"今から直せること", q:"今日から3日以内にできる、具体的な回復行動を1つ書く。", hint:"謝罪以外で。戻す・直す・引き受ける。"},
    {k:"PREVENTION", ja:"次に起こさないための変更", q:"手順・環境・確認方法を、何かひとつ変えるとしたら何かを書く。", hint:"気をつける、は変更ではない。"}
  ];

  /* 緊急モードのステップ（診断結果があればトリガーに応じて差し替える） */
  function emergencySteps(r, a2){
    const base = [
      {t:"まず、これ以上増やさない。", b:"新しい嘘、追加の隠しごと、勢いで書いた長文。今ここで足したものが、あとで一番効いてくる。止めるのは今。"},
      {t:"事実を3つに分ける。", b:"分かっていること／まだ分からないこと／自分が選んだ部分。この3つに分けて、メモに書く。頭の中でやらない。"},

      {t:"説明と謝罪を混ぜない。", b:"経緯の説明と、責任を認める言葉。混ぜると、謝罪が言い訳として届く。分けて、謝罪を先に置く。"},
      {t:"今日は、1つだけ。", b:"全部を今日片づけない。今日できる修復を1つ決めて、それだけやる。許してもらうことは、今日の目標にしない。"}
    ];
    if(!r) return base;
    const n = r.norm;
    const rk = ["F","G","H"].slice().sort(function(a,b){ return n[b]-n[a]; })[0];
    const neutralExtra = {t:"「これくらいなら」と思ったら、そこで一度止まる。",
      b:"あなたは特定の逃げ方が強く出るタイプではありません。だからこそ、危ないのは決まった場面ではなく、油断した場面のほうです。"};
    const extra = (n[rk] < 45) ? neutralExtra : {
      F:{t:"うまい説明を思いついたら、いったん止める。", b:"あなたは理由づけが速いほう（自己正当化 "+n.F+"）。その説明は筋が通っているかもしれないが、今それを出すと責任の話が消える。"},
      G:{t:"返信する前に、10分置く。", b:"あなたは責められた直後に言い返す言葉が先に出るほう（防衛的反発 "+n.G+"）。最初の10分に書いた文章は、送らない。"},
      H:{t:"完璧な説明より、先に一報。", b:"あなたは連絡を後回しにしやすいほう（回避・隠蔽 "+n.H+"）。「まだ整理中だけど、これだけは分かっている」で十分。"}
    }[rk];
    const trig = a2 && a2.triggers.length ? a2.triggers[0] : null;
    const steps = [base[0], extra, base[1], base[2], base[3], base[4]];
    if(trig){
      steps.splice(2, 0, {t:"今、「" + trig.name.replace(/時$/,"" ) + "」になっていないか。",
        b:"あなたの回答だと、この条件のときに判断が変わりやすかった（" + trig.score + "／100）。当てはまるなら、いつもより一段ゆっくり動く。それだけで十分効く。"});
    }
    return steps;
  }

  return {narrative:narrative, ifThen:ifThen, futureMemo:futureMemo,
          VALUES:VALUES, valueGap:valueGap, COMPASS:COMPASS, emergencySteps:emergencySteps};
})();

/* ---- 日付表記は日本語で ---- */
function ymd(d){
  const x = d instanceof Date ? d : new Date(d);
  return x.getFullYear() + "年" + (x.getMonth()+1) + "月" + x.getDate() + "日";
}
function mdOnly(d){
  const x = d instanceof Date ? d : new Date(d);
  return (x.getMonth()+1) + "月" + x.getDate() + "日";
}
function ymdhm(d){
  const x = d instanceof Date ? d : new Date(d);
  const hh = ("0"+x.getHours()).slice(-2), mm = ("0"+x.getMinutes()).slice(-2);
  return ymd(x) + " " + hh + ":" + mm;
}
function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
}

let SAVE_FAILED = false;   // 端末の保存領域が使えない場合に true
function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      v:3,
      answers:state.answers, idx:state.idx, finished:state.finished, perm:state.perm,
      values:state.values, memo:state.memo, level:state.level, preState:state.preState,
      records:state.records, todayRule:state.todayRule, daily:state.daily,
      guideSeen:state.guideSeen, a2hSeen:state.a2hSeen,
      repair:state.repair, legacyHistory:state.legacyHistory,
      consent:state.consent
    }));
    SAVE_FAILED = false;
    return true;
  }catch(e){
    /* プライベートモードや保存容量の上限などで保存できないことがある。
       利用そのものは続けられるので、止めずに知らせるだけにする */
    SAVE_FAILED = true;
    return false;
  }
}

let LOAD_PARTIAL = false;   // 一部を読み込めなかった場合に true

/* 保存データが古い形式・破損していても、アプリ全体を止めない。
   読めた分だけ復旧し、勝手に全消去はしない */
function readStore(key){
  let raw = null;
  try{ raw = localStorage.getItem(key); }catch(e){ return null; }
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){
    /* 壊れていても消さずに退避しておく */
    try{ localStorage.setItem(key + "_broken", raw); }catch(e2){}
    LOAD_PARTIAL = true;
    return null;
  }
}
function adopt(d){
  const isObj = function(v){ return v && typeof v === "object" && !Array.isArray(v); };
  const isArr = Array.isArray;
  const pick = [
    ["answers", isObj, {}], ["perm", isObj, {}], ["values", isArr, []],
    ["records", isArr, []], ["daily", isObj, {}], ["legacyHistory", isArr, []],
    ["consent", isObj, null], ["repair", isObj, null]
  ];
  pick.forEach(function(p){
    if(d[p[0]] === undefined) return;
    if(p[1](d[p[0]])) state[p[0]] = d[p[0]];
    else LOAD_PARTIAL = true;
  });
  if(typeof d.idx === "number" && isFinite(d.idx)) state.idx = Math.max(0, Math.floor(d.idx));
  if(typeof d.level === "number") state.level = Math.min(3, Math.max(1, Math.floor(d.level)));
  state.finished = !!d.finished;
  if(typeof d.memo === "string") state.memo = d.memo;
  if(typeof d.todayRule === "string") state.todayRule = d.todayRule;
  if(typeof d.preState === "string") state.preState = d.preState;
  if(typeof d.guideSeen === "boolean") state.guideSeen = d.guideSeen;
  if(typeof d.a2hSeen === "boolean") state.a2hSeen = d.a2hSeen;
  /* 記録は1件ずつ検証し、壊れた1件のために全部を失わないようにする */
  if(isArr(state.records)){
    const ok = state.records.filter(function(r){
      return r && typeof r === "object" && r.snap && r.snap.r && r.snap.r.norm && r.snap.ch;
    });
    if(ok.length !== state.records.length) LOAD_PARTIAL = true;
    state.records = ok;
  }
}
function load(){
  const d = readStore(STORE_KEY);
  if(d){ adopt(d); return true; }
  /* --- 旧バージョンからの移行（消さずに引き継ぐ） --- */
  for(let i=0;i<OLD_KEYS.length;i++){
    const old = readStore(OLD_KEYS[i]);
    if(!old) continue;
    state.answers = (old.answers && typeof old.answers === "object") ? old.answers : {};
    state.idx = typeof old.idx === "number" ? old.idx : 0;
    state.finished = !!old.finished;
    state.perm = (old.perm && typeof old.perm === "object") ? old.perm : {};
    state.values = Array.isArray(old.values) ? old.values : [];
    state.memo = typeof old.memo === "string" ? old.memo : null;
    state.legacyHistory = Array.isArray(old.history) ? old.history : [];
    save();
    return true;
  }
  return false;
}
function wipeAll(){
  try{ localStorage.removeItem(STORE_KEY); OLD_KEYS.forEach(function(k){ localStorage.removeItem(k); }); }catch(e){}
  state.answers = {}; state.idx = 0; state.finished = false; state.perm = {};
  state.values = []; state.memo = null; state.level = 1; state.preState = null;
  state.records = []; state.todayRule = null; state.daily = {}; state.repair = null;
  state.consent = null; state.guideSeen = false; state.a2hSeen = false;
  state.legacyHistory = []; RESULT = null;
}
function wipePart(kind){
  if(kind === "records"){ state.records = []; state.legacyHistory = []; }
  if(kind === "memo"){ state.memo = null; }
  if(kind === "daily"){ state.daily = {}; }
  if(kind === "repair"){ state.repair = null; }
  if(kind === "rule"){ state.todayRule = null; }
  if(kind === "answers"){
    state.answers = {}; state.idx = 0; state.finished = false; state.perm = {};
    state.preState = null; RESULT = null; VIEWING_RECORD = null;
  }
  return save();
}
