const BACKUP_VERSION = 1;
const BACKUP_APP = "re:act note";
const BACKUP_MAX_BYTES = 4 * 1024 * 1024;   // 4MB を超えるファイルは受け付けない

function backupObject(){
  return {
    app: BACKUP_APP,
    backupVersion: BACKUP_VERSION,
    diagnosticVersion: DIAGNOSTIC_VERSION,
    exportedAt: new Date().toISOString(),
    data: {
      answers: state.answers, idx: state.idx, finished: state.finished, perm: state.perm,
      values: state.values, memo: state.memo, level: state.level, preState: state.preState,
      records: state.records, todayRule: state.todayRule, daily: state.daily,
      repair: state.repair, legacyHistory: state.legacyHistory,
      consent: state.consent, guideSeen: state.guideSeen
    }
  };
}
function backupFileName(){
  const d = new Date();
  const p = function(n){ return ("0" + n).slice(-2); };
  return "react-note-backup-" + d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + ".json";
}

/* 読み込んだファイルは信用しない。形と型を確かめてから使う */
function validateBackup(obj){
  const isObj = function(v){ return v && typeof v === "object" && !Array.isArray(v); };
  if(!isObj(obj)) return {ok:false};
  if(obj.app !== BACKUP_APP) return {ok:false};
  const bv = obj.backupVersion;
  if(typeof bv !== "number" || !isFinite(bv) || bv < 1 || bv > BACKUP_VERSION) return {ok:false};
  if(!isObj(obj.data)) return {ok:false};
  const d = obj.data;

  const clean = {};
  clean.answers = isObj(d.answers) ? d.answers : {};
  clean.perm = isObj(d.perm) ? d.perm : {};
  clean.idx = (typeof d.idx === "number" && isFinite(d.idx)) ? Math.max(0, Math.floor(d.idx)) : 0;
  clean.finished = !!d.finished;
  clean.level = (typeof d.level === "number") ? Math.min(3, Math.max(1, Math.floor(d.level))) : 1;
  clean.values = Array.isArray(d.values) ? d.values.filter(function(v){ return typeof v === "string"; }).slice(0,3) : [];
  clean.memo = typeof d.memo === "string" ? d.memo.slice(0, 4000) : null;
  clean.todayRule = typeof d.todayRule === "string" ? d.todayRule.slice(0, 200) : null;
  clean.preState = typeof d.preState === "string" ? d.preState.slice(0, 20) : null;
  clean.guideSeen = !!d.guideSeen;
  clean.consent = isObj(d.consent) ? {
    terms: typeof d.consent.terms === "string" ? d.consent.terms.slice(0,10) : null,
    privacy: typeof d.consent.privacy === "string" ? d.consent.privacy.slice(0,10) : null,
    at: typeof d.consent.at === "string" ? d.consent.at.slice(0,40) : null
  } : null;
  clean.repair = isObj(d.repair) ? (function(){
    const r = {};
    REPAIR_STEPS.forEach(function(st){
      if(typeof d.repair[st.k] === "string") r[st.k] = d.repair[st.k].slice(0, 4000);
    });
    return r;
  })() : null;
  clean.daily = isObj(d.daily) ? (function(){
    const o = {};
    Object.keys(d.daily).slice(0, 400).forEach(function(k){
      const v = d.daily[k];
      if(isObj(v) && typeof v.q === "string" && typeof v.a === "number"){
        o[String(k).slice(0,10)] = {q: v.q.slice(0,10), a: Math.max(0, Math.floor(v.a))};
      }
    });
    return o;
  })() : {};
  clean.records = Array.isArray(d.records) ? d.records.filter(function(r){
    if(!(r && typeof r === "object" && typeof r.id === "string" && typeof r.t === "string")) return false;
    const sp = r.snap;
    if(!(sp && sp.r && sp.r.norm && sp.a2 && sp.nar && Array.isArray(sp.ift))) return false;
    /* 表示に必要なものが全部そろっている記録だけを受け入れる */
    const okNorm = AXIS_ORDER.concat(["S"]).every(function(k){ return typeof sp.r.norm[k] === "number"; });
    const okGap = sp.r.gap && typeof sp.r.gap.value === "number";
    const okCh = sp.ch && CHARS[sp.ch.initial] && CHARS[sp.ch.recovery]
      && Array.isArray(sp.ch.initialReasons) && Array.isArray(sp.ch.recoveryReasons);
    const okA2 = Array.isArray(sp.a2.contradictions) && sp.a2.triggerInfo && sp.a2.hotCold && Array.isArray(sp.a2.pressure);
    return okNorm && okGap && okCh && okA2;
  }).slice(-20).map(function(r){
    r.note = typeof r.note === "string" ? r.note.slice(0, 200) : "";
    r.next = typeof r.next === "string" ? r.next.slice(0, 200) : null;
    r.dv = typeof r.dv === "string" ? r.dv.slice(0, 10) : null;
    return r;
  }) : [];
  clean.legacyHistory = Array.isArray(d.legacyHistory) ? d.legacyHistory.slice(-20) : [];

  return {ok:true, clean:clean, meta:{
    exportedAt: typeof obj.exportedAt === "string" ? obj.exportedAt : null,
    diagnosticVersion: typeof obj.diagnosticVersion === "string" ? obj.diagnosticVersion : null,
    backupVersion: bv,
    counts: {
      records: clean.records.length,
      daily: Object.keys(clean.daily).length,
      memo: clean.memo ? 1 : 0,
      rule: clean.todayRule ? 1 : 0,
      answers: Object.keys(clean.answers).length
    }
  }};
}

function applyBackup(clean){

/* 書き出し。環境によって保存の仕方が違うので、順に試す */
function exportBackup(done){
  const json = JSON.stringify(backupObject(), null, 2);
  const name = backupFileName();
  const blob = new Blob([json], {type:"application/json"});
  (async function(){
    if(isHosted()){
      /* 公開ページではページ側からのダウンロードが止められるので、
         用意されている保存の仕組みを使う。使えなければ本文表示にまわす */
      try{
        const dl = await window.claude.use("downloads");
        if(dl){ await dl.save({filename:name, data:blob}); done("saved"); return; }
      }catch(e){
        if(e && e.code === "declined"){ done("declined"); return; }
      }
      done("fallback", json, name);
      return;
    }
    try{
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      done("saved");
    }catch(e){ done("fallback", json, name); }
  })();
}

function makeSnapshot(){

    preState: state.preState,

}
function saveRecord(note){

}

function prevRecordFor(rec){
  const i = state.records.indexOf(rec);

}

function isAnswered(entry){

/* 埋め込み表示（iframe・アプリ内ブラウザ）では、ブラウザが confirm / alert / prompt を
   無効化することがある。そのままではボタンが無反応になってしまうため、
   確認も入力も通知も、画面の中だけで完結させる。
   確認は「もう一度押す」方式。6秒たつと自動で元に戻る。 */
let confirmKey = null, confirmTimer = null;
function confirmTwice(key, target, label){
  const b = (typeof target === "string") ? document.getElementById(target) : target;
  if(confirmKey === key){ confirmKey = null; clearTimeout(confirmTimer); return true; }
  if(!b) return true;
  confirmKey = key;
  if(!b.dataset.label) b.dataset.label = b.textContent;
  b.textContent = label;
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(function(){
    if(confirmKey !== key) return;
    confirmKey = null;
    if(b.dataset.label && b.parentNode) b.textContent = b.dataset.label;
  }, 6000);
  return false;
}
/* 公開ページ（claude.ai のビューア）で動いているか */
function isHosted(){ return !!(window.claude && typeof window.claude.use === "function"); }
/* 利用者の自由入力は、原則として textContent で描画する。
   やむを得ず文字列連結でHTMLを組む場合のために、エスケープも用意しておく */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
/* data-user-text を持つ要素に、利用者入力を textContent として流し込む */
function fillUserText(root, map){
  Array.prototype.forEach.call((root || document).querySelectorAll("[data-user-text]"), function(el){
    const k = el.getAttribute("data-user-text");
    el.textContent = (map && map[k] != null) ? String(map[k]) : "";
  });
}

/* 結果の計算（キャッシュ付き） */
function computeAll(){
  const r = SCORING.compute(state.answers);
  const a2 = ANALYSIS2.compute(state.answers, r);
  RESULT = {r:r, a2:a2, ch:CHAR_PICK.pick(r.norm),
            nar:TEXT2.narrative(r, a2), ift:TEXT2.ifThen(r, a2)};
  return RESULT;
}
/* 前回と今回を比べるための組（記録が2件以上あればそこから、無ければ旧履歴から） */
function comparePair(){
  const rs = state.records || [];
  if(rs.length >= 2){
    const a = rs[rs.length-2], b = rs[rs.length-1];
    return {prev:a.snap.r.norm, now:b.snap.r.norm, prevT:a.t, nowT:b.t, prevCh:a.snap.ch,
            prevDv:a.dv || null, nowDv:b.dv || null};
  }
  if(rs.length === 1 && RESULT && state.finished){
    const a = rs[rs.length-1];
    if(a.snap.r.norm !== RESULT.r.norm){
      return {prev:a.snap.r.norm, now:RESULT.r.norm, prevT:a.t, nowT:new Date().toISOString(), prevCh:a.snap.ch,
              prevDv:a.dv || null, nowDv:DIAGNOSTIC_VERSION};
    }
  }
  const lh = state.legacyHistory || [];
  if(lh.length >= 2){
    const a = lh[lh.length-2], b = lh[lh.length-1];
    return {prev:a.norm, now:b.norm, prevT:a.t, nowT:b.t, prevCh:{initial:a.initial}};
  }
  return null;
}

  while(i < ITEMS.length && isAnswered(ITEMS[i])) i++;
  state.idx = Math.min(i, ITEMS.length - 1);
  renderQuestion(); show("quiz");
}

/* 選択肢の並び順は設問ごとにランダム化して保存する。
   「いつも上が模範解答」という位置の手がかりを消すため。回答は元のindexで保持する */
function optOrder(id, len){
  if(!state.perm[id] || state.perm[id].length !== len){
    const a = [];
    for(let i=0;i<len;i++) a.push(i);
    for(let i=len-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
    state.perm[id] = a; save();
  }
  return state.perm[id];
}

    btn.onclick = function(){
      if(entry.type === "s1"){
        state.answers[it.id] = parseInt(btn.dataset.i,10); markOne(btn,"sel"); advanceSoon();
      }else if(entry.type === "s2"){
        state.answers[it.id] = parseInt(btn.dataset.v,10); markOne(btn,"sel"); advanceSoon();
      }else{
        const role = btn.dataset.role;
        const cur = state.answers[it.id] || {};
        cur[role] = parseInt(btn.dataset.i,10);
        state.answers[it.id] = cur;
        Array.prototype.forEach.call(btn.parentNode.querySelectorAll(".opt"), function(b){ b.classList.remove("sel","sel-2"); });
        btn.classList.add(role === "ideal" ? "sel" : "sel-2");
        if(typeof cur.ideal === "number" && typeof cur.actual === "number"){
          document.getElementById("navNext").disabled = false;
          advanceSoon(380);
        }
      }
      save();
    };
  });
  bind("navPrev", function(){ if(state.idx>0){ state.idx--; save(); renderQuestion(); } });
  bind("navNext", goNext);
}

function markOne(btn, cls){
  Array.prototype.forEach.call(btn.parentNode.querySelectorAll(".opt"), function(b){ b.classList.remove("sel","sel-2"); });
  btn.classList.add(cls);
  const nx = document.getElementById("navNext"); if(nx) nx.disabled = false;
}
let advTimer = null;
function advanceSoon(ms){ clearTimeout(advTimer); advTimer = setTimeout(goNext, ms || 260); }

function goNext(){
  if(!isAnswered(ITEMS[state.idx])) return;
  const c = chapterOf(state.idx);
  const nextIdx = state.idx + 1;
  if(nextIdx >= ITEMS.length){ finish(); return; }
  state.idx = nextIdx; save();
  if(nextIdx === c.end){ renderCheckpoint(c); return; }  // チャプター終了
  renderQuestion();
}

/* チャプターの区切り（スコアやタイプのヒントは出さない） */
function renderCheckpoint(done){
  const next = chapterOf(state.idx);
  const fig = ["hedgehog","fox","owl","deer","beaver"][next.n - 1] || "owl";
  const left = ITEMS.length - state.idx;
  const mins = Math.max(1, Math.round(left * 13 / 60));
  const chLeft = CHAPTERS.length - done.n;
  el.quiz.innerHTML = '<div class="card checkpoint fade" style="margin-top:36px">'
    + '<div class="cp-fig">' + CHARS[fig].svg + '</div>'
    + '<div class="cp-n">CHAPTER ' + done.n + ' 完了</div>'
    + '<div class="cp-t round">' + done.title + '</div>'
    + '<div class="cp-c">ここまで保存しました。</div>'
    + '<div class="cp-c faint" style="font-size:.82rem;margin-top:12px">'
      + (chLeft > 0 ? 'のこり' + chLeft + 'チャプター　／　あと約' + mins + '分' : 'あと少しです') + '</div>'
    + '<hr class="sep">'
    + '<div class="cp-next">つぎは CHAPTER ' + next.n + '　' + next.title + '</div>'
    + '<p class="muted" style="font-size:.9rem">' + next.note + '</p>'
    + '<button class="btn" id="cpNext" style="margin-top:20px">このまま続ける</button>'
    + '<button class="btn-sub" id="cpStop">ここで休む</button></div>';
  updateProgress();
  toast("ここまで保存しました");
  bind("cpNext", renderQuestion);
  bind("cpStop", function(){
    save(); renderIntro(); show("intro");
    toast("続きは保存されています");
  });
}

/* 結果の前に、短い間を置く（過剰な疑似AI演出にはしない） */
function renderAnalyzing(done){
  const lines = ["あなたの反応を整理しています", "守ろうとする瞬間", "向き合える瞬間", "その差を見ています"];
  el.tool.innerHTML = '<div class="analyzing">'
    + '<div class="logo-sm round">re<span class="c">:</span>act <span class="logo-n">note</span></div>'
    + '<div class="an-line" id="anLine"></div>'
    + '<div class="an-dots"><i></i><i></i><i></i></div></div>';
  show("tool");
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const step = reduce ? 160 : 620;
  let i = 0;
  const line = document.getElementById("anLine");
  function tick(){
    if(i >= lines.length){ done(); return; }
    line.textContent = lines[i];
    line.classList.remove("fade");
    void line.offsetWidth;
    line.classList.add("fade");
    i++;
    setTimeout(tick, step);
  }
  tick();
}

function finish(){
  state.finished = true;
  const res = computeAll();
  if(!state.memo) state.memo = TEXT2.futureMemo(res.r, res.a2, res.ch, res.a2.contradictions[0] && res.a2.contradictions[0].title);
  state.level = 1;
  state.justFinished = true;   // 「この結果を記録する」を出すため
  save();
  renderAnalyzing(function(){ renderResult(); show("result"); });
}

const RISK_USEFUL = {
  F:{bad:"理由づけが十分にできてしまうと、責任の話が理由の話にすり替わりやすくなります。",
     good:"混乱した状況に筋道をつけ、その場を荒らさずに話を進められる力でもあります。"},
  G:{bad:"最初の数分の言い返しが、問題そのものより長く相手に残ることがあります。",
     good:"理不尽な要求から、自分の立場や境界線を守る力でもあります。"},
  H:{bad:"時間が空くほど説明は難しくなり、様子見が放置に近づいていきます。",
     good:"感情のまま動かず、その場で壊さずに済ませる力でもあります。"}

function barHTML(k, v, risk){
  const a = AXES[k];

function miniBar(label, v, risk){

    + '<span class="mini-v">' + v + '</span></div>';

/* 内部の計算式ではなく、言葉で結果の理由を説明する */
function whyText(R){
  const ch = R.ch, a2 = R.a2;
  const out = [];
  const ir = ch.initialReasons[0];
  if(ir && ir.value !== undefined){
    out.push("問題が起きた直後の場面では、" + ir.name + "の出方が" + ir.value + "でした。"
      + (ir.value >= 55 ? "平均的な選び方より高めです。" : (ir.value <= 45 ? "平均的な選び方より低めです。" : "ちょうど真ん中あたりです。")));
  }
  const ti = a2.triggerInfo;
  if(ti && ti.found && ti.list[0]){
    out.push("特に「" + ti.list[0].name + "」を含む場面では、問題を大きくしやすい選択に寄っていました（普段より+" + ti.list[0].delta + "）。");
  }else{
    out.push("特定の場面だけ大きく崩れる、という偏りは見えませんでした。");
  }
  const rr = ch.recoveryReasons[0];
  if(rr && rr.value !== undefined){
    out.push("一方で、時間が経ってからの" + rr.name + "は" + rr.value + "。"
      + (rr.value >= 55 ? "こちらは比較的高く出ています。" : (rr.value <= 45 ? "こちらは控えめでした。" : "こちらは真ん中あたりでした。")));
  }
  out.push("その組み合わせから、最初に顔を出しやすいのは" + CHARS[ch.initial].name
    + (ch.same ? "、時間が経っても同じ反応が続きやすい" : "、落ち着いた後は" + CHARS[ch.recovery].name)
    + "、という結果になりました。");
  out.push("わかっていることと、やりそうなことの差は" + R.r.gap.value + "。8問中" + R.r.gap.matched + "問では、適切だと思う案と実際に取りそうな案が一致していました。");
  return out;
}

   re:シリーズ（診断後の機能）
   ================================================================ */
function nav(name, arg){
  if(name === "gallery")  return renderGallery(haveResult());
  if(name === "values")   return renderValues();
  if(name === "memo")     return renderMemo();
  if(name === "mind" || name === "emergency") return renderMind();
  if(name === "play" || name === "sim")       return renderPlayMenu();
  if(name === "phrase" || name === "excuse")  return renderPhrase();
  if(name === "pair" || name === "event")     return renderPair();
  if(name === "view")     return renderView();
  if(name === "record")   return renderRecord();
  if(name === "daily")    return renderDaily();
  if(name === "share")    return renderShare();
  if(name === "pickone")  return renderPickOne();
  if(name === "settings") return renderSettings();
  if(name === "safety")   return renderSafety();
  if(name === "privacy")  return renderDoc("privacy");
  if(name === "terms")    return renderDoc("terms");
  if(name === "about")    return renderDoc("about");
  if(name === "print"){ window.print(); return; }
  if(name === "rules"){
    state.level = 3; save(); renderResult(); show("result");
    const c = document.getElementById("rulesCard");
    if(c) c.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
}
function backBtn(label){ return '<button class="btn-sub" id="toolBack">' + (label || "閉じる") + '</button>'; }
function toolShell(title, body, lead, sub){
  el.tool.innerHTML = '<div class="card fade" style="margin-top:20px">'
    + (sub ? '<div class="sec-k">' + sub + '</div>' : '')
    + '<h1 class="tool-h round">' + title + '</h1>'
    + (lead ? '<p class="muted" style="font-size:.92rem">' + lead + '</p>' : '') + body
    + backBtn() + '</div>';
  bind("toolBack", function(){
    if(haveResult()){ renderResult(); show("result"); } else { renderIntro(); show("intro"); }
  });
  show("tool");
}

/* ---------------- 次に意識するなら、ひとつ ---------------- */
function nextOneOptions(){
  if(!RESULT) computeAll();
  const list = RESULT.ift.slice(0,3).map(function(x){ return x.t; });
  const extra = ["悪い情報ほど、小出しにしない。", "消えたくなっても、連絡だけは止めない。", "反論はあと。まず事実。"];
  extra.forEach(function(e){ if(list.length < 3 && list.indexOf(e) < 0) list.push(e); });
  return list.slice(0,3);
}
function renderPickOne(){
  const opts = nextOneOptions();
  const body = '<div class="pick-one">' + opts.map(function(t,i){
      return '<button class="pick-b' + (state.todayRule === t ? ' on' : '') + '" data-i="' + i + '">' + t + '</button>';
    }).join("") + '</div>'
    + '<div class="picked-note" id="pickNote">' + (state.todayRule ? '「' + state.todayRule + '」をホームに表示しています。' : 'ひとつ選ぶと、ホームに小さく表示されます。あとから変えられます。') + '</div>';
  toolShell("次に意識するなら、どれにしますか？", body,
    "全部やろうとしなくて大丈夫です。ひとつだけ持って帰るほうが、実際に思い出せます。", "re:act note");
  Array.prototype.forEach.call(el.tool.querySelectorAll(".pick-b"), function(b){
    b.onclick = function(){
      state.todayRule = opts[parseInt(b.dataset.i,10)]; save();
      Array.prototype.forEach.call(el.tool.querySelectorAll(".pick-b"), function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      document.getElementById("pickNote").textContent = '「' + state.todayRule + '」をホームに表示しています。';
      toast("変更を保存しました");
    };
  });
}

    let body = '<div class="daily-q round">' + d.item.q + '</div>';
    if(!answered){
      body += '<div class="opts">' + d.item.a.map(function(o,i){
        return '<button class="opt" data-i="' + i + '">' + o.t + '</button>';
      }).join("") + '</div>'
      + '<p class="disclaimer" style="margin-top:18px">点数はつきません。診断の結果にも影響しません。</p>';
    }else{
      body += '<div class="opts"><div class="opt sel">' + d.item.a[answered.a].t + '</div></div>'
        + '<div class="daily-r">' + d.item.a[answered.a].r + '</div>'
        + '<p class="disclaimer" style="margin-top:18px">明日には、別の問いになります。</p>'

const FEELINGS = [
  {k:"hurry", label:"焦り",     line:"焦っているときは、いちばん短時間で終わる選択が魅力的に見えます。それが後で一番高くつくこともあります。"},
  {k:"anger", label:"怒り",     line:"怒りがあるときは、相手の落ち度のほうが大きく見えます。今日は送信ボタンを押さない、と決めるだけで十分です。"},
  {k:"fear",  label:"怖さ",     line:"怖いときは、伝える範囲がだんだん小さくなります。全部でなくていいので、いちばん重い事実から先に出してください。"},
  {k:"shame", label:"恥ずかしさ", line:"恥ずかしさが強いときは、損害の大きさより「どう見られるか」で判断しがちです。相手の側で起きたことを、先に書き出してみてください。"},
  {k:"guilt", label:"罪悪感",   line:"罪悪感が強いときほど、謝ることで区切りをつけたくなります。相手が求めているのは、たいてい次の行動のほうです。"},
  {k:"down",  label:"落ち込み", line:"落ち込みが深いときは、動けないこと自体が次の問題になります。今日は1つだけ、と決めてしまってください。"}
];
function renderMind(){
  const hasR = haveResult();
  if(hasR && !RESULT) computeAll();
  let feel = null, level = null, stepI = -1;
  const steps = TEXT2.emergencySteps(hasR ? RESULT.r : null, hasR ? RESULT.a2 : null);

  function shell(inner){
    el.tool.innerHTML = '<div style="margin-top:32px" class="fade">'
      + '<div class="logo-sm round" style="margin-bottom:8px">re<span class="c">:</span>mind</div>'
      + '<div class="sec-k" style="margin-bottom:26px">今の気持ちを確認する</div>'
      + inner
      + '<button class="btn-sub" id="toolBack" style="margin-top:30px">閉じる</button></div>';
    bind("toolBack", function(){
      if(haveResult()){ renderResult(); show("result"); } else { renderIntro(); show("intro"); }
    });
    show("tool");
  }
  function draw(){
    if(feel === null){
      shell('<div class="panic-q round">今、いちばん近いのはどれですか。</div>'
        + '<div class="feel-grid">' + FEELINGS.map(function(f){ return '<button class="feel-b" data-k="' + f.k + '">' + f.label + '</button>'; }).join("") + '</div>'
        + '<button class="btn-sub" id="skipFeel" style="margin-top:16px">よく分からない</button>'
        + '<p class="disclaimer" style="margin-top:22px">これは診断ではありません。医学的な判断もしません。今の状態を一度だけ言葉にして、判断を急がないための入口です。</p>');
    }else if(level === null){
      const f = FEELINGS.filter(function(x){ return x.k === feel; })[0];
      shell('<div class="panic-q round">その強さは、どのくらいですか。</div>'
        + '<div class="panic-row">' + Array.from({length:11}, function(_,i){ return '<button class="panic-b" data-p="' + i + '">' + i + '</button>'; }).join("") + '</div>'
        + '<div class="panic-scale"><span>0 落ち着いている</span><span>10 いっぱいいっぱい</span></div>'
        + (f ? '<div class="panic-msg" style="margin-top:26px">' + f.line + '</div>' : ''));
    }else if(stepI === -1){
      const high = level >= 7;
      shell('<div class="panic-msg">' + (high
        ? "今は、判断より防衛が先に出やすい状態かもしれません。正しい判断を出すより、悪手を1つ減らすほうが大事です。決めるのは後でいい。"
        : "進められそうですね。順番に1つずつ確認していきましょう。") + '</div>'
        + (state.memo ? '<div class="memo-paper" style="margin-bottom:20px"><div class="memo-k">future me</div><div class="memo-body" data-user-text="memo"></div></div>' : '')
        + '<button class="btn" id="emStart">1つずつ確認する</button>'
        + '<button class="btn-sub" data-go="pair">先に、出来事を整理する</button>');
    }else{
      const st = steps[stepI];
      shell('<div class="em-step"><div class="em-n">' + (stepI+1) + ' / ' + steps.length + '</div>'
        + '<div class="em-t round">' + st.t + '</div><div class="em-b">' + st.b + '</div></div>'
        + (stepI < steps.length-1
            ? '<button class="btn" id="emNext">次へ</button>'
            : '<div class="note">ここまでできれば、少なくとも今日、これ以上大きくすることは避けられます。残りは明日でいい。</div><button class="btn-sub" data-go="pair">出来事を整理する</button>')
        + (stepI > 0 ? '<button class="btn-sub" id="emPrev">前にもどる</button>' : ''));
    }
    fillUserText(el.tool, {memo: state.memo});
    Array.prototype.forEach.call(el.tool.querySelectorAll(".feel-b"), function(b){
      b.onclick = function(){ feel = b.dataset.k; draw(); };
    });
    Array.prototype.forEach.call(el.tool.querySelectorAll(".panic-b"), function(b){
      b.onclick = function(){ level = parseInt(b.dataset.p,10); draw(); };
    });
    Array.prototype.forEach.call(el.tool.querySelectorAll("[data-go]"), function(b){
      b.onclick = function(){ nav(b.dataset.go); };
    });
    bind("skipFeel", function(){ feel = "unknown"; level = 5; draw(); });
    bind("emStart", function(){ stepI = 0; draw(); });
    bind("emNext", function(){ stepI++; draw(); });
    bind("emPrev", function(){ stepI--; draw(); });
  }
  draw();
}

const MARK_VIEW = {
  truth:  {keep:"関係の土台と、あとの説明のしやすさ", seen:"早めに言ってくれた、と受け取られやすい", then:"事態が小さいうちに終わりやすくなります。"},
  repair: {keep:"相手の負担と、これからの信頼", seen:"実際に動いている、と伝わりやすい", then:"言葉だけのときより、回復が早くなりやすいです。"},
  defense:{keep:"自分の立場と、尊厳", seen:"反省していないように見える可能性がある", then:"論点が問題の話から態度の話に移りやすくなります。"},
  justify:{keep:"「自分は悪い人ではない」という感覚", seen:"言い訳に聞こえる可能性がある", then:"責任の話が後ろに下がり、修復が遅れやすくなります。"},
  avoid:  {keep:"今この瞬間の気まずさ", seen:"軽く見られている、と感じられる可能性がある", then:"時間が経つほど、説明の難易度が上がります。"}
};
function renderPlayMenu(){
  const body = '<div class="sim-menu">' + SIM.map(function(s){
      return '<button class="sim-card" data-s="' + s.id + '"><span class="sim-cat">' + s.cat + '</span><span class="sim-t">' + s.title + '</span></button>';
    }).join("") + '</div>'
    + '<button class="btn-sub" id="simRandom">どれかひとつ、おまかせで</button>';
  toolShell("あの場面をもう一度考える", body,
    "正解・不正解はつけません。選ぶたびに「その選択が何を守ろうとしているか」「相手からはどう見える可能性があるか」を並べます。最初の失敗より、そのあとの行動で状況が変わることがあります。",
    "re:play");
  Array.prototype.forEach.call(el.tool.querySelectorAll(".sim-card"), function(b){
    b.onclick = function(){ runSim(b.dataset.s); };
  });
  bind("simRandom", function(){ runSim(SIM[Math.floor(Math.random()*SIM.length)].id); });
}
function runSim(id){
  const sc = SIM.filter(function(s){ return s.id === id; })[0];
  const st = {sev:0, step:0, log:[]};
  function drawStep(){
    if(st.step >= sc.steps.length) return finishSim(sc, st);
    const s = sc.steps[st.step];
    const body = (st.step === 0 ? '<div class="scenario">' + sc.intro + '</div>' : '')
      + '<div class="sim-step">' + (st.step+1) + ' / ' + sc.steps.length + '</div>'
      + '<div class="qtext">' + s.text(st) + '</div>'
      + '<div class="opts">' + s.ch.map(function(c,i){ return '<button class="opt" data-i="' + i + '">' + c.t + '</button>'; }).join("") + '</div>';
    toolShell(sc.cat + "　" + sc.title, body, "", "re:play");
    Array.prototype.forEach.call(el.tool.querySelectorAll(".opt"), function(b){
      b.onclick = function(){
        const c = s.ch[parseInt(b.dataset.i,10)];
        st.log.push({step:st.step+1, t:c.t, mark:c.mark, sev:c.sev, pivot:c.pivot});
        st.sev += c.sev; st.step++;
        drawReflect(c);
      };
    });
  }
  function drawReflect(c){
    const m = MARK_VIEW[c.mark] || MARK_VIEW.truth;
    const body = '<div class="opt sel" style="margin-bottom:18px">' + c.t + '</div>'
      + '<div class="two-side">'
        + '<div class="s-l">この選択が守ろうとしているもの</div><div class="s-b">' + m.keep + '</div>'
        + '<div class="s-l">相手からは</div><div class="s-b">' + m.seen + '</div>'
        + '<div class="s-l">そのあと</div><div class="s-b">' + m.then + '</div>'
      + '</div>'
      + '<button class="btn" id="simGo" style="margin-top:20px">' + (st.step >= sc.steps.length ? '結果を見る' : '続ける') + '</button>';
    toolShell("いま選んだこと", body, "", "re:play");
    bind("simGo", drawStep);
  }
  drawStep();
}

/* ---------------- re:play のふりかえり ---------------- */
function finishSim(sc, st){
  const marks = {truth:0, repair:0, defense:0, justify:0, avoid:0};
  st.log.forEach(function(l){ marks[l.mark]++; });
  const worst = st.log.slice().sort(function(a,b){ return b.sev - a.sev; })[0];
  const defensive = st.log.filter(function(l){ return l.mark === "defense" || l.mark === "justify"; });
  const avoided = st.log.filter(function(l){ return l.mark === "avoid"; });
  const repaired = st.log.filter(function(l){ return l.mark === "repair" || l.mark === "truth"; });

  let matchTxt = "";
  if(haveResult()){
    if(!RESULT) computeAll();
    const n = RESULT.r.norm, total = st.log.length;
    const rows = [
      {label:"守る言葉", rate:marks.defense/total, axis:n.G, name:"防衛的反発"},
      {label:"理由づけ", rate:marks.justify/total, axis:n.F, name:"自己正当化"},
      {label:"先送り",   rate:marks.avoid/total,   axis:n.H, name:"回避・隠蔽"}
    ];
    const same = [], diff = [];
    rows.forEach(function(r){
      const high = r.rate >= 0.3;
      if(high && r.axis >= 52) same.push(r.label + "は診断（" + r.name + " " + r.axis + "）と同じ方向に出ました");
      else if(high && r.axis < 45) diff.push(r.label + "は診断（" + r.name + " " + r.axis + "）より強く出ました");
      else if(!high && r.axis >= 58) diff.push(r.label + "は診断（" + r.name + " " + r.axis + "）ほどは出ませんでした");
    });
    matchTxt = '<div class="det"><span class="det-l">診断と同じだった部分</span>' + (same.length ? same.join("。") + "。" : "はっきり一致した項目はありませんでした。") + '</div>'
      + '<div class="det"><span class="det-l">意外に違った部分</span>' + (diff.length ? diff.join("。") + "。" : "大きく外れた項目はありませんでした。") + '</div>';
  }

  const endState = st.sev <= -3 ? "問題は起きたままですが、これ以上は広がっていません。相手の側に、対応された記録が残りました。"
    : (st.sev <= 1 ? "問題は残っています。大きくはなっていませんが、相手の中では終わっていません。"
    : "元の失敗そのものより、そのあとの対応で状況が大きくなりました。");

  const body = '<div class="sim-end">' + endState + '</div>'
    + '<div class="det"><span class="det-l">今回の分かれ目</span>'
      + (worst && worst.sev > 0
          ? (worst.pivot || (worst.step + "つ目の「" + worst.t + "」を選んだところから、話の性質が変わりました。"))
          : "大きく悪化させる選択はありませんでした。最初の判断で流れが決まっています。")
    + '</div>'
    + '<div class="det"><span class="det-l">守る言葉が出たところ</span>' + (defensive.length ? defensive.map(function(l){ return l.step + "つ目"; }).join("、") : "ありませんでした。") + '</div>'
    + '<div class="det"><span class="det-l">先送りしたところ</span>' + (avoided.length ? avoided.map(function(l){ return l.step + "つ目"; }).join("、") : "ありませんでした。") + '</div>'
    + '<div class="det"><span class="det-l">向き合えたところ</span>' + (repaired.length ? repaired.map(function(l){ return l.step + "つ目"; }).join("、") : "ありませんでした。") + '</div>'
    + matchTxt
    + '<div class="note">正解を測るものではありません。ただ、最初の失敗より「そのあとの2回目の選択」で状況が変わることは、実際によくあります。</div>'
    + '<button class="btn" id="simAgain">別の場面をやってみる</button>';
  toolShell("この場面で出たあなた", body, "", "re:play");
  bind("simAgain", renderPlayMenu);
}

function docHTML(doc){
  const ver = DOC_VERSIONS[doc.key];
  function block(sec, lv){
    let out = '<div class="doc-sec">'
      + '<div class="doc-h' + (lv ? " sub" : "") + '">' + sec.h + '</div>';
    (sec.p || []).forEach(function(t){ out += '<p class="doc-p">' + t + '</p>'; });
    if(sec.list && sec.list.length){
      out += '<ul class="doc-l">' + sec.list.map(function(t){ return '<li>' + t + '</li>'; }).join("") + '</ul>';
    }
    (sec.after || []).forEach(function(t){ out += '<p class="doc-p">' + t + '</p>'; });
    (sec.sub || []).forEach(function(sb){ out += block(sb, true); });
    return out + '</div>';
  }
  return (doc.lead ? '<p class="doc-lead">' + doc.lead + '</p>' : '')
    + doc.sections.map(function(s){ return block(s, false); }).join("")
    + (ver ? '<div class="doc-meta">制定日：' + ver.made + '<br>最終改定日：' + ver.rev + '<br>バージョン：' + ver.v + '</div>' : '');

/* SVGを画像として書き出すために、CSS変数ではなく実際の色を埋め込む */
function svgForExport(svg){
  const css = '<style>'
    + '.ch-bg{fill:#F0E8DC}.ch-body{fill:#C6B7A0}.ch-body2{fill:#DED2BE}'
    + '.ch-ink{fill:#4E453D}.ch-accent{fill:#CE9E99}'
    + '.ch-line{fill:none;stroke:#4E453D;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}'
    + '.ch-s2{fill:none;stroke:#DED2BE;stroke-linecap:round;stroke-linejoin:round}'
    + '.ch-s3{fill:none;stroke:#C6B7A0;stroke-linecap:round;stroke-linejoin:round}'
    + '</style>';
  let out = svg.replace(/var\(--ch-body\)/g, "#C6B7A0").replace(/var\(--ch-body2\)/g, "#DED2BE");
  out = out.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" ');
  return out.replace(/(<svg[^>]*>)/, "$1" + css);
}
function loadSvgImage(svg){
  return new Promise(function(res, rej){
    const img = new Image();
    img.onload = function(){ res(img); };
    img.onerror = rej;
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgForExport(svg));
  });
}
/* 日本語の折り返し（文字単位） */
function wrapLines(ctx, text, maxW){
  const out = [];
  let line = "";
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(ch === "\n"){ out.push(line); line = ""; continue; }
    if(ctx.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; }
    else line += ch;
  }
  if(line) out.push(line);
  return out;
}

async function buildShareCanvas(opts, design){
  if(!RESULT) computeAll();
  const R = RESULT, ch = R.ch, cN = CHARS[ch.initial], cR = CHARS[ch.recovery];
  const W = 1080, H = 1920;                     /* 縦長SNS向け 9:16 */
  const F = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif';
  const d = design || "simple";

  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  const grad = g.createLinearGradient(0, 0, W*0.5, H);
  grad.addColorStop(0, SHARE_PALETTE.bg1);
  grad.addColorStop(0.5, SHARE_PALETTE.bg2);
  grad.addColorStop(1, SHARE_PALETTE.bg3);
  g.fillStyle = grad; g.fillRect(0,0,W,H);
  g.textAlign = "center";

  /* ロゴ */
  function logo(y, size){
    g.font = "700 " + size + "px " + F;
    const w = g.measureText("re:act note").width;
    let x = W/2 - w/2;
    g.textAlign = "left";
    g.fillStyle = SHARE_PALETTE.text; g.fillText("re", x, y); x += g.measureText("re").width;
    g.fillStyle = SHARE_PALETTE.rose; g.fillText(":", x, y); x += g.measureText(":").width;
    g.fillStyle = SHARE_PALETTE.text; g.fillText("act note", x, y);
    g.textAlign = "center";
  }
  function line(y){
    g.strokeStyle = SHARE_PALETTE.line; g.lineWidth = 2;
    g.beginPath(); g.moveTo(220, y); g.lineTo(W-220, y); g.stroke();
  }
  function extras(y){
    if(opts.contra && R.a2.contradictions[0]){
      y += 40;
      g.font = "700 34px " + F; g.fillStyle = SHARE_PALETTE.text;
      wrapLines(g, R.a2.contradictions[0].title, W - 220).forEach(function(l){ g.fillText(l, W/2, y); y += 52; });
    }
    if(opts.gap){
      y += 36;
      g.font = "400 26px " + F; g.fillStyle = SHARE_PALETTE.sub;
      g.fillText("わかっていることと、やりそうなことの差", W/2, y); y += 50;
      g.font = "700 48px " + F; g.fillStyle = SHARE_PALETTE.text;
      g.fillText(String(R.r.gap.value), W/2, y); y += 24;
    }
    if(opts.axes){
      y += 46;
      const bw = 620, bx = W/2 - bw/2;
      ["A","B","C","D","E"].forEach(function(k){
        g.textAlign = "left";
        g.font = "400 24px " + F; g.fillStyle = SHARE_PALETTE.sub;
        g.fillText(SOFT[k], bx, y);
        g.fillStyle = "#EFE8DE"; g.fillRect(bx + 340, y - 16, 280, 12);
        g.fillStyle = SHARE_PALETTE.sage; g.fillRect(bx + 340, y - 16, 280 * (R.r.norm[k]/100), 12);
        g.textAlign = "center";
        y += 44;
      });
    }
    return y;
  }

  logo(180, 60);
  g.font = "400 28px " + F; g.fillStyle = SHARE_PALETTE.sub;
  g.fillText("そのときの自分を知る。", W/2, 236);

  if(d === "character"){
    const imgN = await loadSvgImage(cN.svg);
    g.drawImage(imgN, W/2 - 210, 330, 420, 420);
    g.font = "400 28px " + F; g.fillStyle = SHARE_PALETTE.sub;
    g.fillText("問題が起きた直後", W/2, 812);
    g.font = "700 74px " + F; g.fillStyle = SHARE_PALETTE.text;
    g.fillText(cN.name, W/2, 892);
    g.font = "400 32px " + F; g.fillStyle = SHARE_PALETTE.sub;
    let y = 950;
    wrapLines(g, "「" + cN.copy + "」", W - 220).forEach(function(l){ g.fillText(l, W/2, y); y += 46; });
    y += 20; line(y); y += 70;
    if(!ch.same){
      const imgR = await loadSvgImage(cR.svg);
      g.drawImage(imgR, W/2 - 140, y - 40, 280, 280);
      y += 280;
      g.font = "400 28px " + F; g.fillStyle = SHARE_PALETTE.sub;
      g.fillText("落ち着いたあと", W/2, y); y += 62;
      g.font = "700 56px " + F; g.fillStyle = SHARE_PALETTE.text;
      g.fillText(cR.name, W/2, y); y += 56;
      g.font = "400 28px " + F; g.fillStyle = SHARE_PALETTE.sub;
      wrapLines(g, "「" + cR.copy + "」", W - 260).forEach(function(l){ g.fillText(l, W/2, y); y += 44; });
    }else{
      g.font = "400 30px " + F; g.fillStyle = SHARE_PALETTE.sub;
      wrapLines(g, "落ち着いたあとも、同じ反応が続きやすい", W - 240).forEach(function(l){ g.fillText(l, W/2, y); y += 48; });
    }
    extras(y);
  }else if(d === "words"){
    const c0 = R.a2.contradictions[0];
    let y = 430;
    g.font = "400 28px " + F; g.fillStyle = SHARE_PALETTE.sub;
    g.fillText("あなたの中にある矛盾", W/2, y); y += 90;
    g.font = "700 56px " + F; g.fillStyle = SHARE_PALETTE.text;
    wrapLines(g, c0 ? c0.title : cN.copy, W - 200).forEach(function(l){ g.fillText(l, W/2, y); y += 84; });
    y += 40; line(y); y += 80;
    const imgN = await loadSvgImage(cN.svg);
    g.drawImage(imgN, W/2 - 130, y, 260, 260); y += 300;
    g.font = "400 30px " + F; g.fillStyle = SHARE_PALETTE.sub;
    g.fillText(ch.same ? "初動も、そのあとも" : "初動は " + cN.name + " ／ 落ち着いたあとは " + cR.name, W/2, y); y += 56;
    if(ch.same){ g.font = "700 48px " + F; g.fillStyle = SHARE_PALETTE.text; g.fillText(cN.name, W/2, y); y += 40; }
    g.font = "400 30px " + F; g.fillStyle = SHARE_PALETTE.sub;
    y += 30;
    wrapLines(g, "「" + cN.copy + "」", W - 240).forEach(function(l){ g.fillText(l, W/2, y); y += 46; });
    extras(y);
  }else{
    const imgN = await loadSvgImage(cN.svg);
    g.drawImage(imgN, W/2 - 200, 470, 400, 400);
    g.font = "400 30px " + F; g.fillStyle = SHARE_PALETTE.sub;
    g.fillText("あなたの中に出やすいのは", W/2, 420);
    g.font = "700 86px " + F; g.fillStyle = SHARE_PALETTE.text;
    g.fillText(cN.name, W/2, 990);
    g.font = "700 38px " + F; g.fillStyle = SHARE_PALETTE.text;
    let y = 1074;
    wrapLines(g, "「" + cN.copy + "」", W - 220).forEach(function(l){ g.fillText(l, W/2, y); y += 58; });
    y += 24; line(y); y += 66;
    g.font = "400 30px " + F; g.fillStyle = SHARE_PALETTE.sub;
    g.fillText(ch.same ? "落ち着いたあとも、同じ反応" : "落ち着いたあとは " + cR.name, W/2, y); y += 50;
    extras(y);
  }

  g.font = "400 24px " + F; g.fillStyle = "#948A80";
  g.fillText("性格の良し悪しを判定するものではありません", W/2, H - 84);
  return cv;
}

function renderShare(){
  if(!RESULT) computeAll();
  const opts = {contra:false, gap:false, axes:false};
  let design = "simple";
  let busy = false;

  function draw(){
    const inc = ["初動キャラクターとイラスト", "一言コピー", "立て直しキャラクター"];
    if(opts.contra) inc.push("あなたの中にある矛盾");
    if(opts.gap) inc.push("わかっていることとの差");
    if(opts.axes) inc.push("向き合う力の5つ");
    const body =
      '<div class="sec-k">カードのデザイン</div>'
      + '<div class="design-row">' + SHARE_DESIGNS.map(function(dd){
          return '<button class="design-b' + (design === dd.k ? " on" : "") + '" data-d="' + dd.k + '">'
            + '<span class="design-n">' + dd.name + '</span><span class="design-s">' + dd.note + '</span></button>';
        }).join("") + '</div>'
      + '<div class="sec-k" style="margin-top:26px">入れるもの</div>'
      + '<div class="share-opts">'
      + '<button class="share-opt on" disabled><span class="box">✓</span>キャラクターと一言（標準）</button>'
      + '<button class="share-opt' + (opts.contra?" on":"") + '" data-o="contra"><span class="box">' + (opts.contra?"✓":"") + '</span>あなたの中にある矛盾</button>'
      + '<button class="share-opt' + (opts.gap?" on":"") + '" data-o="gap"><span class="box">' + (opts.gap?"✓":"") + '</span>わかっていることとの差</button>'
      + '<button class="share-opt' + (opts.axes?" on":"") + '" data-o="axes"><span class="box">' + (opts.axes?"✓":"") + '</span>向き合う力の5つ</button>'
      + '</div>'
      + '<div class="priv-check">'
        + '<div class="priv-col"><div class="priv-h">このカードに含まれます</div>'
          + inc.map(function(t){ return '<div class="priv-i yes">' + t + '</div>'; }).join("") + '</div>'
        + '<div class="priv-col"><div class="priv-h">含まれません</div>'
          + ['あなたが書いたメモ', '診断の回答内容', '保存している記録', 're:pairなどの自由記述',
             '守りに入るときの反応の数値'].map(function(t){ return '<div class="priv-i no">' + t + '</div>'; }).join("")
        + '</div></div>'
      + '<div class="share-preview" id="sharePrev"></div>'
      + '<button class="btn" id="shBuild" style="margin-top:18px">カードを作る</button>'
      + '<div id="shActions"></div>'
      + '<hr class="sep">'
      + '<div class="det"><span class="det-l">友達にもやってもらう</span>結果ではなく、re:act note そのものを渡せます。</div>'
      + '<button class="btn-sub" id="shApp">re:act note のリンクを送る</button>'
      + '<div class="disclaimer" id="shAppNote" style="margin-top:8px"></div>'
      + '<button class="btn-sub" id="shPrint">結果を印刷・PDFで保存する</button>';
    toolShell("結果をシェアする", body,
      "デザインと、入れるものを選べます。初期状態では、キャラクターと一言だけです。", "re:share");

    Array.prototype.forEach.call(el.tool.querySelectorAll("[data-o]"), function(b){
      b.onclick = function(){ opts[b.dataset.o] = !opts[b.dataset.o]; draw(); };
    });
    Array.prototype.forEach.call(el.tool.querySelectorAll("[data-d]"), function(b){
      b.onclick = function(){ design = b.dataset.d; draw(); };
    });
    bind("shBuild", function(){ makeCard(); });
    bind("shApp", shareApp);
    bind("shPrint", function(){ window.print(); });
  }

  async function makeCard(){
    if(busy) return; busy = true;
    const btn = document.getElementById("shBuild");
    btn.textContent = "作成中…";
    try{
      const cv = await buildShareCanvas(opts, design);
      const url = cv.toDataURL("image/png");
      document.getElementById("sharePrev").innerHTML = '<img src="' + url + '" alt="共有カード">';
      document.getElementById("shActions").innerHTML =
        '<button class="btn-sub" id="shSave">画像として保存する</button>'
        + '<button class="btn-sub" id="shShare">シェアする</button>'
        + '<div class="disclaimer" id="shNote" style="margin-top:10px">保存できないときは、上の画像を長押し（パソコンでは右クリック）すると保存できます。</div>';
      btn.textContent = "作り直す";
      bind("shSave", function(){ saveImage(cv); });
      bind("shShare", function(){ shareImage(cv); });
      document.getElementById("sharePrev").scrollIntoView({behavior:"smooth", block:"center"});
    }catch(e){
      document.getElementById("shActions").innerHTML = '<div class="flag">この環境ではカードを作れませんでした。結果画面をスクリーンショットしてお使いください。</div>';
      btn.textContent = "カードを作る";
    }
    busy = false;
  }

  const LONGPRESS = "この画面からは直接保存できません。上の画像を長押し（パソコンでは右クリック）して保存してください。";
  function saveImage(cv){
    cv.toBlob(async function(blob){
      if(!blob) return;
      const note = document.getElementById("shNote");
      if(isHosted()){
        /* 公開ページではページ側からのダウンロードが止められる。
           用意されている保存の仕組みを使い、それが無ければ長押し保存に案内する */
        try{
          const dl = await window.claude.use("downloads");
          if(dl){
            if(note) note.textContent = "保存の確認を待っています…";
            await dl.save({filename:"react-note.png", data:blob});
            if(note) note.textContent = "画像を保存しました。";
            toast("画像を保存しました");
            return;
          }
        }catch(e){
          if(e && e.code === "declined"){
            if(note) note.textContent = "保存をやめました。もう一度押すと、やり直せます。";
            return;
          }
        }
        if(note) note.textContent = LONGPRESS;
        return;
      }
      try{
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "react-note.png";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        toast("画像を保存しました");
      }catch(e){
        if(note) note.textContent = LONGPRESS;
      }
    }, "image/png");
  }

  function shareImage(cv){
    cv.toBlob(async function(blob){
      if(!blob) return;
      const file = new File([blob], "react-note.png", {type:"image/png"});
      try{
        if(navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({files:[file], text:"re:act note ／ そのときの自分を知る"});
          return;
        }
      }catch(e){ return; }
      saveImage(cv);
    }, "image/png");
  }

  async function shareApp(){
    const url = location.href.split("#")[0];
    const text = "re:act note ／ そのときの自分を知る";
    try{
      if(navigator.share && /^https?:/.test(url)){
        await navigator.share({title:"re:act note", text:text, url:url});
        return;
      }
    }catch(e){ return; }
    try{
      if(navigator.clipboard && /^https?:/.test(url)){
        await navigator.clipboard.writeText(url);
        toast("リンクをコピーしました");
        return;
      }
    }catch(e){}
    const n = document.getElementById("shAppNote");
    const msg = /^https?:/.test(url)
      ? "このページのURLを共有してください：" + url
      : "このファイルを直接開いているため、リンクは作れません。ファイルそのものを送るか、公開したURLからお使いください。";
    if(n) n.textContent = msg; else toast(msg);
  }

  draw();
}

      + '<p class="muted" style="font-size:.92rem">もう一度試してみてください。保存されている回答や記録は、そのまま残っています。</p>'

window.addEventListener("error", function(ev){

});

/* ---- アプリとして使えるようにする（PWA） ---- */
function showUpdateBar(reg){
  if(document.getElementById("updBar")) return;
  const bar = document.createElement("div");
  bar.id = "updBar"; bar.className = "upd-bar";
  const txt = document.createElement("span");
  txt.textContent = "新しいバージョンがあります";
  const btn = document.createElement("button");
  btn.textContent = "更新する";
  btn.onclick = function(){
    if(reg.waiting) reg.waiting.postMessage({type:"SKIP_WAITING"});
    else location.reload();
  };
  const close = document.createElement("button");
  close.className = "upd-x"; close.textContent = "あとで";
  close.onclick = function(){ bar.remove(); };
  bar.appendChild(txt); bar.appendChild(btn); bar.appendChild(close);
  document.body.appendChild(bar);
  requestAnimationFrame(function(){ bar.classList.add("on"); });
}
if("serviceWorker" in navigator && /^https?:/.test(location.protocol)){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").then(function(reg){
      if(reg.waiting && navigator.serviceWorker.controller) showUpdateBar(reg);
      reg.addEventListener("updatefound", function(){
        const w = reg.installing;
        if(!w) return;
        w.addEventListener("statechange", function(){
          if(w.state === "installed" && navigator.serviceWorker.controller) showUpdateBar(reg);
        });
      });
    }).catch(function(){ /* 使えない環境でも通常どおり動く */ });
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(reloading) return; reloading = true; location.reload();
    });
  });
}
