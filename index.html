   + '<div class="card"><p class="disclaimer">本診断は心理学研究の知見を参考にした自己理解ツールであり、臨床心理検査・医学的診断・科学的に妥当性が検証済みの心理尺度ではありません。将来の不倫・犯罪・裏切り等を予測するものではありません。</p>'
   + '<button class="btn-sub" id="btnWipe">保存されたデータを全部削除する</button></div>';

  bind("btnStart", function(){ startQuiz("btnStart"); });
  bind("btnResult", function(){ computeAll(); renderResult(); show("result"); });
  bind("btnGallery", function(){ renderGallery(haveResult()); });
  bind("btnEmergency", function(){ renderEmergency(); });
  bind("btnWipe", function(){
    if(!confirmTwice("wipe1", "btnWipe", "もう一度押すと、保存データを全部削除します")) return;
    wipeAll(); save(); renderIntro(); show("intro");
  });
}

function startQuiz(btnId){
  if(state.finished){ if(!confirmTwice("restart", btnId || "btnStart", "もう一度押すと、最初からやり直します（前回の回答は上書き）")) return;
    state.answers = {}; state.idx = 0; state.finished = false; state.perm = {}; save(); }
  let i = 0;
  while(i < ITEMS.length && isAnswered(ITEMS[i])) i++;
  state.idx = Math.min(i, ITEMS.length - 1);
  renderQuestion(); show("quiz");
}

/* ================= 設問 ================= */
function updateProgress(){
  const c = chapterOf(state.idx);
  el.pSection.textContent = "CHAPTER " + c.n + "　" + c.title;
  el.pCount.textContent = (state.idx + 1) + " / " + ITEMS.length;
  el.pFill.style.width = (state.idx / ITEMS.length * 100) + "%";
}

/* 選択肢の並び順は設問ごとにランダム化して保存する。
   「いつも上が模範解答」という位置の手がかりを消すため。回答は元のindexで保持する */
function optOrder(id, len){
  if(!state.perm[id] || state.perm[id].length !== len){
    const a = [];
    for(let i=0;i<len;i++) a.push(i);
    for(let i=len-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
    state.perm[id] = a; save();
  }
  return state.perm[id];
}

function renderQuestion(){
  const entry = ITEMS[state.idx];
  const it = entry.item;
  let h = '<div class="card" style="margin-top:18px">';

  if(entry.type === "s1"){
    h += '<span class="section-tag">もし実際に起きたら</span>';
    h += '<div class="scenario">' + it.sc + '</div>';
    h += '<div class="qtext">この場面で、たぶん本当にその場にいた自分がやりそうなのはどれですか。</div>';
    h += '<div class="qhint">正しい方ではなく、実際にやりそうな方を。迷ったら、少し嫌な自分も含めて考えてみてください。</div>';
    h += '<div class="opts">' + optOrder(it.id, it.a.length).map(function(i){
      return '<button class="opt' + (state.answers[it.id]===i?" sel":"") + '" data-i="'+i+'">' + it.a[i].t + '</button>';
    }).join("") + '</div>';
  }
  if(entry.type === "s2"){
    h += '<span class="section-tag">普段の自分</span>';
    h += '<div class="qtext">' + it.t + '</div>';
    h += '<div class="qhint">深く考えすぎず、近いほうを選んでください。</div>';
    h += '<div class="scale">' + SCALE_LABELS.map(function(lab,i){
      const v = i+1;
      return '<button class="opt' + (state.answers[it.id]===v?" sel":"") + '" data-v="'+v+'"><span class="scale-num">'+v+'</span><span>'+lab+'</span></button>';
    }).join("") + '</div>';
  }
  if(entry.type === "s3"){
    const cur = state.answers[it.id] || {};
    h += '<span class="section-tag">わかっていること／やりそうなこと</span>';
    h += '<div class="scenario">' + it.sc + '</div>';
    h += '<div class="subq">① この中で、最も適切だと思う対応はどれですか。</div>';
    const ord = optOrder(it.id, it.o.length);
    h += '<div class="opts">' + ord.map(function(i){
      return '<button class="opt' + (cur.ideal===i?" sel":"") + '" data-role="ideal" data-i="'+i+'">' + it.o[i].t + '</button>';
    }).join("") + '</div>';
    h += '<div class="subq second">② 実際の自分が、いちばん取りそうな対応はどれですか。</div>';
    h += '<div class="opts">' + ord.map(function(i){
      return '<button class="opt' + (cur.actual===i?" sel-2":"") + '" data-role="actual" data-i="'+i+'">' + it.o[i].t + '</button>';
    }).join("") + '</div>';
  }

  h += '<div class="nav"><button id="navPrev"' + (state.idx===0?' disabled':'') + '>戻る</button>'
     + '<button id="navNext" class="next"' + (isAnswered(entry)?'':' disabled') + '>'
     + (state.idx === ITEMS.length-1 ? '結果を見る' : '次へ') + '</button></div></div>';

  el.quiz.innerHTML = h;
  updateProgress();

  Array.prototype.forEach.call(el.quiz.querySelectorAll(".opt"), function(btn){
    btn.onclick = function(){
      if(entry.type === "s1"){
        state.answers[it.id] = parseInt(btn.dataset.i,10); markOne(btn,"sel"); advanceSoon();
      }else if(entry.type === "s2"){
        state.answers[it.id] = parseInt(btn.dataset.v,10); markOne(btn,"sel"); advanceSoon();
      }else{
        const role = btn.dataset.role;
        const cur = state.answers[it.id] || {};
        cur[role] = parseInt(btn.dataset.i,10);
        state.answers[it.id] = cur;
        Array.prototype.forEach.call(btn.parentNode.querySelectorAll(".opt"), function(b){ b.classList.remove("sel","sel-2"); });
        btn.classList.add(role === "ideal" ? "sel" : "sel-2");
        if(typeof cur.ideal === "number" && typeof cur.actual === "number"){
          document.getElementById("navNext").disabled = false;
          advanceSoon(380);
        }
      }
      save();
    };
  });
  bind("navPrev", function(){ if(state.idx>0){ state.idx--; save(); renderQuestion(); } });
  bind("navNext", goNext);
}

function markOne(btn, cls){
  Array.prototype.forEach.call(btn.parentNode.querySelectorAll(".opt"), function(b){ b.classList.remove("sel","sel-2"); });
  btn.classList.add(cls);
  const nx = document.getElementById("navNext"); if(nx) nx.disabled = false;
}
let advTimer = null;
function advanceSoon(ms){ clearTimeout(advTimer); advTimer = setTimeout(goNext, ms || 260); }

function goNext(){
  if(!isAnswered(ITEMS[state.idx])) return;
  const c = chapterOf(state.idx);
  const nextIdx = state.idx + 1;
  if(nextIdx >= ITEMS.length){ finish(); return; }
  state.idx = nextIdx; save();
  if(nextIdx === c.end){ renderCheckpoint(c); return; }  // チャプター終了
  renderQuestion();
}

/* チャプターの区切り（スコアやタイプのヒントは出さない） */
function renderCheckpoint(done){
  const next = chapterOf(state.idx);
  el.quiz.innerHTML = '<div class="card checkpoint" style="margin-top:40px">'
    + '<div class="cp-n">CHAPTER ' + done.n + " 終了</div>"
    + '<div class="cp-t">' + done.title + '</div>'
    + '<div class="cp-c">' + done.end + ' / ' + ITEMS.length + ' 問が終わりました。</div>'
    + '<hr class="sep">'
    + '<div class="cp-next">次は CHAPTER ' + next.n + '　' + next.title + '</div>'
    + '<p class="muted" style="font-size:.9rem">' + next.note + '</p>'
    + '<button class="btn" id="cpNext">続ける</button>'
    + '<button class="btn-sub" id="cpStop">ここでいったんやめる（続きは保存されます）</button></div>';
  updateProgress();
  bind("cpNext", renderQuestion);
  bind("cpStop", function(){ renderIntro(); show("intro"); });
}

function finish(){
  state.finished = true;
  const res = computeAll();
  // 履歴（端末内のみ）
  state.history = state.history || [];
  state.history.push({
    t: new Date().toISOString(),
    norm: res.r.norm, gap: res.r.gap.value,
    initial: res.ch.initial, recovery: res.ch.recovery
  });
  if(state.history.length > 12) state.history = state.history.slice(-12);
  if(!state.memo) state.memo = TEXT2.futureMemo(res.r, res.a2, res.ch, res.a2.contradictions[0] && res.a2.contradictions[0].title);
  state.level = 1;
  save();
  renderResult(); show("result");
}

/* ================= キャラクター表示の部品 ================= */
function charBlock(id, role, line){
  const c = CHARS[id];
  return '<div class="ch-block"><div class="ch-art">' + c.svg + '</div>'
    + '<div class="ch-meta"><div class="ch-role">' + role + '</div>'
    + '<div class="ch-name">' + c.name + '<span class="ch-tag">' + c.tag + '</span></div>'
    + '<div class="ch-line">' + line + '</div></div></div>';
}
function charDetail(id, heading){
  const c = CHARS[id];
  return '<div class="card"><h3>' + heading + '　' + c.name + '（' + c.tag + '）</h3>'
    + '<div class="det"><span class="det-l">このキャラクターが表すもの</span>' + c.meaning + '</div>'
    + '<div class="det"><span class="det-l">この反応の強み</span>' + c.strength + '</div>'
    + '<div class="det"><span class="det-l">注意ポイント</span>' + c.caution + '</div>'
    + '<div class="motto">「' + c.motto + '」</div></div>';
}
function barHTML(k, v, risk){
  const a = AXES[k];
  return '<div class="bar-item"><div class="bar-top"><span>' + a.name + '</span><span class="bar-val">' + v + '</span></div>'
    + '<div class="bar-track"><div class="bar-fill' + (risk?" risk":"") + '" data-w="' + v + '" style="width:0"></div></div>'
    + '<div class="bar-desc">' + a.desc + '</div></div>';
}
function miniBar(label, v, risk){
  return '<div class="mini"><span class="mini-l">' + label + '</span>'
    + '<span class="mini-t"><span class="mini-f' + (risk?" risk":"") + '" style="width:' + v + '%"></span></span>'
    + '<span class="mini-v">' + v + '</span></div>';
}

/* ================= 結果画面 ================= */
function renderResult(){
  if(!RESULT) computeAll();
  const R = RESULT, r = R.r, a2 = R.a2, ch = R.ch, n = r.norm;
  const cN = CHARS[ch.initial], cR = CHARS[ch.recovery];
  let h = "";

  /* ---------- LEVEL 1 : 30秒で分かる結果 ---------- */
  h += '<div class="card hero">'
     + '<div class="hero-t">問題が起きた時のあなた</div>'
     + charBlock(ch.initial, "問題が起きた直後", "あなたの中の" + cN.name + "が出やすいようです。" + cN.initialLine)
     + '<div class="hero-arrow">時間が経つと</div>'
     + charBlock(ch.recovery, "落ち着いた後", (ch.same ? "落ち着いた後も、同じ" + cR.name + "の反応が続きやすいようです。" : "ここでは" + cR.name + "が前に出てきます。") + cR.recoveryLine)
     + '<div class="hero-copy">「' + cN.copy + '」<br>' + (ch.same ? '' : '「' + cR.copy + '」') + '</div>'
     + (ch.sub ? '<div class="hero-sub">' + CHARS[ch.sub].svg + '<div><span class="ch-role">サブ傾向</span><strong>' + CHARS[ch.sub].name + '</strong>（' + CHARS[ch.sub].tag + '）の面も混じっています。</div></div>' : '')
     + '<div class="hero-gap"><span>理解―実行ギャップ</span><strong>' + r.gap.value + '</strong><span class="faint">/ 100</span></div>'
     + '<p class="disclaimer" style="margin:10px 0 0">キャラクターは人格ではなく、その場面で出やすい反応を表しています。人には状況によって複数の反応があります。</p>'
     + '</div>';

  // 最大の矛盾
  const c0 = a2.contradictions[0];
  h += '<div class="card contra"><div class="sec-k">あなたの中にある矛盾</div>'
     + '<div class="contra-t">' + c0.title + '</div>'
     + '<p class="prose">' + c0.body + '</p>'
     + (ANALYSIS2.NEED[c0.id] ? '<div class="need">' + ANALYSIS2.NEED[c0.id] + '</div>' : '')
     + '<div class="basis">根拠：' + c0.basis.join("／") + '</div></div>';

  // 危険トリガー（ベースラインとの差で判定。条件を満たすものがなければ順位を出さない）
  const ti = a2.triggerInfo;
  h += '<div class="card"><div class="sec-k">あなたの防衛反応が出やすい瞬間</div>';
  if(ti.found){
    h += '<p class="muted" style="font-size:.88rem">あなたの普段の傾向（' + ti.baseline + '）と比べて、その条件を含む場面だけ悪化させやすい選択に寄っていたものです。順位は差の大きさ順です。</p>';
    ti.list.forEach(function(t,i){
      h += '<div class="trg"><div class="trg-h"><span class="trg-n">' + (i+1) + '位</span><span class="trg-t">' + t.name + '</span>'
         + '<span class="trg-v">' + t.score + '<span class="trg-d">（+' + t.delta + '）</span></span></div>'
         + '<div class="trg-b">' + t.line + '</div>'
         + '<div class="trg-m">参考度：' + t.conf + '（この判定に使った設問 ' + t.n + '問）</div></div>';
    });
  }else{
    h += '<div class="flag">' + (ti.baseline >= 60
      ? ('特定の条件に限らず、全体として問題を悪化させやすい側の選択が多く選ばれていました（全体 ' + ti.baseline + '）。この場合は「どの場面が危ないか」より、場面を選ばず出る反応のほうを見たほうが役に立ちます。')
      : '今回の回答では、特定の状況だけで防衛反応が大きく上昇する傾向は、はっきりとは見つかりませんでした。')
       + '<br><span class="faint">' + (ti.baseline >= 60 ? '' : '全体の悪化傾向は' + ti.baseline + 'です。') + '状況によって反応は変わるので、「引き金が存在しない」という意味ではありません。'
       + '参考として、相対的にわずかに高かったのは「' + (ti.all[0] ? ti.all[0].name + '」（' + ti.all[0].score + '、差 ' + (ti.all[0].delta>=0?"+":"") + ti.all[0].delta + '）' : '該当なし') + 'でした。</span></div>';
  }
  h += '<p class="disclaimer" style="margin-top:10px">数値は該当場面での選択傾向を0〜100に置き換えた推定値です。性格や将来の行動を判定するものではありません。</p></div>';

  // 使い方ボタン
  h += '<div class="card"><h2>結果をどう使う？</h2><div class="tool-grid">'
     + '<button class="tool-b" data-go="sim">やらかしシミュレーターをやる</button>'
     + '<button class="tool-b" data-go="rules">自分の5ルールを見る</button>'
     + '<button class="tool-b" data-go="memo">未来の自分へメモを書く</button>'
     + '<button class="tool-b" data-go="event">実際の出来事を整理する</button>'
     + '<button class="tool-b" data-go="excuse">言い訳翻訳機を試す</button>'
     + '<button class="tool-b" data-go="share">共有用カードを見る</button>'
     + '<button class="tool-b" data-go="gallery">キャラクター図鑑を見る</button>'
     + '<button class="tool-b alt" data-go="emergency">今まさにやらかした</button>'
     + '</div></div>';

  h += '<button class="btn-sub lv-btn' + (state.level >= 2 ? ' hidden' : '') + '" id="btnLv2">もう少し詳しく見る（8軸・プレッシャー比較・価値観）</button>';

  /* ---------- LEVEL 2 ---------- */
  h += '<div id="lv2" class="' + (state.level >= 2 ? '' : 'hidden') + '">';

  h += '<div class="card"><h2>8軸プロフィール</h2>'
     + '<p class="muted" style="font-size:.88rem">上の5つは高いほどその行動が出やすいこと、下の3つは良し悪しではなく「その反応の出やすさ」を表します。</p>'
     + '<div class="group-title">STRENGTH　向き合うための反応</div>';
  ["A","B","C","D","E"].forEach(function(k){ h += barHTML(k, n[k], false); });
  h += '<div class="group-title" style="margin-top:22px">RISK REACTION　問題を悪化させやすい反応</div>';
  ["F","G","H"].forEach(function(k){ h += barHTML(k, n[k], true); });
  h += '<div class="why" style="margin-top:18px"><div class="why-t">' + cN.name + '型（初動）に効いた項目</div>'
     + ch.initialReasons.map(function(x){ return '<div class="why-r"><span>' + x.name + '</span><span class="why-v">' + (x.value===undefined?"—":x.value) + '</span></div>'; }).join("")
     + '</div>'
     + (ch.same ? "" : '<div class="why"><div class="why-t">' + cR.name + '型（立て直し）に効いた項目</div>'
        + ch.recoveryReasons.map(function(x){ return '<div class="why-r"><span>' + x.name + '</span><span class="why-v">' + (x.value===undefined?"—":x.value) + '</span></div>'; }).join("") + '</div>')
     + '</div>';

  // 低プレッシャー / 高プレッシャー（同一テーマのペア設問で比較）
  const hc = a2.hotCold;
  const dOrder = AXIS_ORDER.slice().sort(function(a,b){ return Math.abs(hc.delta[b]) - Math.abs(hc.delta[a]); });
  const dTop = dOrder[0];
  const dAbs = Math.abs(hc.delta[dTop]);
  h += '<div class="card"><h2>失うものが小さい場面と、大きい場面</h2>'
     + '<p class="muted" style="font-size:.9rem">「約束を忘れた」「人を傷つけた」など<strong>同じ心理テーマで、失うものの大きさだけが違う' + hc.pairs + '組</strong>の設問を比べています（回答済み ' + hc.answeredPairs + '組）。便宜的にCOLD／HOTと呼びますが、実際の心理状態を測ったものではなく、回答の寄り方の違いです。</p>'
     + '<div class="hotcold"><div class="hc-col cold"><div class="hc-k">COLD　失うものが小さい場面</div>'
     + ["A","B","C","D"].map(function(k){ return miniBar(AXES[k].name, hc.cold[k], false); }).join("")
     + ["F","G","H"].map(function(k){ return miniBar(AXES[k].name, hc.cold[k], true); }).join("")
     + '</div><div class="hc-col hot"><div class="hc-k">HOT　失うものが大きい場面</div>'
     + ["A","B","C","D"].map(function(k){ return miniBar(AXES[k].name, hc.hot[k], false); }).join("")
     + ["F","G","H"].map(function(k){ return miniBar(AXES[k].name, hc.hot[k], true); }).join("")
     + '</div></div>';
  if(dAbs >= 8){
    h += '<p class="prose" style="margin-top:14px">最も差が出たのは<strong>' + AXES[dTop].name + '</strong>で、' + hc.cold[dTop] + ' から ' + hc.hot[dTop] + ' への変化でした。'
       + (["F","G","H"].indexOf(dTop) >= 0
          ? (hc.delta[dTop] > 0 ? "失うものが大きくなるほど、この反応が強まる可能性があります。" : "失うものが大きい場面のほうが、この反応は抑えられているようです。")
          : (hc.delta[dTop] > 0 ? "失うものが大きい場面のほうが、この力は出やすいようです。" : "失うものが大きくなるほど、この力が出にくくなる可能性があります。"))
       + '</p>';
  }else{
    h += '<p class="prose" style="margin-top:14px">どの軸も差は小さめでした（最大でも' + dAbs + '）。失うものの大きさによって選び方が大きく変わる、という傾向は今回の回答からは見えていません。</p>';
  }
  if(hc.themes.length){
    const t0 = hc.themes[0];
    h += '<div class="why"><div class="why-t">テーマ別の変化（大きい順に3つ）</div>'
       + hc.themes.slice(0,3).map(function(t){
           return '<div class="why-r"><span>' + t.theme + '</span><span class="why-v">' + t.low + ' → ' + t.high + '</span></div>';
         }).join("")
       + '<div class="why-r faint" style="margin-top:6px">数値が大きいほど、問題を悪化させやすい側の選択です。'
       + (t0.diff >= 25 ? ('「' + t0.theme + '」で最も動いています。') : '大きく動いたテーマはありません。') + '</div></div>';
  }
  h += '<div class="note" style="margin-top:12px">これは「理解―実行ギャップ」とは別の指標です。ギャップは<strong>わかっている行動と、やりそうな行動の差</strong>。こちらは<strong>失うものの大きさによる選び方の差</strong>です。</div></div>';

  // プレッシャー倍率
  h += '<div class="card"><h2>プレッシャーが強くなるとどう変わる？</h2>'
     + '<p class="muted" style="font-size:.88rem">推定傾向です。科学的な精度を示すものではありません。</p>';
  const pLabels = ["小さな失敗（失うものが少ない）","関係・評価に影響する失敗","人生への影響が大きい失敗"];
  a2.pressure.forEach(function(p,i){
    h += '<div class="plv"><div class="plv-h">LEVEL ' + p.level + '　' + pLabels[i] + '</div>'
       + miniBar("真実開示", p.prof.A, false)
       + miniBar("自己正当化", p.prof.F, true)
       + miniBar("防衛的反発", p.prof.G, true)
       + miniBar("回避・隠蔽", p.prof.H, true)
       + '</div>';
  });
  const dA = a2.pressure[2].prof.A - a2.pressure[0].prof.A;
  const dH = a2.pressure[2].prof.H - a2.pressure[0].prof.H;
  h += '<p class="prose" style="margin-top:12px">失うものが大きい場面では、真実開示が' + (dA<0?"下がり":"上がり") + '（' + a2.pressure[0].prof.A + '→' + a2.pressure[2].prof.A + '）、回避・隠蔽が' + (dH>0?"上がり":"下がり") + 'やすい（' + a2.pressure[0].prof.H + '→' + a2.pressure[2].prof.H + '）という結果でした。'
     + (Math.abs(dA) >= 12 || Math.abs(dH) >= 12 ? "差が比較的はっきりしているので、賭け金が上がる場面ほど事前のルールが効きます。" : "差は大きくありません。プレッシャーによる揺れは比較的小さいほうかもしれません。") + '</p></div>';

  // 理解―実行ギャップ（内訳も出す）
  h += '<div class="card"><h2>理解―実行ギャップ</h2><div class="gap-num">' + r.gap.value + '</div>'
     + '<div class="bar-track" style="margin-top:10px"><div class="bar-fill risk" data-w="' + r.gap.value + '" style="width:0"></div></div>'
     + '<div class="gap-scale"><span>0　理解と行動が近い</span><span>離れている　100</span></div>'
     + '<p class="prose" style="margin-top:14px">' + TEXT.gapText(r.gap.value) + '</p>'
     + '<div class="why"><div class="why-t">内訳（8問中 ' + r.gap.matched + '問は、適切だと思う案と実際に取りそうな案が一致）</div>'
     + '<div class="why-r"><span>適切さの差（どれだけ下の案に降りたか）</span><span class="why-v">' + r.gap.rankPart + '</span></div>'
     + '<div class="why-r"><span>心理的な向きの差（8軸上の距離）</span><span class="why-v">' + r.gap.distPart + '</span></div>'
     + '<div class="why-r faint" style="margin-top:6px">この2つを半々で合成しています。適切だと思う案の質そのものは ' + r.gap.understanding + ' でした。</div></div>'
     + '<div class="note" style="margin-top:12px">これは<strong>わかっている行動と、やりそうな行動の差</strong>です。上の「失うものが小さい場面と大きい場面」（プレッシャーによる差）とは別の指標として読んでください。</div></div>';

  // 価値観
  h += '<div class="card"><h2>あなたが大事にしたい自分</h2>';
  if(state.values && state.values.length){
    h += '<div class="vals">' + state.values.map(function(v){ return '<span class="val-chip">' + v + '</span>'; }).join("") + '</div>';
    TEXT2.valueGap(state.values, n).forEach(function(g){
      h += '<div class="vgap"><div class="vgap-h">' + g.v + '<span class="faint">　' + g.axis + ' ' + g.value + '</span></div><div class="vgap-b">' + g.line + '</div></div>';
    });
    h += '<button class="btn-sub" data-go="values">選び直す</button>';
  }else{
    h += '<p class="muted" style="font-size:.92rem">「自分は何を大事にして生きたいか」を3つ選ぶと、大事にしたい自分と実際の反応の距離を表示します。診断スコアには影響しません。</p>'
       + '<button class="btn-sub" data-go="values">価値観を選ぶ</button>';
  }
  h += '</div>';

  // 回答の読み方
  const flags = [];
  const cs = r.consistency;
  flags.push('回答の一貫性：' + cs.level + '<br><span class="faint">'
    + (cs.level === "やや揺れあり"
        ? '似た意味の設問や、「普段の自分」と「場面での選択」の間に幅がありました。場面によって反応が変わりやすい可能性があります。どちらかが誤りという意味ではありません。'
        : (cs.level === "高い"
            ? '形式の違う設問どうしでも、選び方の方向がおおむねそろっていました。'
            : '大きな食い違いは見られませんでした。'))
    + '（' + cs.checked + '組を照合／差が大きかったもの ' + cs.diverged + '組）</span>');
  const crossBig = cs.cross.slice().sort(function(a,b){ return Math.abs(b.diff)-Math.abs(a.diff); })[0];
  if(crossBig && Math.abs(crossBig.diff) > 28){
    flags.push(AXES[crossBig.axis].name + 'は、自己評価（' + crossBig.s2 + '）と場面での選択（' + crossBig.s1 + '）で差がありました。<br><span class="faint">自分でそう思っていることと、具体的な場面で選ぶことがずれやすい領域かもしれません。</span>');
  }
  if(r.idealization.high) flags.push('今回の回答では、問題を悪化させにくい選択が非常に多く選ばれています<br><span class="faint">実際の行動傾向というより、「こうありたい自分」が一部反映されている可能性もあります。結果は少し幅を持って読んでください。</span>');
  if(r.initial.flat) flags.push('特定の反応が突出しているというより、状況によって反応が変わりやすいタイプでした<br><span class="faint">8軸のどれも中央から10以内です。この場合、結果は「弱点の指摘」ではなく「決まった逃げ道がない」という読み方のほうが近くなります。</span>');
  h += '<div class="card"><h2>回答の読み方について</h2>' + flags.map(function(f){ return '<div class="flag">' + f + '</div>'; }).join("") + '</div>';

  h += '<button class="btn-sub lv-btn' + (state.level >= 3 ? ' hidden' : '') + '" id="btnLv3">さらに深く読む（心理分析・IF→THEN・修復コンパス）</button>';
  h += '</div>'; // /lv2

  /* ---------- LEVEL 3 ---------- */
  h += '<div id="lv3" class="' + (state.level >= 3 ? '' : 'hidden') + '">';

  // PATTERN → BUT → WHY → RISK → RULE
  h += '<div class="card"><h2>あなたの特徴</h2><div class="narr">'
     + '<div class="narr-b"><span class="narr-k">PATTERN</span>' + R.nar.pattern + '</div>'
     + '<div class="narr-b"><span class="narr-k">BUT</span>' + R.nar.but + '</div>'
     + '<div class="narr-b"><span class="narr-k">WHY</span>' + R.nar.why + '</div>'
     + '<div class="narr-b"><span class="narr-k">RISK</span>' + R.nar.risk + '</div>'
     + '<div class="narr-b rule"><span class="narr-k">RULE</span>' + R.nar.rule + '</div>'
     + '</div><div class="prose long">'
     + TEXT.profileText(r).map(function(p){ return '<p>' + p + '</p>'; }).join("")
     + '</div><button class="btn-sub" id="btnWhy">なぜこの結果になった？</button>'
     + '<div id="whyBox" class="hidden"></div></div>';

  // 残りの矛盾
  if(a2.contradictions.length > 1){
    h += '<div class="card"><h2>ほかにも見えた組み合わせ</h2>';
    a2.contradictions.slice(1).forEach(function(c){
      h += '<div class="contra-sub"><div class="contra-t small">' + c.title + '</div><p class="prose">' + c.body + '</p>'
         + (ANALYSIS2.NEED[c.id] ? '<div class="need">' + ANALYSIS2.NEED[c.id] + '</div>' : '')
         + '<div class="basis">根拠：' + c.basis.join("／") + '</div></div>';
    });
    h += '</div>';
  }

  // 責任と自己否定
  h += '<div class="card"><h2>「責任を取る」と「自分を責める」は別</h2>'
     + '<p class="type-inline">' + a2.responsibility.label + '</p>'
     + '<p class="prose">' + a2.responsibility.body + '</p>'
     + '<div class="note" style="margin:14px 0 0">自分を責め続けるほど誠実、という考え方はここでは採りません。責任は、相手の側で起きたことを戻すための作業です。自己否定はその作業を早めません。</div></div>';

  // 初動／立て直しのテキストタイプ
  h += '<div class="card"><h2>あなたの初動反応</h2><p class="type-inline">' + r.initial.label + '</p>'
     + '<p class="prose">' + TEXT.INITIAL_DESC[r.initial.key] + '</p><hr class="sep">'
     + '<h2>あなたの立て直し方</h2><p class="type-inline">' + r.recovery.label + '</p>'
     + '<p class="prose">' + TEXT.RECOVERY_DESC[r.recovery.key] + '</p></div>';

  // IF → THEN
  h += '<div class="card" id="rulesCard"><h2>もし自分がやらかした時の、5つのルール</h2>'
     + '<p class="muted" style="font-size:.9rem">スコアの組み合わせから作られた、あなた向けの IF → THEN です。</p>';
  R.ift.forEach(function(x,i){
    h += '<div class="ifthen"><div class="if-n">' + (i+1) + '</div><div class="if-body">'
       + '<div class="if-l"><span class="k">IF</span>' + x.i + '</div>'
       + '<div class="if-l then"><span class="k">THEN</span>' + x.t + '</div></div></div>';
  });
  h += '</div>';

  // 共通ルール
  h += '<div class="card"><h2>やらかした直後の、全員共通ルール</h2>';
  TEXT.COMMON_RULES.forEach(function(t,i){ h += '<div class="rule common"><div class="rule-n">' + (i+1) + '</div><div>' + t + '</div></div>'; });
  h += '</div>';

  // 過去・現在・未来
  const trg = a2.triggers.length ? a2.triggers[0] : null;
  h += '<div class="card"><h2>過去・現在・未来</h2>'
     + '<div class="tl"><div class="tl-k">過去</div><div>' + (trg ? "あなたが崩れやすいのは、" + trg.name + "でした。" : "特定の条件に偏った崩れ方は見られませんでした。") + '</div></div>'
     + '<div class="tl"><div class="tl-k">現在</div><div>' + (function(){
         const rk = ["F","G","H"].slice().sort(function(a,b){ return n[b]-n[a]; })[0];
         return n[rk] >= 45
           ? ('その瞬間には、' + AXES[rk].name + 'の反応（' + n[rk] + '）が最初に出やすいようです。')
           : ('その瞬間に決まって出る反応は、はっきりしていません（最も高い' + AXES[rk].name + 'でも' + n[rk] + '）。そのぶん、場面ごとの差が出やすいと考えられます。');
       })() + '</div></div>'
     + '<div class="tl"><div class="tl-k">未来</div><div>' + R.ift[0].i + 'とき、' + R.ift[0].t + '　これを持っておくと踏みとどまりやすくなります。</div></div></div>';

  // 修復コンパス
  h += '<div class="card"><h2>修復コンパス</h2>'
     + '<p class="muted" style="font-size:.9rem">実際に何かあったとき、この5方向で整理すると抜けが減ります。</p><div class="compass">';
  TEXT2.COMPASS.forEach(function(c){
    h += '<div class="cmp"><div class="cmp-k">' + c.k + '</div><div class="cmp-j">' + c.ja + '</div><div class="cmp-q">' + c.q + '</div><div class="cmp-h">' + c.hint + '</div></div>';
  });
  h += '</div></div>';

  // 履歴
  if(state.history && state.history.length > 1){
    const prev = state.history[state.history.length-2], now = state.history[state.history.length-1];
    const diffs = AXIS_ORDER.map(function(k){ return {k:k, d:(now.norm[k]-prev.norm[k])}; })
      .sort(function(a,b){ return Math.abs(b.d)-Math.abs(a.d); }).slice(0,3);
    h += '<div class="card"><h2>前回との比較</h2>'
       + '<p class="muted" style="font-size:.88rem">前回：' + new Date(prev.t).toLocaleString("ja-JP") + '<br>今回：' + new Date(now.t).toLocaleString("ja-JP") + '</p>'
       + '<p class="muted" style="font-size:.88rem">性格が良くなった・悪くなったという見方はしません。回答の傾向がどう動いたかだけを表示します。</p>';
    diffs.forEach(function(x){
      h += '<div class="hist"><span>' + AXES[x.k].name + '</span><span class="hist-v">' + prev.norm[x.k] + ' → ' + now.norm[x.k] + '（' + (x.d>0?"+":"") + x.d + '）</span></div>';
    });
    h += '</div>';
  }

  if(!state.history || state.history.length < 2){
    h += '<div class="note">30日ほど間を空けてもう一度診断すると、前回との回答傾向の差をこの端末内だけで比較できます。良くなった・悪くなったという判定はしません。</div>';
  }

  // キャラクター詳細と図鑑
  h += charDetail(ch.initial, "初動");
  if(!ch.same) h += charDetail(ch.recovery, "立て直し");
  if(ch.sub) h += charDetail(ch.sub, "サブ傾向");
  h += '<div class="card"><h2>キャラクター一覧</h2><p class="muted" style="font-size:.9rem">どの反応にも、人間として合理的な理由があります。優劣はありません。</p>' + galleryHTML(true) + '</div>';
  h += '</div>'; // /lv3

  h += '<div class="card"><p class="disclaimer">本診断は心理学研究の知見を参考にした自己理解ツールであり、臨床心理検査・医学的診断・科学的に妥当性が検証済みの心理尺度ではありません。将来の不倫・犯罪・裏切り等を予測するものではありません。回答・履歴・メモは外部に送信されず、この端末内だけに保存されています。</p>'
     + '<button class="btn-sub" id="btnAgain">最初からやり直す</button>'
     + '<button class="btn-sub" id="btnWipe2">保存されたデータを全部削除する</button></div>';

  el.result.innerHTML = h;

  bind("btnLv2", function(){ state.level = Math.max(state.level,2); save();
    document.getElementById("lv2").classList.remove("hidden");
    document.getElementById("btnLv2").classList.add("hidden");
    animateBars(); });
  bind("btnLv3", function(){ state.level = 3; save();
    document.getElementById("lv3").classList.remove("hidden");
    document.getElementById("btnLv3").classList.add("hidden"); });
  bind("btnWhy", function(){
    const box = document.getElementById("whyBox");
    box.classList.toggle("hidden");
    if(!box.innerHTML){
      box.innerHTML = '<div class="why" style="margin-top:12px"><div class="why-t">この文章が使った数値</div>'
        + R.nar.evidence.map(function(e){ return '<div class="why-r"><span>' + e + '</span></div>'; }).join("")
        + '<div class="why-r faint" style="margin-top:8px">これらの組み合わせから文章の分岐を選んでいます。誰にでも当てはまる文章を並べているわけではありません。</div></div>';
    }
  });
  bind("btnAgain", function(){ startQuiz("btnAgain"); });
  bind("btnWipe2", function(){
    if(!confirmTwice("wipe2", "btnWipe2", "もう一度押すと、保存データを全部削除します")) return;
    wipeAll(); save(); renderIntro(); show("intro");
  });
  Array.prototype.forEach.call(el.result.querySelectorAll("[data-go]"), function(b){
    b.onclick = function(){ nav(b.dataset.go); };
  });
  if(state.level >= 2) animateBars();
  requestAnimationFrame(animateBars);
}

function animateBars(){
  Array.prototype.forEach.call(document.querySelectorAll(".bar-fill[data-w]"), function(b){
    b.style.width = b.dataset.w + "%";
  });
}

/* ================= キャラクター図鑑 ================= */
function galleryHTML(full){
  return '<div class="gal">' + CHAR_ORDER.map(function(id){
    const c = CHARS[id];
    return '<div class="gal-item"><div class="gal-art">' + c.svg + '</div>'
      + '<div class="gal-body"><div class="ch-name">' + c.name + '<span class="ch-tag">' + c.tag + '</span></div>'
      + '<div class="gal-copy">「' + c.copy + '」</div>'
      + '<div class="gal-txt">' + c.meaning + '</div>'
      + (full ? '<div class="gal-txt"><span class="det-l">強み</span>' + c.strength + '</div>'
              + '<div class="gal-txt"><span class="det-l">注意点</span>' + c.caution + '</div>'
              + '<div class="motto small">「' + c.motto + '」</div>' : '')
      + '</div></div>';
  }).join("") + '</div>';
}

/* ================================================================
   診断後の体験機能（診断本体とは分離）
   ================================================================ */
function nav(name, arg){
  if(name === "gallery") return renderGallery(haveResult());
  if(name === "values") return renderValues();
  if(name === "memo") return renderMemo();
  if(name === "emergency") return renderEmergency();
  if(name === "sim") return renderSimMenu();
  if(name === "excuse") return renderExcuse();
  if(name === "event") return renderEvent();
  if(name === "share") return renderShare();
  if(name === "rules"){
    state.level = 3; save(); renderResult(); show("result");
    const c = document.getElementById("rulesCard");
    if(c) c.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
}
function backBtn(label){
  return '<button class="btn-sub" id="toolBack">' + (label || "戻る") + '</button>';
}
function toolShell(title, body, lead){
  el.tool.innerHTML = '<div class="card" style="margin-top:18px"><h1 class="tool-h">' + title + '</h1>'
    + (lead ? '<p class="muted" style="font-size:.92rem">' + lead + '</p>' : '') + body
    + backBtn() + '</div>';
  bind("toolBack", function(){
    if(haveResult()){ renderResult(); show("result"); } else { renderIntro(); show("intro"); }
  });
  show("tool");
}

/* ---------- キャラクター図鑑 ---------- */
function renderGallery(full){
  toolShell("キャラクター一覧",
    galleryHTML(full),
    "失敗が起きたときに出やすい反応を11のキャラクターで表しています。良い反応・悪い反応という区別はありません。"
    + (full ? "" : "判定のしくみは、回答への影響を避けるため診断後に表示します。"));
}

/* ---------- 価値観コンパス ---------- */
function renderValues(){
  const chosen = (state.values || []).slice();
  const body = '<div class="vals pick">' + TEXT2.VALUES.map(function(v){
      return '<button class="val-chip pick' + (chosen.indexOf(v.v)>=0?" on":"") + '" data-v="' + v.v + '">' + v.v + '</button>';
    }).join("") + '</div>'
    + '<div class="muted" id="valCount" style="font-size:.9rem;margin:12px 0">3つまで選べます。</div>'
    + '<button class="btn" id="valSave">保存する</button>';
  toolShell("あなたが大事にしたい自分", body,
    "「自分は何を大事にして生きたいか」を3つ選んでください。診断スコアには影響しません。端末内にだけ保存されます。");
  function refresh(){
    document.getElementById("valCount").textContent = chosen.length + " / 3 選択中";
  }
  Array.prototype.forEach.call(el.tool.querySelectorAll(".val-chip.pick"), function(b){
    b.onclick = function(){
      const v = b.dataset.v, i = chosen.indexOf(v);
      if(i >= 0){ chosen.splice(i,1); b.classList.remove("on"); }
      else if(chosen.length < 3){ chosen.push(v); b.classList.add("on"); }
      refresh();
    };
  });
  refresh();
  bind("valSave", function(){
    state.values = chosen; save();
    if(haveResult()){ state.level = Math.max(state.level,2); renderResult(); show("result"); }
    else { renderIntro(); show("intro"); }
  });
}

/* ---------- 未来の自分への緊急メモ ---------- */
function renderMemo(){
  if(!state.memo && haveResult()){ state.memo = TEXT2.futureMemo(RESULT.r, RESULT.a2, RESULT.ch, RESULT.a2.contradictions[0] && RESULT.a2.contradictions[0].title); }
  const val = state.memo || "未来の自分へ。\n\n今のお前はたぶん焦ってる。新しい嘘を足すな。分かっていることだけ、一度に伝えろ。";
  toolShell("未来の自分へ",
    '<textarea id="memoBox" class="memo" rows="14">' + esc(val) + '</textarea>'
    + '<button class="btn" id="memoSave">この端末に保存する</button>'
    + '<div class="note" style="margin-top:12px">緊急モードを開いたとき、最初にこのメモを表示できます。外部には送信されません。</div>',
    "いま冷静な状態で、将来大きな失敗をした自分に向けて書いておく文章です。診断結果から下書きを作ってあります。自由に書き換えてください。");
  bind("memoSave", function(){
    state.memo = document.getElementById("memoBox").value; save();
    const b = document.getElementById("memoSave");
    b.textContent = "保存しました"; setTimeout(function(){ b.textContent = "この端末に保存する"; }, 1600);
  });
}

/* ---------- 緊急モード ---------- */
function renderEmergency(){
  const hasR = haveResult();
  if(hasR && !RESULT) computeAll();
  let panic = null, stepI = -1;
  const steps = TEXT2.emergencySteps(hasR ? RESULT.r : null, hasR ? RESULT.a2 : null);

  function draw(){
    let body;
    if(panic === null){
      body = '<div class="panic-q">今、どれくらい焦っていますか。</div><div class="panic-row">'
        + Array.from({length:11}, function(_,i){ return '<button class="panic-b" data-p="' + i + '">' + i + '</button>'; }).join("")
        + '</div><div class="panic-scale"><span>0 落ち着いている</span><span>10 頭が真っ白</span></div>';
    }else if(stepI === -1){
      const high = panic >= 7;
      body = '<div class="panic-msg">' + (high
        ? "今は、正しい判断を出すより、悪手を1つ減らすほうが大事。決めるのは後でいい。まず呼吸を整えて、下を1つずつ。"
        : "進められそうですね。順番に1つずつ確認していきましょう。") + '</div>'
        + (state.memo ? '<div class="memo-view"><div class="det-l">未来の自分へ（あなたが以前書いたもの）</div>' + esc(state.memo).replace(/\n/g,"<br>") + '</div>' : '')
        + '<button class="btn" id="emStart">STEP 1 へ</button>';
    }else{
      const s = steps[stepI];
      body = '<div class="em-step"><div class="em-n">STEP ' + (stepI+1) + ' / ' + steps.length + '</div>'
        + '<div class="em-t">' + s.t + '</div><div class="em-b">' + s.b + '</div></div>'
        + (stepI < steps.length-1
            ? '<button class="btn" id="emNext">次へ</button>'
            : '<div class="note">ここまでできれば、少なくとも今日、問題をこれ以上大きくすることは避けられます。残りは明日でいい。</div>')
        + (stepI > 0 ? '<button class="btn-sub" id="emPrev">前のステップ</button>' : '');
    }
    toolShell("落ち着いて、順番に", body,
      panic === null ? "これは診断ではありません。今この瞬間、問題をさらに悪化させないための手順です。" : "");
    Array.prototype.forEach.call(el.tool.querySelectorAll(".panic-b"), function(b){
      b.onclick = function(){ panic = parseInt(b.dataset.p,10); draw(); };
    });
    bind("emStart", function(){ stepI = 0; draw(); });
    bind("emNext", function(){ stepI++; draw(); });
    bind("emPrev", function(){ stepI--; draw(); });
  }
  draw();
}

/* ---------- やらかしシミュレーター ---------- */
function renderSimMenu(){
  const body = '<div class="sim-menu">' + SIM.map(function(s){
      return '<button class="sim-card" data-s="' + s.id + '"><span class="sim-cat">' + s.cat + '</span><span class="sim-t">' + s.title + '</span></button>';
    }).join("") + '</div>'
    + '<button class="btn-sub" id="simRandom">ランダムで始める</button>';
  toolShell("やらかしシミュレーター", body,
    "正解・不正解のゲームではありません。選んだことの積み重ねで、状況がどう動くかを見るためのものです。最初の失敗より、そのあとの行動で問題が大きくなることがあります。");
  Array.prototype.forEach.call(el.tool.querySelectorAll(".sim-card"), function(b){
    b.onclick = function(){ runSim(b.dataset.s); };
  });
  bind("simRandom", function(){ runSim(SIM[Math.floor(Math.random()*SIM.length)].id); });
}

function runSim(id){
  const sc = SIM.filter(function(s){ return s.id === id; })[0];
  const st = {sev:0, step:0, log:[]};

  function draw(){
    if(st.step >= sc.steps.length) return finishSim(sc, st);
    const s = sc.steps[st.step];
    const body = (st.step === 0 ? '<div class="scenario">' + sc.intro + '</div>' : '')
      + '<div class="sim-step">STEP ' + (st.step+1) + ' / ' + sc.steps.length + '</div>'
      + '<div class="qtext">' + s.text(st) + '</div>'
      + '<div class="opts">' + s.ch.map(function(c,i){ return '<button class="opt" data-i="' + i + '">' + c.t + '</button>'; }).join("") + '</div>';
    toolShell(sc.cat + "　" + sc.title, body, "");
    Array.prototype.forEach.call(el.tool.querySelectorAll(".opt"), function(b){
      b.onclick = function(){
        const c = s.ch[parseInt(b.dataset.i,10)];
        st.log.push({step:st.step+1, t:c.t, mark:c.mark, sev:c.sev, pivot:c.pivot});
        st.sev += c.sev; st.step++; draw();
      };
    });
  }
  draw();
}

function finishSim(sc, st){
  const marks = {truth:0, repair:0, defense:0, justify:0, avoid:0};
  st.log.forEach(function(l){ marks[l.mark]++; });
  const worst = st.log.slice().sort(function(a,b){ return b.sev - a.sev; })[0];
  const defensive = st.log.filter(function(l){ return l.mark === "defense" || l.mark === "justify"; });
  const avoided = st.log.filter(function(l){ return l.mark === "avoid"; });
  const repaired = st.log.filter(function(l){ return l.mark === "repair" || l.mark === "truth"; });

  let matchTxt = "";
  if(haveResult()){
    const n = RESULT.r.norm, total = st.log.length;
    const rows = [
      {label:"防衛的な反論", rate:marks.defense/total, axis:n.G, name:"防衛的反発"},
      {label:"理由づけ", rate:marks.justify/total, axis:n.F, name:"自己正当化"},
      {label:"先送り・沈黙", rate:marks.avoid/total, axis:n.H, name:"回避・隠蔽"}
    ];
    const same = [], diff = [];
    rows.forEach(function(r){
      const high = r.rate >= 0.3;
      if(high && r.axis >= 52) same.push(r.label + "は診断（" + r.name + " " + r.axis + "）と同じ方向に出ました");
      else if(high && r.axis < 45) diff.push(r.label + "は診断（" + r.name + " " + r.axis + "）より強く出ました");
      else if(!high && r.axis >= 58) diff.push(r.label + "は診断（" + r.name + " " + r.axis + "）ほどは出ませんでした");
    });
    matchTxt = '<div class="det"><span class="det-l">診断と一致した部分</span>' + (same.length ? same.join("。") + "。" : "はっきり一致した項目はありませんでした。") + '</div>'
      + '<div class="det"><span class="det-l">意外に違った部分</span>' + (diff.length ? diff.join("。") + "。" : "大きく外れた項目はありませんでした。") + '</div>';
  }

  const endState = st.sev <= -3 ? "問題は起きたままですが、これ以上は広がっていません。相手の側に、対応された記録が残りました。"
    : (st.sev <= 1 ? "問題は残っています。大きくはなっていませんが、相手の中では終わっていません。"
    : "元の失敗そのものより、そのあとの対応で状況が大きくなりました。");

  const body = '<div class="sim-end">' + endState + '</div>'
    + '<div class="det"><span class="det-l">今回の分岐点</span>'
      + (worst && worst.sev > 0
          ? (worst.pivot || ("STEP " + worst.step + "「" + worst.t + "」を選んだところから、話の性質が変わりました。"))
          : "大きく悪化させる選択はありませんでした。最初の判断で流れが決まっています。")
    + '</div>'
    + '<div class="det"><span class="det-l">防衛反応が出たところ</span>' + (defensive.length ? defensive.map(function(l){ return "STEP " + l.step; }).join("、") + "（反論・理由づけ）" : "ありませんでした。") + '</div>'
    + '<div class="det"><span class="det-l">先送りしたところ</span>' + (avoided.length ? avoided.map(function(l){ return "STEP " + l.step; }).join("、") : "ありませんでした。") + '</div>'
    + '<div class="det"><span class="det-l">修復に向かったところ</span>' + (repaired.length ? repaired.map(function(l){ return "STEP " + l.step; }).join("、") : "ありませんでした。") + '</div>'
    + matchTxt
    + '<div class="note">これは正解を測るものではありません。ただ、最初の失敗より「そのあとの2回目の選択」で状況が変わることは、実際によくあります。</div>'
    + '<button class="btn" id="simAgain">別のシナリオをやる</button>';
  toolShell("このシミュレーションで出たあなた", body, "");
  bind("simAgain", renderSimMenu);
}

/* ---------- 言い訳翻訳機 ---------- */
function renderExcuse(){
  const body = '<div class="ex-list">' + EXCUSES.map(function(e,i){
      return '<button class="ex-b" data-i="' + i + '">' + e.t + '</button>';
    }).join("") + '</div><div id="exOut"></div>';
  toolShell("その言葉、何を守ろうとしてる？", body,
    "言いたくなったことのある言葉を選んでみてください。断定はしません。その言葉に含まれている可能性のあるものを表示します。");
  Array.prototype.forEach.call(el.tool.querySelectorAll(".ex-b"), function(b){
    b.onclick = function(){

      document.getElementById("exOut").scrollIntoView({behavior:"smooth", block:"nearest"});

/* ---------- 実際の出来事整理モード ---------- */
function renderEvent(){
  const ans = {};
  let i = 0;
  function draw(){
    if(i >= EVENT_Q.length) return eventResult(ans);
    const q = EVENT_Q[i];
    const body = '<div class="sim-step">' + (i+1) + ' / ' + EVENT_Q.length + '</div>'
      + '<div class="qtext">' + q.q + '</div>'
      + '<div class="opts">' + q.o.map(function(o,j){ return '<button class="opt" data-j="' + j + '">' + o + '</button>'; }).join("") + '</div>'
      + (i > 0 ? '<button class="btn-sub" id="evPrev">前に戻る</button>' : '');
    toolShell("実際にあった出来事を整理する", body,
      i === 0 ? "自由記述はありません。選ぶだけです。入力内容は保存も送信もされません。" : "");
    Array.prototype.forEach.call(el.tool.querySelectorAll(".opt"), function(b){
      b.onclick = function(){ ans[q.k] = q.o[parseInt(b.dataset.j,10)]; i++; draw(); };
    });
    bind("evPrev", function(){ i--; draw(); });
  }
  draw();
}

function eventResult(ans){
  const hasR = haveResult();
  const n = hasR ? RESULT.r.norm : null;
  const trg = hasR && RESULT.a2.triggers.length ? RESULT.a2.triggers[0] : null;

  // 状況から、今いちばん注意すべきことを組み立てる
  const cautions = [];
  if(ans.known === "まだ知られていない"){
    cautions.push("まだ知られていない状態は、判断がいちばん歪みやすい局面です。「黙っていれば済む」という選択肢が見えている間は、開示の判断を先送りしやすくなります。");
  }
  if(ans.known === "一部知られている"){
    cautions.push("一部だけ知られている状態では、小出しになりやすくなります。あとから追加で出てくる情報は、内容よりも「隠していた」という印象を強めます。");
  }
  if(ans.known === "すべて知られている"){
    cautions.push("すべて知られている状態では、説明を増やしたくなりやすい局面です。ここで必要なのは説明の量ではなく、責任の言語化と具体的な回復です。");
  }
  if(ans.intent === "自分で選んでやった"){
    cautions.push("自分で選んだ行動の場合、「そうせざるを得なかった理由」が非常に見つかりやすくなります。理由は理由として置いて、選んだ事実は分けて扱ってください。");
  }
  if(ans.resp === "小さい"){
    cautions.push("自分の責任は小さいと感じている場合でも、相手にとっての大きさは別に存在します。責任の見積もりが小さいほど、対応が相手の期待とずれやすくなります。");
  }
  if(ans.impact === "大きい"){
    cautions.push("影響が大きい場合、謝罪だけでは相手の状態は変わりません。何がどこまで戻せるのかを具体的に示すほうが、結果的に負担が減ります。");
  }
  if(ans.done === "まだ何もしていない"){
    cautions.push("まだ何もしていない場合、最初の一報の早さがそのあと全部に効きます。完璧な説明を待たず、分かっている範囲だけを先に伝える方法があります。");
  }
  if(ans.done === "謝罪した"){
    cautions.push("謝罪が済んでいる場合、次は「これから何をするか」です。謝罪の反復より、ひとつの具体的な行動のほうが伝わります。");
  }

  const personal = [];
  if(hasR){
    const rk = ["F","G","H"].slice().sort(function(a,b){ return n[b]-n[a]; })[0];
    personal.push({F:"あなたはこの局面で理由づけが動きやすいほうです（自己正当化 "+n.F+"）。筋の通った説明を思いついたら、それを言う前に、自分が選んだ部分を1つ書き出してください。",
                   G:"あなたはこの局面で言い返す反応が出やすいほうです（防衛的反発 "+n.G+"）。相手の言い方が気になっても、最初の返信は保留してください。",
                   H:"あなたはこの局面で先送りが起きやすいほうです（回避・隠蔽 "+n.H+"）。今日中に、内容ではなく「いつ連絡するか」だけ決めてください。"}[rk]);
    if(trg) personal.push("あなたの回答では、" + trg.name + "に判断が変わりやすい傾向がありました（" + trg.score + "／100）。今の状況がそれに当てはまるなら、いつもより一段ゆっくり動いてください。");
    if(n.S >= 58) personal.push("落ち込みが強く出るタイプです。自分を責める時間を区切らないと、相手への対応が遅れます。");
  }

  const body = '<div class="det"><span class="det-l">整理した内容</span>'
      + EVENT_Q.map(function(q){ return ans[q.k] ? ('<span class="p-chip">' + ans[q.k] + '</span>') : ""; }).join("") + '</div>'
    + '<div class="card inner"><h3>今、いちばん注意したほうがいいこと</h3>' + cautions.slice(0,3).map(function(c){ return '<p class="prose">' + c + '</p>'; }).join("") + '</div>'
    + '<div class="card inner"><h3>最初に整理すること</h3>'
      + '<div class="compass">' + TEXT2.COMPASS.map(function(c){ return '<div class="cmp"><div class="cmp-k">' + c.k + '</div><div class="cmp-j">' + c.ja + '</div><div class="cmp-q">' + c.q + '</div></div>'; }).join("") + '</div></div>'
    + (personal.length ? '<div class="card inner"><h3>あなたの防衛反応が出そうな場所</h3>' + personal.map(function(p){ return '<p class="prose">' + p + '</p>'; }).join("") + '</div>' : '')
    + '<div class="card inner"><h3>修復で考えること</h3>'
      + '<p class="prose">相手の負担を減らす方向で、今日から3日以内にできることを1つ決めてください。許してもらうことを目標にしないほうが、結果的に修復は進みます。' + (ans.impact === "大きい" ? "影響が大きい場合は、進捗を途中でも共有すること自体が回復行動になります。" : "") + '</p></div>'
    + '<div class="note">入力内容はどこにも保存されていません。この画面を離れると消えます。</div>';
  toolShell("この出来事の整理", body, "");
}

  let detail = false;
  function draw(){
    const body = '<div class="share-card" id="shareCard">'
      + '<div class="sh-brand">失敗したときの自分</div>'
      + '<div class="sh-k">問題が起きた時、自分の中に出てくるもの</div>'
      + '<div class="sh-pair">'
        + '<div class="sh-one"><div class="sh-art">' + cN.svg + '</div><div class="sh-role">初動</div><div class="sh-nm">' + cN.name + '</div></div>'
        + '<div class="sh-arrow">→</div>'
        + '<div class="sh-one"><div class="sh-art">' + cR.svg + '</div><div class="sh-role">立て直し</div><div class="sh-nm">' + cR.name + '</div></div>'
      + '</div>'
      + '<div class="sh-copy">「' + cN.copy + '」' + (ch.same ? '' : '<br>「' + cR.copy + '」') + '</div>'
      + '<div class="sh-gap">理解―実行ギャップ <strong>' + r.gap.value + '</strong> / 100</div>'
      + (detail ? '<div class="sh-detail">' + ["A","B","C","D","E","F","G","H"].map(function(k){ return '<span>' + AXES[k].name + ' ' + r.norm[k] + '</span>'; }).join("") + '</div>' : '')
      + '<div class="sh-note">性格の良し悪しを判定するものではありません。追い詰められた時に出やすい反応を見るための自己理解ツールです。</div>'
      + '</div>'
      + '<label class="sh-toggle"><input type="checkbox" id="shDetail"' + (detail?" checked":"") + '> 8軸などの詳細スコアも入れる</label>'
      + '<div class="note">初期状態では、回避・隠蔽や自己正当化などの数値は含まれません。スクリーンショットで保存してください。共有は手動で、あなたが選んだ相手にだけ。</div>';
    toolShell("共有用カード", body, "この画面をスクリーンショットして使えます。外部には何も送信されません。");
    const cb = document.getElementById("shDetail");
    if(cb) cb.onchange = function(){ detail = cb.checked; draw(); };
  }
  draw();
}

.mini{display:flex;align-items:center;gap:6px;margin-bottom:7px;font-size:.72rem;}
.mini-l{flex:0 0 auto;width:56px;color:var(--text-sub);line-height:1.35;}
.mini-t{flex:1 1 auto;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;}
.mini-f{display:block;height:100%;background:var(--accent);border-radius:3px;}
.mini-f.risk{background:var(--risk);}
.mini-v{flex:0 0 auto;width:20px;text-align:right;font-variant-numeric:tabular-nums;color:var(--text-faint);}
.plv{border-top:1px solid var(--line);padding:14px 0;}
.plv-h{font-size:.88rem;font-weight:700;margin-bottom:10px;}

/* ---------- 分析文 ---------- */
.narr-b{padding:14px 0;border-top:1px solid var(--line);font-size:.97rem;line-height:1.9;}
.narr-b:first-child{border-top:none;padding-top:0;}
.narr-k{display:block;font-size:.7rem;letter-spacing:.12em;color:var(--text-faint);margin-bottom:4px;}
.narr-b.rule{font-weight:600;}
.why{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--surface-2);}
.why-t{font-size:.78rem;color:var(--text-faint);margin-bottom:8px;}
.why-r{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;padding:3px 0;}
.why-v{font-variant-numeric:tabular-nums;font-weight:700;}
.tl{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:.94rem;line-height:1.8;}
.tl:first-of-type{border-top:none;}
.tl-k{flex:0 0 auto;width:40px;font-size:.78rem;color:var(--text-faint);padding-top:5px;}
.hist{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem;}
.hist-v{font-variant-numeric:tabular-nums;color:var(--text-sub);}

/* ---------- IF→THEN ---------- */
.ifthen{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line);}
.ifthen:first-of-type{border-top:none;}
.if-n{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;margin-top:2px;}
.if-body{flex:1 1 auto;min-width:0;}
.if-l{font-size:.95rem;line-height:1.7;display:flex;gap:8px;}
.if-l .k{flex:0 0 auto;font-size:.68rem;letter-spacing:.1em;color:var(--text-faint);padding-top:5px;width:34px;}
.if-l.then{margin-top:4px;font-weight:600;}

/* ---------- 修復コンパス ---------- */
.compass{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
.cmp{border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.cmp-k{font-size:.68rem;letter-spacing:.12em;color:var(--accent);}
.cmp-j{font-weight:700;font-size:.98rem;margin:2px 0 4px;}
.cmp-q{font-size:.88rem;line-height:1.7;color:var(--text-sub);}
.cmp-h{font-size:.78rem;color:var(--text-faint);margin-top:4px;}

/* ---------- 図鑑 ---------- */
.gal{display:flex;flex-direction:column;gap:14px;margin-top:14px;}
.gal-item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line);}
.gal-item:first-child{border-top:none;padding-top:4px;}
.gal-art{flex:0 0 auto;width:68px;}
.gal-body{flex:1 1 auto;min-width:0;}
.gal-copy{font-size:.86rem;color:var(--text);font-weight:600;margin-top:4px;}
.gal-txt{font-size:.85rem;line-height:1.75;color:var(--text-sub);margin-top:6px;}

/* ---------- チェックポイント ---------- */
.checkpoint{text-align:center;}
.cp-n{font-size:.74rem;letter-spacing:.1em;color:var(--text-faint);}
.cp-t{font-size:1.5rem;font-weight:700;margin:6px 0;}
.cp-c{font-size:.9rem;color:var(--text-sub);}
.cp-next{font-size:1rem;font-weight:600;margin-bottom:6px;}

/* ---------- ツール画面 ---------- */
.tool-h{font-size:1.28rem;}
.memo{width:100%;border:1px solid var(--line-strong);border-radius:12px;padding:14px;font-family:inherit;font-size:.95rem;line-height:1.85;background:var(--surface);color:var(--text);resize:vertical;margin-bottom:12px;}
.memo-view{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface-2);font-size:.92rem;line-height:1.9;margin-bottom:14px;}
.panic-q{font-size:1.1rem;font-weight:600;margin-bottom:14px;}
.panic-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.panic-b{padding:12px 0;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);font-size:1rem;cursor:pointer;}
.panic-scale{display:flex;justify-content:space-between;font-size:.74rem;color:var(--text-faint);margin-top:8px;}
.panic-msg{font-size:1rem;line-height:1.9;margin-bottom:16px;padding:14px;border-radius:12px;background:var(--accent-soft);color:var(--text);}
.em-step{border:1px solid var(--line-strong);border-radius:14px;padding:18px 16px;margin-bottom:16px;}
.em-n{font-size:.72rem;letter-spacing:.1em;color:var(--text-faint);}
.em-t{font-size:1.24rem;font-weight:700;line-height:1.6;margin:6px 0 10px;}
.em-b{font-size:.95rem;line-height:1.9;color:var(--text-sub);}
.sim-menu{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
.sim-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;}
.sim-cat{font-size:.72rem;color:var(--text-faint);letter-spacing:.06em;}
.sim-t{font-size:1.05rem;font-weight:700;}
.sim-step{font-size:.72rem;letter-spacing:.1em;color:var(--text-faint);margin-bottom:8px;}
.sim-end{font-size:1.05rem;line-height:1.9;font-weight:600;padding:14px;border-radius:12px;background:var(--surface-2);margin-bottom:16px;}
.ex-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.ex-b{padding:10px 14px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-size:.88rem;cursor:pointer;}
.ex-b.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.ex-out{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface-2);}
.ex-q{font-size:1.1rem;font-weight:700;margin-bottom:12px;}
.p-chip{display:inline-block;padding:4px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line-strong);font-size:.82rem;margin:4px 6px 0 0;}
.card.inner{background:var(--surface-2);margin-top:14px;}
.lead-list{display:flex;flex-direction:column;gap:8px;margin:16px 0;}
.lead-i{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;line-height:1.7;color:var(--text-sub);}
.lead-i span{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:4px;}
.vals{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.val-chip{display:inline-block;padding:8px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.9rem;font-weight:600;}
.val-chip.pick{background:var(--surface);color:var(--text);border:1px solid var(--line-strong);cursor:pointer;}
.val-chip.pick.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.vgap{padding:12px 0;border-top:1px solid var(--line);}
.vgap-h{font-weight:700;font-size:.98rem;margin-bottom:4px;}
.vgap-b{font-size:.9rem;line-height:1.8;color:var(--text-sub);}

/* ---------- 共有カード ---------- */
.share-card{border:1px solid var(--line-strong);border-radius:20px;padding:24px 18px 20px;background:var(--surface);text-align:center;box-shadow:0 1px 0 var(--line) inset;}
.sh-brand{font-size:.82rem;font-weight:700;letter-spacing:.04em;color:var(--accent);}
.sh-k{font-size:.74rem;letter-spacing:.06em;color:var(--text-faint);margin-top:4px;}
.sh-pair{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 4px;}
.sh-one{flex:1 1 0;min-width:0;}
.sh-art{width:88px;margin:0 auto;}
.sh-role{font-size:.7rem;letter-spacing:.08em;color:var(--text-faint);margin-top:6px;}
.sh-nm{font-size:1.16rem;font-weight:700;line-height:1.4;}
.sh-arrow{flex:0 0 auto;color:var(--text-faint);font-size:1rem;padding-bottom:22px;}
.sh-copy{margin-top:12px;padding:14px 12px;border-radius:12px;background:var(--surface-2);font-size:.95rem;line-height:1.85;font-weight:600;}
.sh-detail{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:.76rem;color:var(--text-sub);display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;}
.sh-note{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:.7rem;line-height:1.7;color:var(--text-faint);}
.sh-gap{margin-top:12px;font-size:.82rem;color:var(--text-sub);}
.sh-gap strong{font-size:1.1rem;color:var(--text);}
.prose.long{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
.sh-foot{margin-top:16px;font-size:.7rem;color:var(--text-faint);letter-spacing:.04em;}
.sh-toggle{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--text-sub);margin:14px 0;}

@media (max-width:360px){
  .ch-art{width:78px;} .ch-name{font-size:1.14rem;}
  .tool-grid{grid-template-columns:1fr;}
  .hotcold{grid-template-columns:1fr;}
}
</style>
